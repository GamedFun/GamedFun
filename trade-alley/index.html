<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Alley</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #111827;
      --panel: #192235;
      --panel-2: #243149;
      --text: #f8fafc;
      --muted: #9ca3af;
      --border: rgba(255,255,255,.12);
      --good: #22c55e;
      --bad: #fb7185;
      --gold: #fbbf24;
      --blue: #38bdf8;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% 18%, rgba(251,191,36,.22), transparent 24rem),
        radial-gradient(circle at 88% 8%, rgba(56,189,248,.2), transparent 24rem),
        linear-gradient(180deg, #111827 0%, #0f172a 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }
    .brand, .home-link { text-decoration: none; font-weight: 900; }
    .brand { color: var(--gold); font-size: 1.1rem; }
    .home-link {
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .7rem;
      font-size: .82rem;
    }
    main {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 1.2rem;
      display: grid;
      gap: 1rem;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: .95;
      letter-spacing: 0;
    }
    .subtitle { color: var(--muted); margin-top: .45rem; font-weight: 700; }
    .score {
      background: rgba(25,34,53,.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .9rem 1rem;
      min-width: 150px;
      text-align: right;
    }
    .label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .value {
      color: var(--gold);
      font-size: 1.55rem;
      font-weight: 1000;
    }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: 1rem;
    }
    .panel {
      background: rgba(25,34,53,.92);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 42px rgba(0,0,0,.28);
    }
    .trade {
      min-height: 440px;
      padding: 1.1rem;
      display: grid;
      gap: 1rem;
      align-content: start;
    }
    .npc {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .9rem;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--gold), var(--blue));
      display: grid;
      place-items: center;
      font-size: 2rem;
      box-shadow: 0 14px 30px rgba(0,0,0,.28);
    }
    .npc-name { font-size: 1.25rem; font-weight: 1000; }
    .npc-line { color: var(--muted); font-weight: 700; margin-top: .15rem; }
    .offer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .75rem;
      align-items: stretch;
    }
    .item-box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
      display: grid;
      gap: .5rem;
      min-height: 150px;
    }
    .item-icon { font-size: 2rem; }
    .item-name { font-size: 1.1rem; font-weight: 1000; }
    .item-value { color: var(--muted); font-size: .88rem; font-weight: 800; }
    .swap {
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 1.8rem;
      font-weight: 1000;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
    }
    button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      font-weight: 1000;
      padding: .8rem .9rem;
    }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .accept { background: var(--good); color: #052e16; }
    .cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .steal { background: var(--bad); color: #fff; }
    .new { background: var(--gold); color: #422006; }
    .log {
      color: var(--text);
      min-height: 1.4rem;
      font-size: .95rem;
      font-weight: 800;
    }
    .inventory {
      padding: 1rem;
      display: grid;
      gap: .8rem;
      align-content: start;
    }
    .inventory-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .8rem;
    }
    .items {
      display: grid;
      gap: .55rem;
    }
    .inv-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .65rem .72rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: .65rem;
    }
    .inv-item.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(251,191,36,.16);
    }
    .inv-icon { font-size: 1.3rem; }
    .inv-name { font-weight: 900; }
    .inv-value { color: var(--muted); font-size: .82rem; font-weight: 800; }
    .empty {
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
      font-weight: 800;
    }
    @media (max-width: 760px) {
      .top, .grid, .offer { grid-template-columns: 1fr; }
      .score { text-align: left; }
      .swap { transform: rotate(90deg); }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">gamed.fun</a>
    <a class="home-link" href="/">All games</a>
  </header>

  <main>
    <section class="top">
      <div>
        <h1>Trade Alley</h1>
        <p class="subtitle">Random NPCs show up with deals. Trade clean, cancel, or risk a steal.</p>
      </div>
      <div class="score">
        <div class="label">Net Worth</div>
        <div class="value" id="netWorth">0</div>
      </div>
    </section>

    <section class="grid">
      <div class="trade panel">
        <div class="npc">
          <div class="avatar" id="npcAvatar">🧳</div>
          <div>
            <div class="label">Trader</div>
            <div class="npc-name" id="npcName">Loading...</div>
            <div class="npc-line" id="npcLine">Looking for a deal.</div>
          </div>
        </div>

        <div class="offer">
          <div class="item-box">
            <div class="label">You give</div>
            <div class="item-icon" id="giveIcon">?</div>
            <div class="item-name" id="giveName">Choose an item</div>
            <div class="item-value" id="giveValue">Value 0</div>
          </div>
          <div class="swap">⇄</div>
          <div class="item-box">
            <div class="label">NPC gives</div>
            <div class="item-icon" id="takeIcon">?</div>
            <div class="item-name" id="takeName">Mystery offer</div>
            <div class="item-value" id="takeValue">Value 0</div>
          </div>
        </div>

        <div class="actions">
          <button class="accept" id="acceptBtn" type="button">Accept</button>
          <button class="cancel" id="cancelBtn" type="button">Cancel</button>
          <button class="steal" id="stealBtn" type="button">Steal 50/50</button>
        </div>
        <div class="log" id="log">A trader is waiting.</div>
        <button class="new" id="newRunBtn" type="button">New run</button>
      </div>

      <div class="inventory panel">
        <div class="inventory-head">
          <div>
            <div class="label">Inventory</div>
            <div class="npc-line">Tap an item to offer it</div>
          </div>
          <div class="label"><span id="turnCount">0</span> deals</div>
        </div>
        <div class="items" id="inventory"></div>
      </div>
    </section>
  </main>

  <script>
    const items = [
      { name: 'Rusty Coin', icon: '🪙', value: 8 },
      { name: 'Lucky Sock', icon: '🧦', value: 11 },
      { name: 'Blue Gem', icon: '💎', value: 26 },
      { name: 'Tiny Crown', icon: '👑', value: 42 },
      { name: 'Old Map', icon: '🗺️', value: 18 },
      { name: 'Potion', icon: '🧪', value: 22 },
      { name: 'Golden Key', icon: '🔑', value: 34 },
      { name: 'Moon Rock', icon: '🌕', value: 48 },
      { name: 'Dragon Scale', icon: '🐉', value: 65 },
      { name: 'Star Jar', icon: '✨', value: 76 },
      { name: 'Time Watch', icon: '⌚', value: 90 },
      { name: 'Void Crystal', icon: '🔮', value: 120 }
    ];
    const npcs = [
      { name: 'Mira the Merchant', icon: '🧳', line: 'I only make fair-ish deals.' },
      { name: 'Bucket Bob', icon: '🪣', line: 'No refunds. Probably.' },
      { name: 'Captain Cash', icon: '🧢', line: 'This trade could be huge.' },
      { name: 'Glitch Vendor', icon: '📟', line: 'The numbers look normal to me.' },
      { name: 'Gem Kid', icon: '🛹', line: 'I found this behind the arcade.' }
    ];

    const inventoryEl = document.getElementById('inventory');
    const netWorthEl = document.getElementById('netWorth');
    const turnCountEl = document.getElementById('turnCount');
    const npcAvatar = document.getElementById('npcAvatar');
    const npcName = document.getElementById('npcName');
    const npcLine = document.getElementById('npcLine');
    const giveIcon = document.getElementById('giveIcon');
    const giveName = document.getElementById('giveName');
    const giveValue = document.getElementById('giveValue');
    const takeIcon = document.getElementById('takeIcon');
    const takeName = document.getElementById('takeName');
    const takeValue = document.getElementById('takeValue');
    const acceptBtn = document.getElementById('acceptBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const stealBtn = document.getElementById('stealBtn');
    const newRunBtn = document.getElementById('newRunBtn');
    const logEl = document.getElementById('log');

    let inventory = [];
    let selectedIndex = 0;
    let offer = null;
    let deals = 0;

    function freshItem(base = randomItem()) {
      return { ...base, id: `${base.name}-${Date.now()}-${Math.random()}` };
    }

    function randomItem() {
      const roll = Math.random();
      const pool = roll > .86 ? items.slice(8) : roll > .54 ? items.slice(3, 9) : items.slice(0, 6);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function startRun() {
      inventory = [
        freshItem(items[0]),
        freshItem(items[1]),
        freshItem(items[4]),
        freshItem(items[5])
      ];
      selectedIndex = 0;
      deals = 0;
      logEl.textContent = 'A trader is waiting.';
      nextOffer();
    }

    function nextOffer() {
      if (!inventory.length) {
        offer = null;
        render();
        logEl.textContent = 'You have nothing left. Start a new run.';
        return;
      }
      selectedIndex = Math.min(selectedIndex, inventory.length - 1);
      const npc = npcs[Math.floor(Math.random() * npcs.length)];
      const give = inventory[selectedIndex];
      let take = freshItem(randomItem());
      let guard = 0;
      while (take.name === give.name && guard < 8) {
        take = freshItem(randomItem());
        guard++;
      }
      offer = { npc, take };
      render();
    }

    function netWorth() {
      return inventory.reduce((sum, item) => sum + item.value, 0);
    }

    function selectedItem() {
      return inventory[selectedIndex] || null;
    }

    function render() {
      const give = selectedItem();
      const locked = !offer || !give;
      netWorthEl.textContent = netWorth();
      turnCountEl.textContent = deals;
      acceptBtn.disabled = locked;
      cancelBtn.disabled = !offer;
      stealBtn.disabled = locked;

      if (offer) {
        npcAvatar.textContent = offer.npc.icon;
        npcName.textContent = offer.npc.name;
        npcLine.textContent = offer.npc.line;
        takeIcon.textContent = offer.take.icon;
        takeName.textContent = offer.take.name;
        takeValue.textContent = `Value ${offer.take.value}`;
      } else {
        npcAvatar.textContent = '🧳';
        npcName.textContent = 'No trader';
        npcLine.textContent = 'Start a new run.';
        takeIcon.textContent = '?';
        takeName.textContent = 'No offer';
        takeValue.textContent = 'Value 0';
      }

      if (give) {
        giveIcon.textContent = give.icon;
        giveName.textContent = give.name;
        giveValue.textContent = `Value ${give.value}`;
      } else {
        giveIcon.textContent = '∅';
        giveName.textContent = 'Nothing left';
        giveValue.textContent = 'Value 0';
      }

      inventoryEl.innerHTML = '';
      if (!inventory.length) {
        inventoryEl.innerHTML = '<div class="empty">Your inventory is empty.</div>';
        return;
      }
      inventory.forEach((item, index) => {
        const row = document.createElement('button');
        row.className = `inv-item${index === selectedIndex ? ' selected' : ''}`;
        row.type = 'button';
        row.innerHTML = `<span class="inv-icon">${item.icon}</span><span><span class="inv-name">${item.name}</span><br><span class="inv-value">Value ${item.value}</span></span><span>Offer</span>`;
        row.addEventListener('click', () => {
          selectedIndex = index;
          nextOffer();
          logEl.textContent = `Offering ${item.name}.`;
        });
        inventoryEl.appendChild(row);
      });
    }

    function finishDeal(text) {
      deals++;
      logEl.textContent = text;
      nextOffer();
    }

    acceptBtn.addEventListener('click', () => {
      const give = selectedItem();
      if (!offer || !give) return;
      inventory.splice(selectedIndex, 1, offer.take);
      finishDeal(`Accepted: traded ${give.name} for ${offer.take.name}.`);
    });

    cancelBtn.addEventListener('click', () => {
      if (!offer) return;
      finishDeal('Canceled. A new trader walked in.');
    });

    stealBtn.addEventListener('click', () => {
      const give = selectedItem();
      if (!offer || !give) return;
      if (Math.random() < .5) {
        inventory.push(offer.take);
        finishDeal(`Steal worked. You kept ${give.name} and took ${offer.take.name}.`);
      } else {
        inventory.splice(selectedIndex, 1);
        finishDeal(`Steal failed. You lost ${give.name} and got nothing back.`);
      }
    });

    newRunBtn.addEventListener('click', startRun);
    startRun();
  </script>
</body>
</html>
