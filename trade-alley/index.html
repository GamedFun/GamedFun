  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b1020;
      --panel: #141d31;
      --panel-2: #1b263e;
      --text: #f6f8fc;
      --muted: #94a3c4;
      --border: rgba(148,180,255,.14);
      --good: #34d399;
      --bad: #fb7185;
      --gold: #fcc44d;
      --gold-2: #ff9d3c;
      --blue: #4cc9f0;
      --purple: #c084fc;
      --r-common: #8aa0c6;
      --r-uncommon: #5fe39a;
      --r-rare: #56b8f5;
      --r-epic: #c389ff;
      --r-legendary: #ffc24b;
    }
    html, body { overflow-x: hidden; }
    body {
      position: relative;
      min-height: 100vh;
      background:
        radial-gradient(120% 90% at 14% -8%, rgba(252,196,77,.16), transparent 42%),
        radial-gradient(120% 90% at 92% -4%, rgba(76,201,240,.18), transparent 42%),
        radial-gradient(140% 120% at 50% 116%, rgba(192,132,252,.12), transparent 50%),
        linear-gradient(180deg, #0d1326 0%, #0a0f1f 60%, #080c18 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* faint perspective "alley floor" + soft vignette */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        repeating-linear-gradient(115deg, rgba(255,255,255,.018) 0 2px, transparent 2px 70px),
        radial-gradient(130% 100% at 50% 100%, transparent 55%, rgba(0,0,0,.5) 100%);
      mask: linear-gradient(180deg, transparent, #000 55%);
    }
    /* string-light shimmer across the top of the alley */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: -10%;
      width: 120%; height: 3px;
      pointer-events: none;
      z-index: 1;
      background: repeating-linear-gradient(90deg,
        var(--gold) 0 4px, transparent 4px 9px,
        var(--blue) 9px 13px, transparent 13px 30px);
      filter: blur(.6px) drop-shadow(0 0 6px rgba(252,196,77,.5));
      opacity: .55;
      animation: lights 6s linear infinite;
    }
    @keyframes lights { to { background-position: 60px 0; } }
    header, main { position: relative; z-index: 2; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.03), transparent);
      backdrop-filter: blur(4px);
    }
    .brand, .home-link { text-decoration: none; font-weight: 900; }
    .brand { align-items: center; color: var(--gold); display: inline-flex; font-size: 1.1rem; gap: .42rem; filter: drop-shadow(0 2px 6px rgba(252,196,77,.35)); }
    .brand-mark { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; }
    .home-link {
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .7rem;
      font-size: .82rem;
    }
    main {
      width: min(1040px, 100%);
      margin: 0 auto;
      padding: 1.2rem;
      display: grid;
      gap: 1rem;
    }
    .top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: end;
    }
    h1 {
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: .95;
      letter-spacing: -.01em;
      background: linear-gradient(180deg, #fff 8%, var(--gold) 60%, var(--gold-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 18px rgba(252,196,77,.28));
    }
    .subtitle { color: var(--muted); margin-top: .5rem; font-weight: 700; }
    .score {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(252,196,77,.1), transparent 60%),
        rgba(20,29,49,.92);
      border: 1px solid rgba(252,196,77,.3);
      border-radius: 14px;
      padding: .85rem 1.1rem;
      min-width: 162px;
      text-align: right;
      box-shadow: 0 12px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .score::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.14) 50%, transparent 60%);
      transform: translateX(-120%);
      animation: sheen 5.5s ease-in-out 1.5s infinite;
    }
    @keyframes sheen { 0%,72%{ transform: translateX(-120%);} 88%,100%{ transform: translateX(120%);} }
    .label {
      color: var(--muted);
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .value {
      color: var(--gold);
      font-size: 1.7rem;
      font-weight: 1000;
      letter-spacing: -.01em;
      transition: color .25s;
      text-shadow: 0 0 18px rgba(252,196,77,.4);
    }
    .value.flash-up { animation: worthUp .55s ease; }
    .value.flash-down { animation: worthDown .55s ease; }
    @keyframes worthUp   { 0%,100%{color:var(--gold)} 45%{color:#5ef0a3;transform:scale(1.14)} }
    @keyframes worthDown { 0%,100%{color:var(--gold)} 45%{color:#fb7185;transform:scale(0.95)} }
    @keyframes stealPulse { 0%,100%{opacity:1} 50%{opacity:.45} }
    .profit-pop {
      position: fixed;
      font-weight: 1000;
      font-size: 1.15rem;
      pointer-events: none;
      z-index: 9999;
      text-shadow: 0 2px 10px rgba(0,0,0,.5);
      animation: profitFloat 1s cubic-bezier(.2,.8,.3,1) forwards;
    }
    @keyframes profitFloat {
      0%   { opacity: 1; transform: translateY(0) scale(.9); }
      18%  { transform: translateY(-8px) scale(1.18); }
      100% { opacity: 0; transform: translateY(-58px) scale(1.05); }
    }
    .spark {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      font-size: 1rem;
      animation: sparkFly .8s ease-out forwards;
    }
    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0,0) scale(.6) rotate(0); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(180deg); }
    }
    button.flipping { animation: stealPulse .45s ease-in-out infinite; pointer-events:none; }
    button:active:not(:disabled):not(.flipping) { transform: translateY(1px) scale(0.97); transition: transform .08s; }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: 1rem;
    }
    .panel {
      position: relative;
      background:
        linear-gradient(180deg, rgba(255,255,255,.035), transparent 30%),
        rgba(20,29,49,.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 48px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(6px);
    }
    .trade {
      min-height: 440px;
      padding: 1.1rem;
      display: grid;
      gap: 1rem;
      align-content: start;
    }
    .npc {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 1rem;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .avatar {
      position: relative;
      width: 66px;
      height: 66px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      background:
        linear-gradient(135deg, #20304f, #16203a);
      box-shadow: 0 14px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.08);
      isolation: isolate;
    }
    /* rotating conic glow ring around the trader */
    .avatar::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 20px;
      padding: 2px;
      background: conic-gradient(from 0deg, var(--gold), var(--blue), var(--purple), var(--gold));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      animation: spin 8s linear infinite;
      z-index: -1;
    }
    .avatar.swap-in { animation: avatarPop .45s cubic-bezier(.2,1.3,.4,1); }
    @keyframes avatarPop { 0%{ transform: scale(.6) rotate(-12deg); opacity:.2;} 100%{ transform: none; opacity:1;} }
    @keyframes spin { to { transform: rotate(360deg); } }
    .npc-name { font-size: 1.3rem; font-weight: 1000; letter-spacing: -.01em; }
    .npc-line { color: var(--muted); font-weight: 700; margin-top: .15rem; }
    .offer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: .75rem;
      align-items: stretch;
    }
    .item-box {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,.06), transparent 60%),
        var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      display: grid;
      gap: .5rem;
      min-height: 152px;
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    /* rarity-tinted top edge + glow, set via --rar */
    .item-box[data-rar], .inv-item[data-rar] { --rar: var(--r-common); }
    .item-box[data-rar]::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--rar), transparent);
      opacity: .9;
    }
    .item-box[data-rar="epic"], .item-box[data-rar="legendary"] {
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--rar) 40%, transparent), 0 14px 34px rgba(0,0,0,.3);
    }
    .item-box.pulse { animation: itemPop .4s cubic-bezier(.2,1.2,.4,1); }
    @keyframes itemPop { 0%{ transform: scale(.92); } 60%{ transform: scale(1.03);} 100%{ transform: none;} }
    .item-icon {
      font-size: 2.3rem;
      width: 3.4rem; height: 3.4rem;
      display: grid; place-items: center;
      border-radius: 14px;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.12), rgba(0,0,0,.18));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 6px 14px rgba(0,0,0,.3);
      filter: drop-shadow(0 0 8px color-mix(in srgb, var(--rar, transparent) 60%, transparent));
    }
    .item-name { font-size: 1.12rem; font-weight: 1000; letter-spacing: -.01em; }
    .item-value { color: var(--muted); font-size: .86rem; font-weight: 800; }
    .swap {
      display: grid;
      place-items: center;
      color: var(--gold);
      font-size: 1.6rem;
      font-weight: 1000;
      text-shadow: 0 0 14px rgba(252,196,77,.5);
      animation: swapBob 2.4s ease-in-out infinite;
    }
    @keyframes swapBob { 0%,100%{ transform: translateX(-2px);} 50%{ transform: translateX(2px);} }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
    }
    button {
      position: relative;
      overflow: hidden;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      font-weight: 1000;
      padding: .82rem .9rem;
      letter-spacing: .01em;
      transition: transform .1s, box-shadow .2s, filter .2s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 18px rgba(0,0,0,.28);
    }
    button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 12px 24px rgba(0,0,0,.34); }
    /* glossy shine sweep on hover */
    button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.28) 50%, transparent 58%);
      transform: translateX(-130%);
      transition: transform .55s ease;
    }
    button:hover:not(:disabled)::after { transform: translateX(130%); }
    button:disabled { cursor: not-allowed; opacity: .42; box-shadow: none; }
    .accept { background: linear-gradient(180deg, #4cf0a8, #18b878); color: #042417; }
    .add { background: linear-gradient(180deg, #6dd6f7, #2a9fdc); color: #062335; }
    .haggle { background: linear-gradient(180deg, #cf9bff, #9a4ff0); color: #fff; }
    .cancel { background: rgba(255,255,255,.04); border: 1px solid var(--border); color: var(--muted); box-shadow: none; }
    .cancel:hover:not(:disabled) { color: var(--text); }
    .steal { background: linear-gradient(180deg, #ff8aa0, #e0455f); color: #fff; }
    .new {
      background: linear-gradient(180deg, var(--gold), var(--gold-2));
      color: #3a1d00;
      padding: .9rem;
      font-size: 1rem;
    }
    .quality-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .14rem .5rem;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 900;
      margin-left: .4rem;
      letter-spacing: .04em;
      vertical-align: middle;
    }
    .quality-badge::before { content: ""; width: .42rem; height: .42rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
    .q-good { background: rgba(52,211,153,.16); color: #5ef0a3; }
    .q-fair { background: rgba(252,196,77,.16); color: #fcc44d; }
    .q-bad  { background: rgba(251,113,133,.18); color: #fb7185; }
    .log {
      color: var(--text);
      min-height: 1.4rem;
      font-size: .95rem;
      font-weight: 800;
      padding: .55rem .8rem;
      border-radius: 10px;
      background: rgba(0,0,0,.22);
      border: 1px solid var(--border);
      border-left: 3px solid var(--gold);
    }
    .log.flash { animation: logFlash .5s ease; }
    @keyframes logFlash { 0%{ background: rgba(252,196,77,.18);} 100%{ background: rgba(0,0,0,.22);} }
    .inventory {
      padding: 1rem;
      display: grid;
      gap: .8rem;
      align-content: start;
    }
    .inventory-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .8rem;
    }
    .items {
      display: grid;
      gap: .55rem;
    }
    .inv-item {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--rar, transparent) 12%, transparent), transparent 40%),
        var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .65rem .72rem;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: .65rem;
      cursor: pointer;
      text-align: left;
      transition: transform .14s, border-color .2s, box-shadow .2s, background .2s;
    }
    .inv-item::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--rar, transparent);
      box-shadow: 0 0 8px var(--rar, transparent);
    }
    .inv-item:hover { transform: translateX(3px); border-color: color-mix(in srgb, var(--rar) 50%, var(--border)); box-shadow: 0 6px 16px rgba(0,0,0,.28); }
    .inv-item.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(252,196,77,.2), 0 8px 18px rgba(0,0,0,.3);
    }
    .inv-item .tag { color: var(--muted); font-size: .68rem; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
    .inv-item.selected .tag { color: var(--gold); opacity: 1; }
    .inv-icon {
      font-size: 1.35rem;
      width: 2.2rem; height: 2.2rem;
      display: grid; place-items: center;
      border-radius: 10px;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.1), rgba(0,0,0,.2));
      filter: drop-shadow(0 0 6px color-mix(in srgb, var(--rar, transparent) 55%, transparent));
    }
    .inv-name { font-weight: 900; }
    .inv-value { color: var(--muted); font-size: .82rem; font-weight: 800; }
    .empty {
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 1.4rem 1rem;
      text-align: center;
      font-weight: 800;
    }
    @media (max-width: 760px) {
      .top, .grid, .offer { grid-template-columns: 1fr; }
      .score { text-align: left; }
      .swap { transform: rotate(90deg); animation: none; }
      .actions { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      header { padding: .5rem .75rem; }
      h1 { font-size: clamp(1.5rem, 8vw, 2.5rem); }
      main { padding: .75rem; }
    }
    @keyframes pageIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none; } }
    body { animation: pageIn .3s ease; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; } }
    [data-theme="light"] {
      --bg: #eef1f7; --panel: #ffffff; --panel-2: #f3f5fb; --text: #16203a;
      --muted: #5b6b8c; --border: rgba(30,50,90,.14);
      --r-common: #7e8aa6; --r-uncommon: #1fb877; --r-rare: #2a8fd6;
      --r-epic: #9a4ff0; --r-legendary: #d99000;
    }
    [data-theme="light"] body { background: radial-gradient(120% 90% at 14% -8%,rgba(252,196,77,.16),transparent 42%),radial-gradient(120% 90% at 92% -4%,rgba(76,201,240,.16),transparent 42%),linear-gradient(180deg,#f4f6fc,#e9edf6); }
    [data-theme="light"] body::before { background: radial-gradient(130% 100% at 50% 100%, transparent 60%, rgba(30,50,90,.1) 100%); }
    [data-theme="light"] h1 { background: linear-gradient(180deg, #1b2747, var(--gold-2)); -webkit-background-clip: text; background-clip: text; }
    [data-theme="light"] .score { background: linear-gradient(180deg, rgba(252,196,77,.14), transparent 60%), rgba(255,255,255,.95); }
    [data-theme="light"] .panel { background: linear-gradient(180deg, rgba(255,255,255,.6), transparent 30%), rgba(255,255,255,.95); }
    [data-theme="light"] .avatar { background: linear-gradient(135deg, #eef2fb, #dde4f2); }
    [data-theme="light"] .item-icon, [data-theme="light"] .inv-icon { background: radial-gradient(circle at 35% 30%, #fff, #e7ebf4); }
    [data-theme="light"] .log { background: rgba(30,50,90,.05); color: var(--text); }
    [data-theme="light"] .value { text-shadow: none; }
  </style>

<body>
  <header>
    <a class="brand" href="https://gamed.fun/" aria-label="gamed.fun">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fbbf24"/><circle cx="34" cy="40" r="6" fill="#1a1625"/><circle cx="66" cy="40" r="6" fill="#1a1625"/><path d="M30 58 Q50 76 70 58" stroke="#1a1625" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
      <span>gamed.fun</span>
    </a>
    <button id="themeBtn" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;padding:.3rem .55rem;color:var(--muted);line-height:1">☀️</button>
  </header>

  <main>
    <section class="top">
      <div>
        <h1>Trade Alley</h1>
        <p class="subtitle">Random NPCs show up with deals. Trade clean, cancel, or risk a steal.</p>
      </div>
      <div class="score">
        <div class="label">Net Worth</div>
        <div class="value" id="netWorth">0</div>
      </div>
    </section>

    <section class="grid">
      <div class="trade panel">
        <div class="npc">
          <div class="avatar" id="npcAvatar">🧳</div>
          <div>
            <div class="label">Trader</div>
            <div class="npc-name" id="npcName">Loading...</div>
            <div class="npc-line" id="npcLine">Looking for a deal.</div>
          </div>
        </div>

        <div class="offer">
          <div class="item-box" id="giveBox">
            <div class="label">You give</div>
            <div class="item-icon" id="giveIcon">?</div>
            <div class="item-name" id="giveName">Choose an item</div>
            <div class="item-value" id="giveValue">Value 0</div>
          </div>
          <div class="swap">⇄</div>
          <div class="item-box" id="takeBox">
            <div class="label">NPC gives</div>
            <div class="item-icon" id="takeIcon">?</div>
            <div class="item-name" id="takeName">Mystery offer</div>
            <div class="item-value" id="takeValue">Value 0</div>
          </div>
        </div>

        <div class="actions">
          <button class="accept" id="acceptBtn" type="button">✓ Accept</button>
          <button class="add" id="addBtn" type="button">➕ Ask Add</button>
          <button class="haggle" id="haggleBtn" type="button">💬 Haggle</button>
          <button class="cancel" id="cancelBtn" type="button">✕ Cancel</button>
          <button class="steal" id="stealBtn" type="button">🎲 Steal 50/50</button>
        </div>
        <div class="log" id="log">A trader is waiting.</div>
        <button class="new" id="newRunBtn" type="button">New run</button>
      </div>

      <div class="inventory panel">
        <div class="inventory-head">
          <div>
            <div class="label">Inventory</div>
            <div class="npc-line">Tap an item to offer it</div>
          </div>
          <div class="label"><span id="turnCount">0</span> deals</div>
        </div>
        <div class="items" id="inventory"></div>
      </div>
    </section>
  </main>

  <script>
    const itemIcons = ['🪙', '💎', '👑', '🗺️', '🧪', '🔑', '🌕', '✨', '⌚', '🔮', '📀', '🎲', '🧲', '🪩', '📦', '🛡️', '⚙️', '🧭', '💿', '🏺'];
    const itemAdjectives = [
      'Rusty', 'Lucky', 'Blue', 'Tiny', 'Old', 'Golden', 'Moonlit', 'Glowing', 'Silent', 'Crystal',
      'Silver', 'Hidden', 'Neon', 'Ancient', 'Broken', 'Polished', 'Secret', 'Frozen', 'Solar', 'Velvet',
      'Electric', 'Prism', 'Midnight', 'Copper', 'Emerald'
    ];
    const itemNouns = [
      'Coin', 'Gem', 'Crown', 'Map', 'Potion', 'Key', 'Rock', 'Jar', 'Watch', 'Crystal',
      'Disc', 'Die', 'Magnet', 'Mirror', 'Box', 'Shield', 'Gear', 'Compass', 'Token', 'Vase'
    ];
    const traderFirstNames = [
      'Mira', 'Bob', 'Cash', 'Juno', 'Nova', 'Pixel', 'Rex', 'Zara', 'Kip', 'Luna',
      'Max', 'Ivy', 'Theo', 'Nico', 'Sage', 'Vera', 'Otto', 'Milo', 'Remy', 'Tess',
      'Axel', 'Mina', 'Rafi', 'Nell', 'Cora', 'Finn', 'Lex', 'Skye', 'Arlo', 'June',
      'Pax', 'Wren', 'Bea', 'Kai', 'Noor', 'Ezra', 'Faye', 'Hugo', 'Rina', 'Sol'
    ];
    const traderTitles = [
      'the Merchant', 'the Broker', 'the Swapper', 'the Collector', 'the Bargainer',
      'the Appraiser', 'the Courier', 'the Dealer', 'the Haggler', 'the Finder',
      'the Valuer', 'the Seller', 'the Buyer', 'the Trader', 'the Peddler',
      'the Keeper', 'the Negotiator', 'the Vendor', 'the Auctioneer', 'the Scout',
      'the Reseller', 'the Importer', 'the Exporter', 'the Middleman', 'the Stockpiler'
    ];
    const traderLines = [
      'I only make fair-ish deals.',
      'No refunds. Probably.',
      'This trade could be huge.',
      'The numbers look normal to me.',
      'I found this behind the arcade.',
      'Take the deal or test your luck.',
      'A clean trade keeps everyone calm.',
      'I know what this is worth.',
      'This offer will not wait forever.',
      'Risk makes the market interesting.'
    ];
    const items = buildItems();
    const npcs = buildTraders();
    const tradeTiers = [
      { min: 0, label: 'Starter', boost: 1 },
      { min: 1_000, label: 'Better', boost: 2.4 },
      { min: 10_000, label: 'Elite', boost: 8 },
      { min: 100_000, label: 'Legend', boost: 30 },
      { min: 1_000_000, label: 'Millionaire', boost: 120 },
      { min: 10_000_000, label: 'Mythic', boost: 520 },
      { min: 100_000_000, label: 'Cosmic', boost: 2_500 }
    ];

    const inventoryEl = document.getElementById('inventory');
    const netWorthEl = document.getElementById('netWorth');
    const turnCountEl = document.getElementById('turnCount');
    const npcAvatar = document.getElementById('npcAvatar');
    const npcName = document.getElementById('npcName');
    const npcLine = document.getElementById('npcLine');
    const giveBox = document.getElementById('giveBox');
    const giveIcon = document.getElementById('giveIcon');
    const giveName = document.getElementById('giveName');
    const giveValue = document.getElementById('giveValue');
    const takeBox = document.getElementById('takeBox');
    const takeIcon = document.getElementById('takeIcon');
    const takeName = document.getElementById('takeName');
    const takeValue = document.getElementById('takeValue');
    const acceptBtn = document.getElementById('acceptBtn');
    const addBtn = document.getElementById('addBtn');
    const haggleBtn = document.getElementById('haggleBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const stealBtn = document.getElementById('stealBtn');
    const newRunBtn = document.getElementById('newRunBtn');
    const logEl = document.getElementById('log');
    const SAVE_KEY = 'trade_alley_save';

    let inventory = [];
    let selectedIndex = 0;
    let offer = null;
    let deals = 0;

    function buildItems() {
      const generated = [];
      itemAdjectives.forEach((adjective, adjectiveIndex) => {
        itemNouns.forEach((noun, nounIndex) => {
          const index = generated.length;
          generated.push({
            name: `${adjective} ${noun}`,
            icon: itemIcons[index % itemIcons.length],
            value: Math.round((8 + adjectiveIndex * 14 + nounIndex * 9 + (index % 7)) * (1 + adjectiveIndex / 12))
          });
        });
      });
      return generated;
    }

    function buildTraders() {
      const generated = [];
      traderFirstNames.forEach((first, firstIndex) => {
        traderTitles.forEach((title, titleIndex) => {
          const index = generated.length;
          generated.push({
            name: `${first} ${title}`,
            icon: ['🧳', '🪣', '🧢', '📟', '🛹', '💼', '🎩', '🧾', '📻', '🛒'][index % 10],
            line: traderLines[(firstIndex + titleIndex) % traderLines.length]
          });
        });
      });
      return generated;
    }

    function freshItem(base = randomItem(), multiplier = 1) {
      return {
        ...base,
        value: Math.max(1, Math.round(base.value * multiplier)),
        id: `${base.name}-${Date.now()}-${Math.random()}`
      };
    }

    function randomItem(tier = currentTier()) {
      const roll = Math.random();
      const start = Math.min(items.length - 1, Math.floor(Math.log10(tier.min || 1) * 24));
      const size = roll > .86 ? 180 : roll > .54 ? 120 : 70;
      const end = Math.min(items.length, start + size);
      const pool = items.slice(start, end);
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function currentTier() {
      const worth = netWorth();
      return tradeTiers.reduce((best, tier) => worth >= tier.min ? tier : best, tradeTiers[0]);
    }

    function offerMultiplier(tier) {
      const luck = .9 + Math.random() * .8;
      return tier.boost * luck;
    }

    function formatValue(value) {
      return new Intl.NumberFormat('en-US', { notation: value >= 100_000 ? 'compact' : 'standard', maximumFractionDigits: 1 }).format(value);
    }

    // Rarity is judged relative to your current average item value, so it stays
    // meaningful as the whole economy scales up across tiers.
    function rarityOf(value) {
      const ref = Math.max(1, netWorth() / Math.max(1, inventory.length));
      const ratio = value / ref;
      if (ratio >= 3) return 'legendary';
      if (ratio >= 1.8) return 'epic';
      if (ratio >= 1.1) return 'rare';
      if (ratio >= 0.6) return 'uncommon';
      return 'common';
    }
    const rarityColor = {
      common: 'var(--r-common)', uncommon: 'var(--r-uncommon)', rare: 'var(--r-rare)',
      epic: 'var(--r-epic)', legendary: 'var(--r-legendary)'
    };
    function applyRarity(el, value) {
      const r = rarityOf(value);
      el.dataset.rar = r;
      el.style.setProperty('--rar', rarityColor[r]);
    }

    function startRun() {
      inventory = [
        freshItem(items[0]),
        freshItem(items[1]),
        freshItem(items[4]),
        freshItem(items[5])
      ];
      selectedIndex = 0;
      deals = 0;
      logEl.textContent = 'A trader is waiting.';
      nextOffer();
      saveGame();
    }

    function nextOffer() {
      if (!inventory.length) {
        offer = null;
        render();
        logEl.textContent = 'You have nothing left. Start a new run.';
        saveGame();
        return;
      }
      selectedIndex = Math.min(selectedIndex, inventory.length - 1);
      const npc = npcs[Math.floor(Math.random() * npcs.length)];
      const give = inventory[selectedIndex];
      const tier = currentTier();
      let take = freshItem(randomItem(tier), offerMultiplier(tier));
      let guard = 0;
      while (take.name === give.name && guard < 8) {
        take = freshItem(randomItem(tier), offerMultiplier(tier));
        guard++;
      }
      offer = { npc, take, tier: tier.label };
      render();
      retrigger(npcAvatar, 'swap-in');
      retrigger(takeBox, 'pulse');
      saveGame();
    }

    function retrigger(el, cls) {
      if (!el) return;
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }

    function netWorth() {
      return inventory.reduce((sum, item) => sum + item.value, 0);
    }

    function selectedItem() {
      return inventory[selectedIndex] || null;
    }

    function render() {
      const give = selectedItem();
      const locked = !offer || !give;
      netWorthEl.textContent = formatValue(netWorth());
      document.title = `♦ ${formatValue(netWorth())} — Trade Alley`;
      turnCountEl.textContent = deals;
      acceptBtn.disabled = locked;
      addBtn.disabled = locked || Boolean(offer?.askedAdd);
      haggleBtn.disabled = locked || Boolean(offer?.haggled);
      cancelBtn.disabled = !offer;
      stealBtn.disabled = locked;

      if (offer) {
        npcAvatar.textContent = offer.npc.icon;
        npcName.textContent = offer.npc.name;
        npcLine.textContent = offer.npc.line;
        takeIcon.textContent = offer.take.icon;
        takeName.textContent = offer.addOn ? `${offer.take.name} + ${offer.addOn.name}` : offer.take.name;
        const totalOffer = offer.take.value + (offer.addOn?.value || 0);
        const addLabel = offer.addOn ? ` · add-on ${formatValue(offer.addOn.value)}` : '';
        const giveVal = give ? give.value : 1;
        const ratio = totalOffer / giveVal;
        const qualityCls = ratio >= 1.2 ? 'q-good' : ratio >= 0.8 ? 'q-fair' : 'q-bad';
        const qualityText = ratio >= 1.2 ? 'Good' : ratio >= 0.8 ? 'Fair' : 'Bad';
        takeValue.innerHTML = `Value ${formatValue(totalOffer)}${addLabel} · ${offer.tier || currentTier().label} trade <span class="quality-badge ${qualityCls}">${qualityText}</span>`;
        applyRarity(takeBox, totalOffer);
      } else {
        npcAvatar.textContent = '🧳';
        npcName.textContent = 'No trader';
        npcLine.textContent = 'Start a new run.';
        takeIcon.textContent = '?';
        takeName.textContent = 'No offer';
        takeValue.textContent = 'Value 0';
        takeBox.removeAttribute('data-rar');
        takeBox.style.removeProperty('--rar');
      }

      if (give) {
        giveIcon.textContent = give.icon;
        giveName.textContent = give.name;
        giveValue.textContent = `Value ${formatValue(give.value)}`;
        applyRarity(giveBox, give.value);
      } else {
        giveIcon.textContent = '∅';
        giveName.textContent = 'Nothing left';
        giveValue.textContent = 'Value 0';
        giveBox.removeAttribute('data-rar');
        giveBox.style.removeProperty('--rar');
      }

      inventoryEl.innerHTML = '';
      if (!inventory.length) {
        inventoryEl.innerHTML = '<div class="empty">Your inventory is empty.</div>';
        return;
      }
      inventory.forEach((item, index) => {
        const row = document.createElement('button');
        row.className = `inv-item${index === selectedIndex ? ' selected' : ''}`;
        row.type = 'button';
        applyRarity(row, item.value);
        row.innerHTML = `<span class="inv-icon">${item.icon}</span><span><span class="inv-name">${item.name}</span><br><span class="inv-value">Value ${formatValue(item.value)}</span></span><span class="tag">${index === selectedIndex ? 'Offering' : 'Offer'}</span>`;
        row.addEventListener('click', () => {
          selectedIndex = index;
          nextOffer();
          logEl.textContent = `Offering ${item.name}.`;
          saveGame();
        });
        inventoryEl.appendChild(row);
      });
    }

    function finishDeal(text) {
      deals++;
      logEl.textContent = text;
      retrigger(logEl, 'flash');
      nextOffer();
    }

    function acceptCurrentOffer(message) {
      const give = selectedItem();
      if (!offer || !give) return;
      const acceptedOffer = offer;
      inventory.splice(selectedIndex, 1, acceptedOffer.take);
      if (acceptedOffer.addOn) inventory.push(acceptedOffer.addOn);
      finishDeal(message || `Accepted: traded ${give.name} for ${acceptedOffer.addOn ? `${acceptedOffer.take.name} and ${acceptedOffer.addOn.name}` : acceptedOffer.take.name}.`);
    }

    function saveGame() {
      try {
        localStorage.setItem(SAVE_KEY, JSON.stringify({
          inventory,
          selectedIndex,
          offer,
          deals,
          log: logEl.textContent
        }));
      } catch {}
    }

    function loadGame() {
      try {
        const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
        if (!saved || !Array.isArray(saved.inventory)) return false;
        inventory = saved.inventory;
        selectedIndex = Math.min(saved.selectedIndex || 0, Math.max(inventory.length - 1, 0));
        offer = saved.offer || null;
        deals = saved.deals || 0;
        logEl.textContent = saved.log || 'Welcome back.';
        if (inventory.length && !offer) nextOffer();
        else render();
        return true;
      } catch {
        return false;
      }
    }

    acceptBtn.addEventListener('click', () => {
      const give = selectedItem();
      if (!offer || !give) return;
      const prev = netWorth();
      acceptCurrentOffer();
      flashWorth(prev);
    });

    addBtn.addEventListener('click', () => {
      const give = selectedItem();
      if (!offer || !give || offer.askedAdd) return;
      offer.askedAdd = true;
      const tier = currentTier();
      if (Math.random() < .75) {
        const addOn = freshItem(randomItem(tier), offerMultiplier(tier) * .35);
        offer.addOn = addOn;
        render();
        logEl.textContent = `${offer.npc.name} said yes and added ${addOn.name}. Do you want to accept the trade?`;
        saveGame();
      } else {
        finishDeal(`${offer.npc.name} said no to adding anything. A new trader walked in.`);
      }
    });

    haggleBtn.addEventListener('click', () => {
      const give = selectedItem();
      if (!offer || !give || offer.haggled) return;
      offer.haggled = true;
      if (Math.random() < 0.6) {
        const boost = 1.2 + Math.random() * 0.2;
        offer.take = freshItem(offer.take, boost);
        offer.tier = currentTier().label;
        render();
        logEl.textContent = `${offer.npc.name} agreed to sweeten the deal.`;
      } else {
        finishDeal(`${offer.npc.name} didn't budge and walked away. A new trader arrived.`);
      }
    });

    cancelBtn.addEventListener('click', () => {
      if (!offer) return;
      finishDeal('Canceled. A new trader walked in.');
    });

    stealBtn.addEventListener('click', () => {
      const give = selectedItem();
      if (!offer || !give) return;
      const prevWorth = netWorth();
      [acceptBtn, addBtn, haggleBtn, cancelBtn, stealBtn].forEach(b => b.disabled = true);
      stealBtn.classList.add('flipping');
      stealBtn.textContent = 'Flipping…';
      const capturedOffer = offer;
      const capturedIndex = selectedIndex;
      setTimeout(() => {
        stealBtn.classList.remove('flipping');
        stealBtn.textContent = 'Steal 50/50';
        if (Math.random() < .5) {
          inventory.push(capturedOffer.take);
          if (capturedOffer.addOn) inventory.push(capturedOffer.addOn);
          finishDeal(`Steal worked. You kept ${give.name} and took the offer.`);
        } else {
          inventory.splice(capturedIndex, 1);
          finishDeal(`Steal failed. You lost ${give.name} and got nothing back.`);
        }
        flashWorth(prevWorth);
      }, 900);
    });

    function flashWorth(prevWorth) {
      const current = netWorth();
      const el = document.getElementById('netWorth');
      const cls = current >= prevWorth ? 'flash-up' : 'flash-down';
      el.classList.remove('flash-up', 'flash-down');
      void el.offsetWidth;
      el.classList.add(cls);
      el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });

      const delta = current - prevWorth;
      if (delta !== 0) {
        const rect = el.getBoundingClientRect();
        const pop = document.createElement('div');
        pop.className = 'profit-pop';
        pop.textContent = (delta > 0 ? '+' : '') + formatValue(delta);
        pop.style.color = delta > 0 ? '#4ade80' : '#fb7185';
        pop.style.left = `${rect.left + rect.width / 2}px`;
        pop.style.top  = `${rect.top}px`;
        document.body.appendChild(pop);
        pop.addEventListener('animationend', () => pop.remove());
        if (delta > 0) burstSparks(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
    }

    function burstSparks(x, y) {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const glyphs = ['✦', '✧', '⭑', '✨', '·'];
      for (let i = 0; i < 7; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.textContent = glyphs[i % glyphs.length];
        s.style.left = `${x}px`;
        s.style.top = `${y}px`;
        s.style.color = i % 2 ? 'var(--gold)' : 'var(--blue)';
        const ang = (Math.PI * 2 * i) / 7 + Math.random();
        const dist = 28 + Math.random() * 34;
        s.style.setProperty('--dx', `${Math.cos(ang) * dist}px`);
        s.style.setProperty('--dy', `${Math.sin(ang) * dist - 14}px`);
        document.body.appendChild(s);
        s.addEventListener('animationend', () => s.remove());
      }
    }

    newRunBtn.addEventListener('click', startRun);
    if (!loadGame()) startRun();
    document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
    function toggleTheme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('gf-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}
  </script>
</body>
</html>
