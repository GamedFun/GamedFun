<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loop Park - Console</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23e8935a'/%3E%3Cstop offset='55%25' stop-color='%237a9de8'/%3E%3Cstop offset='100%25' stop-color='%23e0a0d0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Crect x='7' y='10' width='18' height='15' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cline x1='16' y1='10' x2='16' y2='5' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='4' r='1.6' fill='white'/%3E%3Ccircle cx='12' cy='17.5' r='1.8' fill='white'/%3E%3Ccircle cx='20' cy='17.5' r='1.8' fill='white'/%3E%3Cline x1='12' y1='22' x2='20' y2='22' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #101410;
    --panel: #161c16;
    --line: #263426;
    --fg: #d8f0d8;
    --fg-dim: #6f8a6f;
    --accent: #7ee2a0;
    --accent-b: #ff9166;
    --danger: #ff6b6b;
    --grad: linear-gradient(135deg, #8b5cf6, #ec4899 55%, #6366f1);
    --card: linear-gradient(180deg, #171a24, #12141b);
    --font-display: 'Baloo 2', ui-rounded, 'Segoe UI', sans-serif;
    /* One bright, chunky "character" color per card - Pico-Park-style
       variety instead of every panel matching. */
    --pop-yellow: #ffd76a;
    --pop-blue: #7a9de8;
    --pop-pink: #e0a0d0;
    --pop-green: #7ee2a0;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, "IBM Plex Mono", monospace;
    font-size: 14px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 1.25rem 4rem; position: relative; }

  .glow {
    position: fixed; top: -140px; right: -140px; width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(236,72,153,0.30), rgba(139,92,246,0.16) 45%, transparent 70%);
    pointer-events: none; z-index: 0;
  }

  .shell { display: flex; gap: 1.5rem; align-items: flex-start; position: relative; z-index: 1; }

  .sidebar {
    width: 190px; flex: none; position: sticky; top: 2rem;
    background: var(--card); border: 2px solid var(--line); border-radius: 20px;
    padding: 1.1rem 0.8rem; display: flex; flex-direction: column; gap: 0.3rem;
    box-shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  .brand { display: flex; align-items: center; gap: 0.6rem; padding: 0.3rem 0.5rem 1.1rem; font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 50%; background: var(--pop-yellow);
    flex: none; position: relative; border: 2px solid #1a1408;
  }
  .brand-mark::before, .brand-mark::after {
    content: ""; position: absolute; width: 3px; height: 3px; border-radius: 50%;
    background: #1a1408; top: 40%;
  }
  .brand-mark::before { left: 32%; }
  .brand-mark::after { left: 60%; }
  .nav-item {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.6rem 0.7rem;
    border-radius: 999px; color: var(--fg-dim); text-decoration: none; font-size: 0.82rem;
    font-family: var(--font-display); font-weight: 700; border: 2px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--fg); }
  .nav-item.active { background: var(--pop-yellow); color: #1a1408; border-color: #1a1408; }
  .nav-item:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .nav-icon { width: 15px; height: 15px; flex: none; }

  .main { flex: 1; min-width: 0; }

  .gate {
    position: fixed; inset: 0; z-index: 100; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .gate[hidden] { display: none; }
  .gate-box {
    background: var(--panel); border: 2.5px solid var(--pop-yellow); border-radius: 20px;
    padding: 2rem 2.2rem; width: min(320px, 88vw); text-align: center;
    box-shadow: 0 6px 0 rgba(0,0,0,0.4);
  }
  .gate-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; }
  .gate-sub { color: var(--fg-dim); font-size: 0.85rem; margin-bottom: 1.2rem; }
  .gate-box input {
    width: 100%; background: #0c0f0c; color: var(--fg); border: 2px solid var(--line);
    border-radius: 10px; padding: 0.6rem 0.7rem; font-family: inherit; font-size: 0.9rem;
    margin-bottom: 0.8rem; text-align: center;
  }
  .gate-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .gate-box button {
    width: 100%; background: var(--pop-pink); color: #2a1a24; border: 2.5px solid #1a1017; border-radius: 999px;
    padding: 0.6rem; font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; cursor: pointer;
    box-shadow: 0 5px 0 #1a1017; transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .gate-box button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #1a1017; }
  .gate-box button:disabled { opacity: 0.5; cursor: default; }
  .gate-box button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .gate-error { color: var(--danger); font-size: 0.82rem; min-height: 1.2em; margin-top: 0.7rem; }
  h1 { font-family: var(--font-display); font-size: 1.7rem; margin: 0 0 0.3rem; letter-spacing: 0.01em; }
  .sub { color: var(--fg-dim); margin-bottom: 1.6rem; font-size: 0.92rem; }

  /* Chunky sticker-style cards: thick colored border, hard offset shadow
     instead of a soft blur - each section gets its own bright color. */
  .panel {
    background: var(--card); border: 2.5px solid var(--pop-blue); border-radius: 20px;
    padding: 1.3rem 1.4rem; margin-bottom: 1.4rem; box-shadow: 0 6px 0 rgba(0,0,0,0.4);
  }
  .panel#costPanel { border-color: var(--pop-yellow); }
  .row { display: flex; flex-wrap: wrap; gap: 1rem; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 150px; }
  .field.grow { flex: 1; min-width: 220px; }
  label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-dim); }
  select, input[type=text], input[type=number] {
    background: #0c0f0c; color: var(--fg); border: 2px solid var(--line);
    border-radius: 10px; padding: 0.45rem 0.6rem; font-family: inherit; font-size: 0.85rem;
  }
  select:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .agent-block { border: 2px dashed var(--line); border-radius: 14px; padding: 0.8rem; flex: 1; min-width: 260px; }
  .agent-block .row { gap: 0.6rem; }

  /* Juicy, pressable buttons - a hard shadow that flattens on click. */
  button {
    background: var(--pop-pink); color: #2a1a24; border: 2.5px solid #1a1017; border-radius: 999px;
    padding: 0.6rem 1.4rem; font-family: var(--font-display); font-weight: 700; font-size: 0.95rem;
    cursor: pointer; letter-spacing: 0.01em; box-shadow: 0 5px 0 #1a1017;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #1a1017; }
  button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button.ghost { background: var(--card); border: 2.5px solid var(--line); color: var(--fg); box-shadow: 0 5px 0 var(--line); }
  button.ghost:active:not(:disabled) { box-shadow: 0 1px 0 var(--line); }

  #status { margin-top: 0.8rem; color: var(--fg-dim); min-height: 1.2em; font-size: 0.85rem; }
  #status.err { color: var(--danger); }

  .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  @media (max-width: 780px) { .stage { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .sidebar { width: 100%; position: static; flex-direction: row; overflow-x: auto; gap: 0.4rem; }
    .brand { display: none; }
    .nav-item { white-space: nowrap; }
  }

  /* A bright toy-diorama room, not a dark platformer sky: a cheerful sky
     gradient, a soft sun, rolling hills, and drifting clouds behind the
     play area - a real place the bot stands in, not a panel of tiles. */
  /* Sized small and subtle on purpose - the play area itself is often only
     ~190-320px square (a 4x4 to 6x6 tile grid), so anything scaled for a
     big scene (a 90px sun, 70px clouds) completely overwhelms it. These
     numbers are tuned to read as background ambience peeking through the
     gap cells and the frame's own padding, not as the main event. */
  /* The grid's own pixel width is fixed (cols * cell size) and can exceed
     a narrow phone's viewport on bigger levels (e.g. a 7-wide hard coop
     room) - scroll it inside its own box rather than widening the page. */
  .grid-scroll { max-width: 100%; overflow-x: auto; }
  #gridFrame {
    display: inline-block; padding: 18px 18px 0; border-radius: 20px; overflow: hidden;
    border: 2.5px solid var(--pop-green); box-shadow: 0 6px 0 rgba(0,0,0,0.4);
    position: relative;
    background:
      radial-gradient(circle 20px at 88% 12%, #fff6cf 0%, #ffe89a 60%, rgba(255,232,154,0) 78%),
      linear-gradient(180deg, #6fb8e8 0%, #a9d9ee 45%, #dff1e0 85%, #eef6d9 100%);
  }
  .clouds { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .clouds::before, .clouds::after {
    content: ""; position: absolute; height: 6px; border-radius: 999px;
    background: rgba(255,255,255,0.8);
  }
  .clouds::before { width: 16px; top: 10%; left: 14%; animation: driftCloud 34s linear infinite; }
  .clouds::after { width: 11px; top: 24%; left: 58%; animation: driftCloud 26s linear infinite reverse; }
  @keyframes driftCloud {
    0% { transform: translateX(0); }
    50% { transform: translateX(10px); }
    100% { transform: translateX(0); }
  }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 14%; pointer-events: none; z-index: 0; overflow: hidden; }
  .hills::before, .hills::after {
    content: ""; position: absolute; bottom: -40%; border-radius: 50%;
  }
  .hills::before { left: -8%; width: 55%; height: 100%; background: #bfe3c2; opacity: 0.75; }
  .hills::after { right: -10%; width: 60%; height: 110%; background: #a9d9b0; opacity: 0.65; }
  @media (prefers-reduced-motion: reduce) {
    .clouds::before, .clouds::after { animation: none; }
  }
  #grid { position: relative; z-index: 1; }

  .tile, .bot {
    position: absolute; top: 0; left: 0; width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.16s ease;
  }
  .tile { border-radius: 3px; box-sizing: border-box; overflow: visible; }
  .tile.floor { background: transparent; }
  /* Walls read as blocking stone pillars, not floor you can stand on -
     a narrow column rather than a full tile, echoing the reference scene. */
  .tile.wall { background: transparent; }
  .pillar {
    position: absolute; left: 50%; top: -6px; bottom: -6px; width: 16px;
    transform: translateX(-50%); border-radius: 6px;
    background: linear-gradient(180deg, #f2b26a 0%, #d98c4a 100%);
    border: 2px solid #7a4a22;
    box-shadow: inset -3px 0 0 rgba(0,0,0,0.18), inset 3px 0 0 rgba(255,255,255,0.35);
  }
  /* Lava is now an open gap - no platform at all, just sky showing through,
     so stepping there reads as falling through, not touching a hazard tile. */
  .tile.lava { background: transparent; }
  .tile.goal {
    background: transparent;
    animation: goalPulse 1.8s ease-in-out infinite;
  }
  .tile.plate { background: transparent; }
  .tile.door { transition: transform 0.16s ease; }

  .tile-img-fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile-img-icon { width: 22px; height: auto; object-fit: contain; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }
  .tile-icon { width: 22px; height: 22px; image-rendering: pixelated; image-rendering: crisp-edges; }
  .door-img {
    width: 30px; height: auto; transition: opacity 0.2s ease, filter 0.2s ease;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.5));
  }
  .tile.door.open .door-img { opacity: 0.35; filter: hue-rotate(80deg) brightness(1.3); }

  @keyframes goalPulse {
    0%, 100% { box-shadow: 0 0 6px 1px rgba(126, 226, 160, 0.3); }
    50% { box-shadow: 0 0 15px 3px rgba(126, 226, 160, 0.65); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile.goal { animation: none; }
    .tile, .bot { transition: none; }
  }

  .bot { z-index: 5; pointer-events: none; transition: none; }

  /* Milo, from the shared asset pack, recolored per AI backend. */
  .bot::after {
    content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 4px; background: rgba(0,0,0,0.32); border-radius: 50%; filter: blur(0.5px);
  }
  .bot-sprite {
    position: absolute; left: 50%; top: 1px; transform: translateX(-50%);
    width: 32px; height: auto;
    animation: botIdle 1.1s ease-in-out infinite;
  }
  @keyframes botIdle {
    0%, 100% { transform: translateX(-50%) scaleY(1) scaleX(1) translateY(0); }
    50% { transform: translateX(-50%) scaleY(0.94) scaleX(1.05) translateY(1.5px); }
  }
  @media (prefers-reduced-motion: reduce) { .bot-sprite { animation: none; } }
  .bot-tag {
    position: absolute; top: -3px; right: -3px; width: 14px; height: 14px;
    border-radius: 50%; background: rgba(10, 12, 10, 0.75); border: 1px solid rgba(255,255,255,0.55);
    color: #fff; font-size: 8px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  #log { background: #0b0e0b; border: 2.5px solid var(--pop-pink); border-radius: 20px; padding: 0.8rem 1rem;
         height: 420px; overflow-y: auto; font-size: 0.82rem; line-height: 1.6; box-shadow: 0 6px 0 rgba(0,0,0,0.4); }
  #log .ep { color: var(--accent); margin-top: 0.6rem; font-weight: 700; }
  #log .a { color: var(--accent); }
  #log .b { color: #ffd27a; }
  #log .result { color: var(--fg); font-weight: 700; margin-top: 0.2rem; }
  #log .dim { color: var(--fg-dim); }

  #costTable .num { text-align: right; font-variant-numeric: tabular-nums; }
  #costTable th.num { text-align: right; }
  #costTable td, #costTable th { border-top: 1px solid var(--line); }
  #costTable thead th { border-top: none; }
  #costTable input[type=number] {
    background: #0c0f0c; color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 0.25rem 0.4rem; font-family: inherit; font-size: 0.8rem;
  }
  .rate-unknown { border-color: var(--accent-b) !important; }
  #costRowB.hidden { display: none; }
</style>
</head>
<body>
<div id="gate" class="gate">
  <div class="gate-box">
    <div class="gate-title">Loop Park</div>
    <div class="gate-sub">Enter the access code to continue.</div>
    <input type="password" id="gateInput" placeholder="Access code" autocomplete="off">
    <button id="gateSubmit">Enter</button>
    <div id="gateError" class="gate-error"></div>
  </div>
</div>

<div class="wrap" id="appRoot" hidden>
  <div class="glow" aria-hidden="true"></div>
  <div class="shell">
    <nav class="sidebar">
      <div class="brand"><span class="brand-mark"></span> Loop Park</div>
      <a class="nav-item active" href="#controls">
        <svg class="nav-icon" viewBox="0 0 16 16"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="4" r="1.8" fill="currentColor"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="8" r="1.8" fill="currentColor"/><line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.6"/><circle cx="5" cy="12" r="1.8" fill="currentColor"/></svg>
        Controls
      </a>
      <a class="nav-item" href="#costPanel">
        <svg class="nav-icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4.5v7M10 6c0-1-1-1.5-2-1.5S6 5 6 6s1 1.3 2 1.5 2 .6 2 1.5-1 1.5-2 1.5-2-.5-2-1.5" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Cost
      </a>
      <a class="nav-item" href="#gridFrame">
        <svg class="nav-icon" viewBox="0 0 16 16"><rect x="1.5" y="5" width="13" height="7" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="7.2" r="0.9" fill="currentColor"/><circle cx="12.3" cy="9" r="0.9" fill="currentColor"/><line x1="4" y1="8.5" x2="4" y2="6.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="3" y1="7.5" x2="5" y2="7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Game
      </a>
      <a class="nav-item" href="#log">
        <svg class="nav-icon" viewBox="0 0 16 16"><line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.5"/><line x1="2" y1="12" x2="10" y2="12" stroke="currentColor" stroke-width="1.5"/></svg>
        Log
      </a>
    </nav>

    <div class="main">
  <h1>Loop Park &mdash; Local Console</h1>
  <div class="sub">Real LLM calls, real levels, played back at whatever speed you want.</div>

  <div class="panel" id="controls">
    <div class="row">
      <div class="field">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="single">Single bot</option>
          <option value="coop">Two bots (coop)</option>
        </select>
      </div>
      <div class="field">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="field">
        <label for="episodes">Episodes</label>
        <input type="number" id="episodes" value="4" min="1" max="20">
      </div>
      <div class="field">
        <label for="seed">Seed (optional)</label>
        <input type="text" id="seed" placeholder="random">
      </div>
    </div>

    <div class="row" style="margin-top:1rem;">
      <div class="agent-block">
        <label>Robot A</label>
        <div class="row">
          <div class="field grow">
            <label for="backendA">Backend</label>
            <select id="backendA"></select>
          </div>
          <div class="field grow">
            <label for="modelA">Model</label>
            <select id="modelA"></select>
          </div>
        </div>
        <div class="field" id="customA-wrap" style="display:none; margin-top:0.5rem;">
          <label for="customA">Custom model id</label>
          <input type="text" id="customA">
        </div>
      </div>

      <div class="agent-block" id="agentB-block">
        <label>Robot B</label>
        <div class="row">
          <div class="field grow">
            <label for="backendB">Backend</label>
            <select id="backendB"></select>
          </div>
          <div class="field grow">
            <label for="modelB">Model</label>
            <select id="modelB"></select>
          </div>
        </div>
        <div class="field" id="customB-wrap" style="display:none; margin-top:0.5rem;">
          <label for="customB">Custom model id</label>
          <input type="text" id="customB">
        </div>
      </div>
    </div>

    <div class="row" style="margin-top:1rem;">
      <div class="field grow">
        <label for="speed">Playback speed &mdash; <span id="speedLabel"></span></label>
        <input type="range" id="speed" min="30" max="900" value="250" step="10">
      </div>
    </div>

    <div class="row" style="margin-top:1.1rem;">
      <button id="runBtn">Run</button>
      <button id="replayBtn" class="ghost" disabled>Replay</button>
    </div>
    <div id="status"></div>
  </div>

  <div class="panel" id="costPanel">
    <div class="row" style="justify-content:space-between; align-items:center;">
      <label style="font-size:0.78rem;">Token / cost calculator &mdash; real token counts from the API, rates are estimates you can edit</label>
      <div id="costTotal" style="font-weight:700;">$0.0000</div>
    </div>
    <div style="overflow-x:auto; margin-top:0.6rem;">
      <table id="costTable" style="width:100%; border-collapse:collapse; font-size:0.82rem;">
        <thead>
          <tr style="color:var(--fg-dim); text-align:left;">
            <th style="padding:0.3rem 0.5rem;">Robot</th>
            <th style="padding:0.3rem 0.5rem;">Model</th>
            <th style="padding:0.3rem 0.5rem;" class="num">Tokens in</th>
            <th style="padding:0.3rem 0.5rem;" class="num">Tokens out</th>
            <th style="padding:0.3rem 0.5rem;">$/1M in</th>
            <th style="padding:0.3rem 0.5rem;">$/1M out</th>
            <th style="padding:0.3rem 0.5rem;" class="num">Est. cost</th>
          </tr>

        <tbody>
          <tr id="costRowA">
            <td style="padding:0.3rem 0.5rem;">A</td>

<script>
// Points at the loop-park-backend Render service (github.com/GamedFun/loop-park-backend).
const BACKEND_URL = "https://loop-park-backend.onrender.com";
const API_BASE = BACKEND_URL;

document.querySelectorAll(".nav-item").forEach(item => {
  item.addEventListener("click", () => {
    document.querySelectorAll(".nav-item").forEach(i => i.classList.remove("active"));
    item.classList.add("active");
  });
});

const BACKEND_MODELS = {
  claude: { models: [
      ["claude-haiku-4-5-20251001", "Claude Haiku 4.5"],
      ["claude-sonnet-4-5-20250929", "Claude Sonnet 4.5"],
      ["claude-sonnet-4-6", "Claude Sonnet 4.6"],
      ["claude-sonnet-5", "Claude Sonnet 5"],
    ], custom: false },
  openai: { models: [
      ["gpt-3.5-turbo", "GPT-3.5 Turbo"],
      ["gpt-4", "GPT-4"],
      ["gpt-4o-mini", "GPT-4o mini"],
      ["gpt-4o", "GPT-4o"],
      ["gpt-4.1-mini", "GPT-4.1 mini"],
      ["gpt-4.1", "GPT-4.1"],
      ["o3-mini", "o3-mini"],
      ["o4-mini", "o4-mini"],
      ["gpt-5-mini", "GPT-5 mini"],
      ["gpt-5", "GPT-5"],
      ["gpt-5.1", "GPT-5.1"],
      ["gpt-5.2", "GPT-5.2"],
      ["gpt-5.4", "GPT-5.4"],
      ["gpt-5.5", "GPT-5.5"],
      ["gpt-5.6-luna", "GPT-5.6 Luna"],
      ["gpt-5.6-terra", "GPT-5.6 Terra"],
    ], custom: true },
  gemini: { models: [
      "gemini-3.6-flash", "gemini-3.5-flash",
      "gemini-flash-latest", "gemini-pro-latest", "gemini-flash-lite-latest",
    ], custom: true },
};

// $ per 1,000,000 tokens. Only filled in where I'm actually confident the
// number is current - everything else is left unknown (0, known:false)
// rather than guessed, and the rate fields in the UI are editable so you
// can paste in the real number from the provider's pricing page.
const PRICING = {
  "openai:gpt-3.5-turbo": { in: 0.50, out: 1.50, known: true },
  "openai:gpt-4": { in: 30.00, out: 60.00, known: true },
  "openai:gpt-4o-mini": { in: 0.15, out: 0.60, known: true },
  "openai:gpt-4o": { in: 2.50, out: 10.00, known: true },
  "openai:gpt-4.1-mini": { in: 0.40, out: 1.60, known: true },
  "openai:gpt-4.1": { in: 2.00, out: 8.00, known: true },
  "openai:o3-mini": { in: 1.10, out: 4.40, known: true },
  "claude:claude-haiku-4-5-20251001": { in: 1.00, out: 5.00, known: true },
  "claude:claude-sonnet-4-5-20250929": { in: 3.00, out: 15.00, known: true },
};

function getRate(spec) {
  if (spec.startsWith("ollama:") || spec === "ollama") return { in: 0, out: 0, known: true, free: true };
  return PRICING[spec] || { in: 0, out: 0, known: false };
}

function fillBackendSelect(sel) {
  sel.innerHTML = "";
  for (const key of Object.keys(BACKEND_MODELS)) {
    const opt = document.createElement("option");
    opt.value = key;
    opt.textContent = key[0].toUpperCase() + key.slice(1);
    sel.appendChild(opt);
  }
}

function fillModelSelect(backend, modelSel) {
  modelSel.innerHTML = "";
  const cfg = BACKEND_MODELS[backend];
  for (const m of cfg.models) {
    const [value, label] = Array.isArray(m) ? m : [m, m];
    const opt = document.createElement("option");
    opt.value = value;
    opt.textContent = label;
    modelSel.appendChild(opt);
  }
  if (cfg.custom) {
    const opt = document.createElement("option");
    opt.value = "__custom__";
    opt.textContent = "Custom…";
    modelSel.appendChild(opt);
  }
}

function wireAgent(prefix) {
  const backendSel = document.getElementById("backend" + prefix);
  const modelSel = document.getElementById("model" + prefix);
  const customWrap = document.getElementById("custom" + prefix + "-wrap");
  const customInput = document.getElementById("custom" + prefix);

  fillBackendSelect(backendSel);
  backendSel.value = "claude";
  fillModelSelect(backendSel.value, modelSel);

  backendSel.addEventListener("change", () => {
    fillModelSelect(backendSel.value, modelSel);
    customWrap.style.display = "none";
  });
  modelSel.addEventListener("change", () => {
    customWrap.style.display = modelSel.value === "__custom__" ? "block" : "none";
    if (modelSel.value === "__custom__") customInput.focus();
  });

  return () => {
    const backend = backendSel.value;
    const model = modelSel.value === "__custom__" ? (customInput.value.trim() || "") : modelSel.value;
    return model ? `${backend}:${model}` : backend;
  };
}

const getSpecA = wireAgent("A");
const getSpecB = wireAgent("B");

// The lists above are a fallback - once unlocked, replace claude/openai/gemini
// with every model actually available on the configured keys, fetched live
// from the server (which is the only thing that holds the keys).
function refreshModelSelects() {
  for (const prefix of ["A", "B"]) {
    const backendSel = document.getElementById("backend" + prefix);
    const modelSel = document.getElementById("model" + prefix);
    const prevValue = modelSel.value;
    fillModelSelect(backendSel.value, modelSel);
    if ([...modelSel.options].some(o => o.value === prevValue)) modelSel.value = prevValue;
  }
}

async function loadDynamicModels() {
  try {
    const resp = await fetch(API_BASE + "/api/models");
    const data = await resp.json();
    for (const provider of ["claude", "openai", "gemini"]) {
      if (Array.isArray(data[provider]) && data[provider].length) {
        BACKEND_MODELS[provider] = { models: data[provider], custom: true };
      }
    }
    refreshModelSelects();
  } catch (e) {
    // offline or the endpoint failed - the static fallback lists stay as-is
  }
}

const modeSel = document.getElementById("mode");
const agentBBlock = document.getElementById("agentB-block");
function syncMode() {
  agentBBlock.style.display = modeSel.value === "coop" ? "block" : "none";
  document.getElementById("costRowB").classList.toggle("hidden", modeSel.value !== "coop");
}
modeSel.addEventListener("change", syncMode);
syncMode();

// ---------------------------------------------------------------- access gate
// The page itself stays locked (appRoot hidden) until a code is confirmed
// against the server via /api/check-code - there's no client-side "just
// trust it" path, and nothing about the run() flow below is reachable
// without passing through here first.
let accessCode = "";
try { accessCode = sessionStorage.getItem("loopParkAccessCode") || ""; } catch (e) {}

const gateEl = document.getElementById("gate");
const appRoot = document.getElementById("appRoot");
const gateInput = document.getElementById("gateInput");
const gateSubmit = document.getElementById("gateSubmit");
const gateError = document.getElementById("gateError");

async function attemptUnlock(code, silent) {
  gateSubmit.disabled = true;
  gateError.textContent = silent ? "" : "Checking…";
  try {
    const resp = await fetch(API_BASE + "/api/check-code", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const data = await resp.json();
    if (resp.ok && data.ok) {
      accessCode = code;
      try { sessionStorage.setItem("loopParkAccessCode", code); } catch (e) {}
      gateEl.hidden = true;
      appRoot.hidden = false;
      loadDynamicModels();
      return;
    }
    gateError.textContent = silent ? "" : (data.error || "Incorrect code.");
  } catch (e) {
    gateError.textContent = silent ? "" : "Couldn't reach the server - try again.";
  } finally {
    gateSubmit.disabled = false;
  }
}

gateSubmit.addEventListener("click", () => attemptUnlock(gateInput.value, false));
gateInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") attemptUnlock(gateInput.value, false);
});

if (accessCode) {
  gateInput.value = accessCode;
  attemptUnlock(accessCode, true);
} else {
  gateInput.focus();
}

const speed = document.getElementById("speed");
const speedLabel = document.getElementById("speedLabel");
function syncSpeedLabel() { speedLabel.textContent = speed.value + " ms / move"; }
speed.addEventListener("input", syncSpeedLabel);
syncSpeedLabel();

const statusEl = document.getElementById("status");
const gridEl = document.getElementById("grid");
const logEl = document.getElementById("log");
const runBtn = document.getElementById("runBtn");
const replayBtn = document.getElementById("replayBtn");

let lastRun = null;
let playbackTimer = null;
let botA = null, botB = null, doorEl = null;
let runSpecA = "claude:claude-haiku-4-5-20251001", runSpecB = "claude:claude-haiku-4-5-20251001";

const CELL = 44, GAP = 4, STEP = CELL + GAP;

function posTransform(x, y) { return `translate(${x * STEP}px, ${y * STEP}px)`; }

function drawPixelIcon(canvas, rows, colorMap) {
  const w = rows[0].length, h = rows.length;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === ".") continue;
      ctx.fillStyle = colorMap[ch];
      ctx.fillRect(x, y, 1, 1);
    }
  }
}

const PLATE_ROWS = [
  ".######.", "#bbbbbb#", "#bbbbbb#", "#bbWbbb#",
  "#bbbbbb#", "#bbbbbb#", "#bbbbbb#", ".######.",
];

function addImg(parent, src, cls) {
  const img = document.createElement("img");
  img.src = "assets/" + src;
  img.className = cls;
  img.alt = "";
  parent.appendChild(img);
  return img;
}

// Tile art comes from the shared asset pack (env tiles, hazards, flag, door);
// there's no matching "pressure plate" piece in that pack, so it keeps the
// hand-drawn pixel icon.
function makeTile(cls, x, y) {
  const t = document.createElement("div");
  t.className = "tile " + cls;
  t.style.transform = posTransform(x, y);

  const base = cls.split(" ")[0];
  if (base === "floor") {
    addImg(t, "tile_floor.png", "tile-img-fill");
  } else if (base === "wall") {
    const pillar = document.createElement("div");
    pillar.className = "pillar";
    t.appendChild(pillar);
  } else if (base === "lava") {
    // no image at all - an open gap, sky shows straight through
  } else if (base === "goal") {
    addImg(t, "tile_floor.png", "tile-img-fill");
    addImg(t, "icon_flag.png", "tile-img-icon");
  } else if (base === "door") {
    addImg(t, "tile_floor.png", "tile-img-fill");
    addImg(t, "icon_door.png", "door-img");
  } else if (base === "plate") {
    addImg(t, "tile_floor.png", "tile-img-fill");
    const icon = document.createElement("canvas");
    icon.className = "tile-icon";
    // Was #6fb8e0 - nearly identical to the sky's own #6fb8e8, so the
    // plate barely showed up against the new bright background. Amber
    // reads as a warm, pressable button against the cool sky/hills.
    drawPixelIcon(icon, PLATE_ROWS, { "#": "#223154", "b": "#f0983c", "W": "#fff6df" });
    t.appendChild(icon);
  }

  gridEl.appendChild(t);
  return t;
}

function buildStage(level, mode) {
  gridEl.style.width = (level.cols * STEP - GAP) + "px";
  gridEl.style.height = (level.rows * STEP - GAP) + "px";
  gridEl.innerHTML = "";
  botA = botB = doorEl = null;

  for (let y = 0; y < level.rows; y++)
    for (let x = 0; x < level.cols; x++)
      makeTile("floor", x, y);
  for (const [x, y] of level.walls) makeTile("wall", x, y);
  for (const [x, y] of level.lava) makeTile("lava", x, y);
  if (mode === "coop") {
    makeTile("plate", ...level.plate);
    doorEl = makeTile("door closed", ...level.door);
  }
  makeTile("goal", ...level.goal);
}

function addPart(parent, cls) {
  const el = document.createElement("div");
  el.className = cls;
  parent.appendChild(el);
  return el;
}

// Milo (from the shared asset pack) pre-recolored per backend: bot_claude.png
// (orange), bot_openai.png (white, its native color), bot_gemini.png (blue),
// bot_ollama.png (pink) - same face/outline, different body-fill color.
function createBot(letter, provider) {
  const bot = document.createElement("div");
  bot.className = `bot provider-${provider}`;

  addImg(bot, `bot_${provider}.png`, "bot-sprite");

  const tag = addPart(bot, "bot-tag");
  tag.textContent = letter;

  gridEl.appendChild(bot);
  return bot;
}

const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

// Real jump-arc movement: the decision is still "go to this platform" (one
// LLM call, same as before) but getting there is animated as an actual
// parabolic hop rather than a flat slide.
function moveBot(el, x, y) {
  const toX = x * STEP, toY = y * STEP;
  if (REDUCE_MOTION) { el.style.transform = `translate(${toX}px, ${toY}px)`; return; }

  const prev = el._pos || { x: toX, y: toY };
  const fromX = prev.x, fromY = prev.y;
  el._pos = { x: toX, y: toY };

  const dist = Math.hypot(toX - fromX, toY - fromY);
  if (dist < 1) { el.style.transform = `translate(${toX}px, ${toY}px)`; return; }

  const duration = 260;
  const arcHeight = Math.min(26, 10 + dist * 0.14);
  const start = performance.now();

  if (el._raf) cancelAnimationFrame(el._raf);
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const curX = fromX + (toX - fromX) * ease;
    const curY = fromY + (toY - fromY) * ease - arcHeight * 4 * t * (1 - t);
    el.style.transform = `translate(${curX}px, ${curY}px)`;
    if (t < 1) el._raf = requestAnimationFrame(frame);
  }
  el._raf = requestAnimationFrame(frame);
}

function setDoorOpen(open) {
  if (!doorEl) return;
  doorEl.classList.toggle("open", open);
  doorEl.classList.toggle("closed", !open);
}

function log(html, cls) {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.innerHTML = html;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function stopPlayback() {
  if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; }
}

function playback(data) {
  stopPlayback();
  logEl.innerHTML = "";
  const level = data.level;
  const steps = [];
  buildStage(level, data.mode);

  if (data.mode === "single") {
    for (const ep of data.episodes) {
      steps.push({ type: "epstart", ep: ep.episode });
      for (const t of ep.turns) steps.push({ type: "turn", ep: ep.episode, turn: t });
      steps.push({ type: "result", ep: ep.episode, result: ep.result });
    }
    botA = createBot("A", runSpecA.split(":")[0]);
    moveBot(botA, ...level.start);
  } else {
    for (const ep of data.episodes) {
      steps.push({ type: "epstart", ep: ep.episode });
      for (const t of ep.turns) steps.push({ type: "turn", ep: ep.episode, turn: t });
      steps.push({ type: "result", ep: ep.episode, result: ep.result });
    }
    botA = createBot("A", runSpecA.split(":")[0]); moveBot(botA, ...level.startA);
    botB = createBot("B", runSpecB.split(":")[0]); moveBot(botB, ...level.startB);
    setDoorOpen(false);
  }

  let i = 0;
  function tick() {
    if (i >= steps.length) { stopPlayback(); return; }
    const s = steps[i++];
    if (s.type === "epstart") {
      log(`EPISODE ${s.ep}`, "ep");
      if (data.mode === "single") { moveBot(botA, ...level.start); }
      else { moveBot(botA, ...level.startA); moveBot(botB, ...level.startB); setDoorOpen(false); }
    } else if (s.type === "result") {
      log(s.result, "result");
    } else if (data.mode === "single") {
      const t = s.turn;
      log(`&gt; THOUGHT: ${escapeHtml(t.thought)}`);
      log(`&gt; ACTION: <b>${t.action}</b> &rarr; ${escapeHtml(t.outcome)} (${t.reward >= 0 ? "+" : ""}${t.reward})`);
      moveBot(botA, ...t.pos);
      costState.A.tokensIn += t.tokens_in;
      costState.A.tokensOut += t.tokens_out;
      updateCostRow("A");
    } else {
      const t = s.turn;
      log(`[A] &gt; ${escapeHtml(t.thoughtA)}`, "a");
      log(`[A] ${t.actionA} &rarr; ${escapeHtml(t.outcomeA)} (${t.rewardA >= 0 ? "+" : ""}${t.rewardA})`, "dim");
      log(`[B] &gt; ${escapeHtml(t.thoughtB)}`, "b");
      log(`[B] ${t.actionB} &rarr; ${escapeHtml(t.outcomeB)} (${t.rewardB >= 0 ? "+" : ""}${t.rewardB})`, "dim");
      costState.A.tokensIn += t.tokensA_in; costState.A.tokensOut += t.tokensA_out;
      costState.B.tokensIn += t.tokensB_in; costState.B.tokensOut += t.tokensB_out;
      updateCostRow("A"); updateCostRow("B");
      const doorOpen = (t.posA[0] === level.plate[0] && t.posA[1] === level.plate[1]) ||
                        (t.posB[0] === level.plate[0] && t.posB[1] === level.plate[1]);
      setDoorOpen(doorOpen);
      moveBot(botA, ...t.posA);
      moveBot(botB, ...t.posB);
    }
  }
  tick();
  playbackTimer = setInterval(tick, Number(speed.value));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// ---------------------------------------------------------------- cost calculator
const costState = {
  A: { spec: "", tokensIn: 0, tokensOut: 0 },
  B: { spec: "", tokensIn: 0, tokensOut: 0 },
};

function setupCostRow(letter, spec) {
  const rate = getRate(spec);
  costState[letter] = { spec, tokensIn: 0, tokensOut: 0 };
  document.getElementById("costModel" + letter).textContent = spec;
  const rateIn = document.getElementById("rateIn" + letter);
  const rateOut = document.getElementById("rateOut" + letter);
  rateIn.value = rate.in;
  rateOut.value = rate.out;
  rateIn.classList.toggle("rate-unknown", !rate.known);
  rateOut.classList.toggle("rate-unknown", !rate.known);
  updateCostRow(letter);
}

function updateCostRow(letter) {
  const s = costState[letter];
  document.getElementById("costIn" + letter).textContent = s.tokensIn.toLocaleString();
  document.getElementById("costOut" + letter).textContent = s.tokensOut.toLocaleString();
  const rateIn = Number(document.getElementById("rateIn" + letter).value) || 0;
  const rateOut = Number(document.getElementById("rateOut" + letter).value) || 0;
  const cost = (s.tokensIn / 1e6) * rateIn + (s.tokensOut / 1e6) * rateOut;
  document.getElementById("cost" + letter).textContent = "$" + cost.toFixed(4);
  updateCostTotal();
}

function updateCostTotal() {
  const total = ["A", "B"].reduce((sum, letter) => {
    const el = document.getElementById("cost" + letter);
    const row = document.getElementById("costRow" + letter);
    if (row.classList.contains("hidden")) return sum;
    return sum + Number(el.textContent.replace("$", "") || 0);
  }, 0);
  document.getElementById("costTotal").textContent = "$" + total.toFixed(4);

  const unknownRates = ["A", "B"].some(letter => {
    const row = document.getElementById("costRow" + letter);
    if (row.classList.contains("hidden")) return false;
    return document.getElementById("rateIn" + letter).classList.contains("rate-unknown");
  });
  document.getElementById("costNote").textContent = unknownRates
    ? "Orange rate fields are models I don't have confirmed current pricing for - edit them with the real $/1M rate from the provider's pricing page for an accurate total."
    : "";
}

for (const letter of ["A", "B"]) {
  document.getElementById("rateIn" + letter).addEventListener("input", () => updateCostRow(letter));
  document.getElementById("rateOut" + letter).addEventListener("input", () => updateCostRow(letter));
}

async function run() {
  stopPlayback();
  runBtn.disabled = true;
  replayBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "Running simulation (real API calls in flight, this can take a bit)…";
  gridEl.innerHTML = "";
  logEl.innerHTML = "";

  const mode = modeSel.value;
  const specA = getSpecA();
  const body = {
    mode,
    difficulty: document.getElementById("difficulty").value,
    episodes: Number(document.getElementById("episodes").value) || 4,
    seed: document.getElementById("seed").value || null,
    agentA: specA,
    code: accessCode,
  };
  runSpecA = specA;
  document.getElementById("costRowB").classList.toggle("hidden", mode !== "coop");
  setupCostRow("A", specA);
  if (mode === "coop") {
    const specB = getSpecB();
    body.agentB = specB;
    runSpecB = specB;
    setupCostRow("B", specB);
  }

  try {
    const resp = await fetch(API_BASE + "/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    let data;
    try {
      data = await resp.json();
    } catch (e) {
      // The server can return a plain-text/HTML error (a gateway timeout,
      // a cold-start hiccup) instead of JSON - don't surface a cryptic
      // "Unexpected token" parse error for that.
      throw new Error(`Server returned an unexpected response (HTTP ${resp.status}) - try again in a moment.`);
    }
    if (!resp.ok) throw new Error(data.error || `HTTP ${resp.status}`);
    statusEl.textContent = `Done — ${data.episodes.length} episode(s). Playing back at ${speed.value} ms/move.`;
    lastRun = data;
    replayBtn.disabled = false;
    playback(data);
  } catch (err) {
    statusEl.className = "err";
    statusEl.textContent = "Error: " + err.message;
  } finally {
    runBtn.disabled = false;
  }
}

runBtn.addEventListener("click", run);
replayBtn.addEventListener("click", () => { if (lastRun) playback(lastRun); });
</script>
</body>
</html>
