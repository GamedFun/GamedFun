<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Hop – gamed.fun</title>
<style>
  :root {
    --bg: #1a1625;
    --panel: #231f30;
    --text: #fff7ed;
    --muted: #b8a99a;
    --gold: #fbbf24;
    --border: rgba(255,255,255,.13);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 20%, rgba(99,102,241,.1), transparent 30rem),
      linear-gradient(180deg, #181219 0%, var(--bg) 100%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
  }
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .6rem 1.2rem;
    border-bottom: 1px solid var(--border);
    background: rgba(18,16,20,.9);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { text-decoration: none; font-weight: 900; color: var(--gold); }
  .home-link { text-decoration: none; color: var(--muted); font-size: .85rem; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.5rem 1rem 2rem;
    gap: 1.2rem;
  }
  h1 { font-size: 1.7rem; font-weight: 900; }
  #info { color: var(--muted); font-size: .9rem; }
  #info strong { color: var(--text); }
  #grid {
    display: grid;
    gap: 5px;
    touch-action: none;
  }
  .cell {
    width: 58px;
    height: 58px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    user-select: none;
  }
  @media (max-width: 420px) {
    .cell { width: 48px; height: 48px; font-size: 1.3rem; border-radius: 7px; }
    #grid { gap: 4px; }
  }
  .cell.empty { visibility: hidden; }
  .cell.block {
    background: #3d2e22;
    border: 1px solid rgba(255,255,255,.07);
    border-bottom: 4px solid #1e1510;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  }
  .cell.block.player {
    background: #4338ca;
    border-color: rgba(129,140,248,.35);
    border-bottom-color: #312e81;
    box-shadow: 0 0 16px rgba(99,102,241,.5), inset 0 1px 0 rgba(255,255,255,.12);
  }
  .cell.block.chest {
    background: #7c2d12;
    border-color: rgba(251,191,36,.5);
    border-bottom-color: #431407;
    animation: glow 1.8s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { box-shadow: 0 0 0 0 rgba(251,191,36,.25); }
    50%      { box-shadow: 0 0 18px 5px rgba(251,191,36,.4); }
  }
  #message {
    font-size: 1.25rem;
    font-weight: 900;
    min-height: 1.8rem;
    color: var(--gold);
    text-align: center;
  }
  .btns { display: flex; gap: .7rem; flex-wrap: wrap; justify-content: center; }
  button {
    padding: .5rem 1.2rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-size: .88rem;
    cursor: pointer;
    transition: background .12s;
  }
  button:hover, button:active { background: #2e2840; }
  button.primary { background: var(--gold); color: #1a1625; border-color: transparent; font-weight: 700; }
  button.primary:hover, button.primary:active { background: #f59e0b; }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
  }
  .dpad-btn {
    border-radius: 8px;
    font-size: 1.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--panel);
    border: 1px solid var(--border);
    cursor: pointer;
    width: 52px;
    height: 52px;
    padding: 0;
    transition: background .1s;
  }
  .dpad-btn:active { background: #2e2840; }
  #hint { color: var(--muted); font-size: .8rem; text-align: center; max-width: 300px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/">🎮 gamed.fun</a>
  <a class="home-link" href="/">← Home</a>
</header>
<main>
  <h1>📦 Block Hop</h1>
  <div id="info">
    Level <strong id="levelNum">1</strong> of <strong id="totalLevels">8</strong>
    &nbsp;·&nbsp;
    Moves: <strong id="moveCount">0</strong>
  </div>
  <div id="grid"></div>
  <div id="message"></div>
  <div class="btns">
    <button id="restartBtn">↺ Restart</button>
    <button id="nextBtn" class="primary" style="display:none">Next Level →</button>
  </div>
  <div id="dpad">
    <div></div>
    <button class="dpad-btn" data-dir="up">↑</button>
    <div></div>
    <button class="dpad-btn" data-dir="left">←</button>
    <div></div>
    <button class="dpad-btn" data-dir="right">→</button>
    <div></div>
    <button class="dpad-btn" data-dir="down">↓</button>
    <div></div>
  </div>
  <div id="hint">WASD or arrow keys to hop between blocks · reach the chest 📦</div>
</main>
<script>
// ' '=empty  'X'=block  'P'=player start  'C'=chest
const LEVELS = [
  // 1: Simple L — go right then up-right
  [
    '     ',
    '    C',
    '   XX',
    'PXXX ',
  ],
  // 2: Zigzag upward
  [
    'CX   ',
    ' X   ',
    ' XX  ',
    '  X  ',
    '  XXP',
  ],
  // 3: U-shape — go right, then down, then right
  [
    'PXXX ',
    '   X ',
    '   X ',
    '   XC',
  ],
  // 4: S-shape with a dead end going down
  [
    '  XXC',
    ' XX  ',
    'PX   ',
    ' XX  ',
  ],
  // 5: Inner loop — two routes, one dead-ends
  [
    '    C',
    ' XXXX',
    ' X   ',
    'PXXX ',
    '   X ',
  ],
  // 6: Diagonal staircase
  [
    'CX   ',
    ' XX  ',
    '  XX ',
    '   XX',
    '    P',
  ],
  // 7: Two paths — one dead-ends at top-right
  [
    'C X  ',
    'X X  ',
    'XXX  ',
    '  XXX',
    '    P',
  ],
  // 8: Long winding staircase (6-wide)
  [
    'CX    ',
    ' XX   ',
    '  X   ',
    '  XX  ',
    '   XX ',
    '    XP',
  ],
];

let currentLevel = 0;
let grid = [];
let player = { row: 0, col: 0 };
let moves = 0;
let won = false;

function parseLevel(rows) {
  const g = rows.map(r => [...r]);
  let p = null;
  for (let r = 0; r < g.length; r++)
    for (let c = 0; c < g[r].length; c++)
      if (g[r][c] === 'P') p = { row: r, col: c };
  return { g, p };
}

function loadLevel(idx) {
  const { g, p } = parseLevel(LEVELS[idx]);
  grid = g;
  player = { ...p };
  moves = 0;
  won = false;
  document.getElementById('levelNum').textContent = idx + 1;
  document.getElementById('totalLevels').textContent = LEVELS.length;
  document.getElementById('moveCount').textContent = 0;
  document.getElementById('message').textContent = '';
  document.getElementById('nextBtn').style.display = 'none';
  render();
}

function render() {
  const el = document.getElementById('grid');
  const cols = Math.max(...grid.map(r => r.length));
  el.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  el.innerHTML = '';
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = (grid[r] && grid[r][c]) ?? ' ';
      const isPlayer = player.row === r && player.col === c;
      const div = document.createElement('div');
      div.className = 'cell';
      if (ch === ' ' && !isPlayer) {
        div.classList.add('empty');
      } else {
        div.classList.add('block');
        if (isPlayer) {
          div.classList.add('player');
          div.textContent = '🧑';
        } else if (ch === 'C') {
          div.classList.add('chest');
          div.textContent = '📦';
        }
      }
      el.appendChild(div);
    }
  }
}

function tryMove(dr, dc) {
  if (won) return;
  const nr = player.row + dr;
  const nc = player.col + dc;
  if (nr < 0 || nr >= grid.length) return;
  const row = grid[nr];
  if (!row || nc < 0 || nc >= row.length) return;
  if (row[nc] === ' ') return;
  player.row = nr;
  player.col = nc;
  moves++;
  document.getElementById('moveCount').textContent = moves;
  if (row[nc] === 'C') {
    won = true;
    const isLast = currentLevel === LEVELS.length - 1;
    document.getElementById('message').textContent = isLast
      ? `🏆 You beat all ${LEVELS.length} levels!`
      : `🎉 Level ${currentLevel + 1} complete! (${moves} moves)`;
    if (!isLast) document.getElementById('nextBtn').style.display = '';
  }
  render();
}

document.addEventListener('keydown', e => {
  const map = { w:[-1,0], ArrowUp:[-1,0], s:[1,0], ArrowDown:[1,0], a:[0,-1], ArrowLeft:[0,-1], d:[0,1], ArrowRight:[0,1] };
  if (map[e.key]) {
    e.preventDefault();
    tryMove(...map[e.key]);
  }
});

document.querySelectorAll('.dpad-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const map = { up:[-1,0], down:[1,0], left:[0,-1], right:[0,1] };
    tryMove(...map[btn.dataset.dir]);
  });
});

document.getElementById('restartBtn').addEventListener('click', () => loadLevel(currentLevel));
document.getElementById('nextBtn').addEventListener('click', () => { currentLevel++; loadLevel(currentLevel); });

// Swipe support
let swipeStart = null;
const gridEl = document.getElementById('grid');
gridEl.addEventListener('touchstart', e => {
  swipeStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
gridEl.addEventListener('touchend', e => {
  if (!swipeStart) return;
  const dx = e.changedTouches[0].clientX - swipeStart.x;
  const dy = e.changedTouches[0].clientY - swipeStart.y;
  swipeStart = null;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) tryMove(0, dx > 0 ? 1 : -1);
  else tryMove(dy > 0 ? 1 : -1, 0);
});

loadLevel(0);
</script>
</body>
</html>
