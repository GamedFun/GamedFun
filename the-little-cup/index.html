<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.dataset.theme=localStorage.getItem('gf-theme')||'dark';</script>
  <title>The Little Cup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #121014;
      --panel: #1f1b22;
      --panel-2: #2d2630;
      --text: #fff7ed;
      --muted: #b8a99a;
      --cream: #fff1d6;
      --mint: #34d399;
      --gold: #fbbf24;
      --border: rgba(255,255,255,.13);
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 15%, rgba(251,191,36,.18), transparent 22rem),
        radial-gradient(circle at 85% 10%, rgba(52,211,153,.16), transparent 22rem),
        linear-gradient(180deg, #181219 0%, var(--bg) 100%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: .6rem 1.2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(18,16,20,.9);
      backdrop-filter: blur(8px);
    }
    .brand, .home-link { text-decoration: none; font-weight: 900; }
    .brand { align-items: center; color: var(--gold); display: inline-flex; gap: .42rem; }
    .brand-mark { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; }
    .home-link {
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .35rem .65rem;
      font-size: .82rem;
    }
    .header-stats { text-align: center; }
    .header-cash { font-size: 1.25rem; font-weight: 900; color: var(--cream); }
    .header-cps  { font-size: .7rem; color: var(--muted); font-weight: 750; margin-top: 1px; }

    /* LAYOUT */
    .layout {
      display: grid;
      grid-template-columns: 210px 1fr 260px;
      height: calc(100vh - 50px);
    }

    /* UPGRADES PANEL (left) */
    .upg-panel {
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: .75rem .65rem;
      display: flex;
      flex-direction: column;
      gap: .5rem;
    }
    .upg-panel::-webkit-scrollbar { width: 4px; }
    .upg-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

    .panel-label {
      color: var(--muted);
      font-size: .62rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding-bottom: .35rem;
    }
    .upg-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .6rem .7rem;
      display: flex;
      gap: .55rem;
      align-items: flex-start;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .upg-card.affordable { border-color: rgba(251,191,36,.55); }
    .upg-card.affordable:hover { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(251,191,36,.15); }
    .upg-card.too-costly { opacity: .55; cursor: default; }
    .upg-card.milestone-upg { border-color: rgba(251,191,36,.7); background: rgba(251,191,36,.06); }
    .upg-card.milestone-upg .upg-name { color: var(--gold); }
    .upg-icon { font-size: 1.35rem; flex-shrink: 0; line-height: 1; padding-top: .1rem; }
    .upg-name { font-size: .83rem; font-weight: 900; color: var(--cream); }
    .upg-desc { font-size: .7rem; color: var(--muted); margin-top: .12rem; line-height: 1.35; }
    .upg-cost { font-size: .72rem; font-weight: 900; color: var(--gold); margin-top: .25rem; }
    .upg-none { font-size: .78rem; color: var(--muted); padding: .2rem .1rem; }

    /* CLICK AREA (center) */
    .click-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.1rem;
      padding: 1rem;
      position: relative;
      overflow: hidden;
    }
    .center-stats { text-align: center; }
    .center-total { font-size: 2.1rem; font-weight: 900; color: var(--cream); }
    .center-cps   { font-size: .9rem; color: var(--muted); font-weight: 750; margin-top: .15rem; }
    .center-cpc   { font-size: .75rem; color: var(--muted); margin-top: .1rem; }
    .cup-btn {
      font-size: 7rem;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: none; background: none;
      padding: .5rem;
      border-radius: 50%;
      filter: drop-shadow(0 8px 24px rgba(251,191,36,.38));
      animation: breathe 3s ease-in-out infinite;
      transition: transform .09s;
    }
    @keyframes breathe {
      0%,100% { filter: drop-shadow(0 8px 24px rgba(251,191,36,.38)); }
      50%      { filter: drop-shadow(0 10px 36px rgba(251,191,36,.58)); }
    }
    .cup-btn:active { transform: scale(.91); animation: none; filter: drop-shadow(0 4px 14px rgba(251,191,36,.3)); }

    /* Frenzy bar */
    .frenzy-wrap { width: 100%; max-width: 240px; display: none; flex-direction: column; align-items: center; gap: .3rem; }
    .frenzy-wrap.on { display: flex; }
    .frenzy-label { font-size: .72rem; color: var(--gold); font-weight: 900; letter-spacing: .05em; }
    .frenzy-track { width: 100%; height: 8px; background: rgba(255,255,255,.1); border-radius: 999px; overflow: hidden; }
    .frenzy-fill  { height: 100%; background: linear-gradient(90deg, var(--gold), var(--mint)); border-radius: 999px; transition: width .4s linear; }

    /* Golden coffee */
    .golden-cup {
      position: absolute;
      font-size: 2.6rem;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      border: none; background: none;
      filter: drop-shadow(0 0 10px #fbbf24) drop-shadow(0 0 22px #fbbf24);
      animation: goldenPop .38s cubic-bezier(.34,1.56,.64,1), goldenFade 13s linear forwards;
      z-index: 5;
    }
    @keyframes goldenPop  { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }
    @keyframes goldenFade { 0%,75% { opacity: 1; } 100% { opacity: 0; } }

    /* Ticker */
    .ticker {
      width: 100%;
      background: rgba(31,27,34,.75);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: .45rem .85rem;
      font-size: .8rem;
      color: var(--muted);
      font-weight: 750;
      text-align: center;
      min-height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Float text */
    .float-txt {
      position: fixed;
      font-size: .9rem;
      font-weight: 900;
      color: var(--gold);
      pointer-events: none;
      z-index: 500;
      white-space: nowrap;
      animation: floatUp .8s ease-out forwards;
    }
    @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-52px) scale(.85); } }

    /* BUILDINGS PANEL (right) */
    .bld-panel {
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: .6rem;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }
    .bld-panel::-webkit-scrollbar { width: 4px; }
    .bld-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 2px; }

    .bld-row {
      display: flex;
      align-items: center;
      gap: .65rem;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .65rem .75rem;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .bld-row.affordable { border-color: rgba(52,211,153,.5); }
    .bld-row.affordable:hover { border-color: var(--mint); box-shadow: 0 0 0 2px rgba(52,211,153,.12); }
    .bld-row.too-costly { opacity: .55; cursor: default; }
    .bld-row.hidden-bld { display: none; }
    .bld-icon { font-size: 1.7rem; flex-shrink: 0; }
    .bld-info { flex: 1; min-width: 0; }
    .bld-name { font-size: .88rem; font-weight: 900; }
    .bld-desc { font-size: .68rem; color: var(--muted); margin-top: .1rem; }
    .bld-cps  { font-size: .68rem; color: var(--mint); font-weight: 800; margin-top: .12rem; }
    .bld-right { text-align: right; flex-shrink: 0; }
    .bld-cost  { font-size: .84rem; font-weight: 900; color: var(--gold); }
    .bld-owned { font-size: .7rem; color: var(--muted); font-weight: 800; margin-top: .1rem; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel);
      border: 1px solid var(--gold);
      border-radius: 14px;
      padding: .85rem 1.4rem;
      box-shadow: 0 12px 44px rgba(0,0,0,.55), 0 0 0 3px rgba(251,191,36,.1);
      text-align: center;
      z-index: 300;
      max-width: 320px;
      animation: toastIn .3s ease-out, toastOut .4s ease-in 3.2s forwards;
    }
    .toast-title { font-size: 1rem; font-weight: 900; color: var(--gold); }
    .toast-body  { font-size: .82rem; color: var(--muted); margin-top: .2rem; line-height: 1.4; }
    @keyframes toastIn  { from { opacity: 0; transform: translateX(-50%) translateY(18px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to   { opacity: 0; transform: translateX(-50%) translateY(12px); } }


    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; height: auto; }
      .upg-panel, .bld-panel { border: none; border-bottom: 1px solid var(--border); max-height: 260px; }
      .click-area { min-height: 55vw; padding: 1.5rem 1rem; }
      .cup-btn { font-size: 5.5rem; }
    }
    [data-theme="light"] { --bg: #f5f5f5; --panel: #ffffff; --panel-2: #f0f0f5; --text: #111827; --muted: #6b7280; --border: rgba(0,0,0,.12); }
    [data-theme="light"] body { background: radial-gradient(circle at 15% 15%,rgba(251,191,36,.08),transparent 22rem),radial-gradient(circle at 85% 10%,rgba(52,211,153,.07),transparent 22rem),#f5f5f5; }
    [data-theme="light"] header { background: rgba(245,245,250,.95); }
  </style>
</head>
<div id="googol-win" style="display:none;position:fixed;inset:0;z-index:999;background:rgba(10,8,16,.96);flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;text-align:center;padding:2rem;">

<div class="ticker" id="ticker">Click the cup to start brewing.</div>

  <!-- Right: Buildings -->
  <div class="bld-panel" id="bldPanel">

</div>

const THING_DESCS= ['Nobody knows why it works. It just does.','Extremely passionate about espresso.','Found behind the cafe. Decided to stay.','Part coffee machine, part mystery.','Smells like coffee. Might be coffee.','Do not look directly at it.','Just vibes and makes great coffee.','Produces coffee through sheer willpower.','Makes coffee in ways science cannot explain.','Has strong opinions about your order.','Works best when ignored.','Terrifying but effective.','Surprisingly good at its job.','The less you know, the better.','Refuses to explain itself.'];
const TIER_COSTS = [[8,80],[80,400],[400,1800],[1800,9000],[9000,45000],[45000,225000],[225000,1125000],[1125000,5625000],[5625000,28125000],[28125000,140625000]];
const TIER_CPS   = [[0.05,0.4],[0.4,3],[3,22],[22,90],[90,370],[370,1850],[1850,9250],[9250,46250],[46250,231250],[231250,1156250]];

function buildGeneratedThings() {
  const out = []; let i = 0;
  outer: for (const adj of THING_ADJ) {
    for (const noun of THING_NOUN) {
      const t = Math.min(9, Math.floor(i / 99)), p = (i % 99) / 98;
      out.push({ id:`g${i}`, name:`${adj} ${noun}`, icon:THING_ICONS[i%THING_ICONS.length], desc:THING_DESCS[i%THING_DESCS.length],
        baseCost: Math.ceil(TIER_COSTS[t][0]+(TIER_COSTS[t][1]-TIER_COSTS[t][0])*p),
        baseCps:  TIER_CPS[t][0]+(TIER_CPS[t][1]-TIER_CPS[t][0])*p });
      if (++i >= 991) break outer;
    }
  }
  return out;
}
const ALL_THINGS = [...BUILDINGS, ...buildGeneratedThings()];

const WORKERS = [
  { id:'w_intern',     icon:'🎓', name:'Intern',          desc:'Adds +0.5/sec flat production.',   baseCost:20,    scale:1.30 },

  { id:'w_alchemist',  icon:'⚗️', name:'Bean Alchemist',  desc:'+6% all income per hire.',         baseCost:3500,  scale:1.82 },

const MILESTONES = [
  { n:100,          msg:'First $100! You\'re a real barista now. ☕'          },
  { n:1_000,        msg:'A thousand dollars! The cafe is buzzing.'              },
  { n:10_000,       msg:'$10,000! Time to think about expansion.'              },
  { n:100_000,      msg:'$100K! You\'re running a serious operation.'          },
  { n:1_000_000,    msg:'One million! ☕🎉 Coffee empire incoming.'            },
  { n:10_000_000,   msg:'$10 million! The whole city smells like coffee.'      },
  { n:100_000_000,  msg:'$100 million! You\'ve conquered the coffee market.'  },
  { n:1_000_000_000,msg:'One billion! You ARE coffee.'                         },
];

const TICKER = [
  'Coffee futures are up 12% this quarter.',
  'Local barista wins latte art competition.',
  'Scientists confirm coffee is good, actually.',
  'New trend: cold brew served warm in a hot cup.',
  'City considers coffee tax. Citizens outraged.',
  'Record espresso pulled in under 8 seconds.',
  'Barista union demands extra foam for free.',
  'Mystery ingredient in specialty blend: more coffee.',
  'Caffeine consumption reaches all-time high.',
  'Breaking: local cafe ran out of oat milk.',
];

const SAVE_KEY = 'little_cup_cc2';

// ── STATE ──────────────────────────────────────────────────
let G = freshState();

function freshState() {
  return {
    cash: 0, totalEarned: 0,
    owned: {}, bought: [],
    clickMult: 1, bldMult: {}, globalMult: 1,
    frenzy: 0, miniFrenzy: 0, mseen: [],
    workers: {}, upgradeSlots: [], thingSlots: [],
    won: false,
  };
}

// ── HELPERS ────────────────────────────────────────────────
const FMT_TIERS = [
  [1e3,  'K'],[1e6,  'M'],[1e9,  'B'],[1e12, 'T'],
  [1e15, 'Qa'],[1e18,'Qi'],[1e21,'Sx'],[1e24,'Sp'],
  [1e27, 'Oc'],[1e30,'No'],[1e33,'De'],[1e36,'UDe'],
  [1e39, 'DDe'],[1e42,'TDe'],[1e45,'QaDe'],[1e48,'QiDe'],
  [1e51, 'SxDe'],[1e54,'SpDe'],[1e57,'OcDe'],[1e60,'NoDe'],
  [1e63, 'Vi'],[1e66,'UVi'],[1e69,'DVi'],[1e72,'TVi'],
  [1e75, 'QaVi'],[1e78,'QiVi'],[1e81,'SxVi'],[1e84,'SpVi'],
  [1e87, 'OcVi'],[1e90,'NoVi'],[1e93,'Tg'],[1e96,'UTg'],
  [1e99, 'DTg'],[1e100,'Googol'],
];
function fmt(n) {
  if (n < 0.1)  return n.toFixed(2);
  if (n < 1)    return n.toFixed(1);
  if (n < 1e3)  return Math.floor(n).toLocaleString();
  for (let i = FMT_TIERS.length - 1; i >= 0; i--) {
    if (n >= FMT_TIERS[i][0]) return (n / FMT_TIERS[i][0]).toFixed(1) + FMT_TIERS[i][1];
  }
  return n.toFixed(0);
}

function bldCost(b) {
  return Math.ceil(b.baseCost * Math.pow(1.15, G.owned[b.id] || 0) * workerDiscount());
}

function bldCps(b) {
  return b.baseCps * (G.bldMult[b.id] || 1) * G.globalMult * workerBldMult();
}

function totalCps() {
  let t = (G.workers.w_baker || 0) * 1 + (G.workers.w_intern || 0) * 0.5;
  for (const b of ALL_THINGS) t += (G.owned[b.id] || 0) * bldCps(b);
  t *= workerGlobalMult();
  if (G.frenzy > 0)     t *= 7;
  if (G.miniFrenzy > 0) t *= 3;
  return t;
}

function clickVal() {
  return G.clickMult * workerClickMult() + totalCps() * 0.01;
}

function workerClickMult()  { return Math.pow(1.08, G.workers.w_driver||0) * Math.pow(1.10, G.workers.w_marketer||0) * Math.pow(1.07, G.workers.w_barista||0); }
function workerBldMult()    { return Math.pow(1.06, G.workers.w_roaster||0) * Math.pow(1.08, G.workers.w_chemist||0) * Math.pow(1.12, G.workers.w_wizard||0); }
function workerGlobalMult() { return Math.pow(1.04, G.workers.w_cashier||0) * Math.pow(1.05, G.workers.w_taster||0) * Math.pow(1.02, G.workers.w_janitor||0) * Math.pow(1.06, G.workers.w_alchemist||0); }
function workerDiscount()   { return Math.pow(0.96, G.workers.w_manager||0) * Math.pow(0.97, G.workers.w_accountant||0); }
function workerCost(w)      { return Math.ceil(w.baseCost * Math.pow(w.scale, G.workers[w.id] || 0)); }

function totalBld() {
  return Object.values(G.owned).reduce((s,v) => s+v, 0);
}

function condState() {
  return { ...G, totalBld: totalBld() };
}

// ── DOM REFS ───────────────────────────────────────────────
const hCash    = document.getElementById('hCash');
const hCps     = document.getElementById('hCps');
const cTotal   = document.getElementById('cTotal');
const cCps     = document.getElementById('cCps');
const cCpc     = document.getElementById('cCpc');
const cupBtn   = document.getElementById('cupBtn');
const clickArea= document.getElementById('clickArea');
const upgPanel = document.getElementById('upgPanel');
const bldPanel = document.getElementById('bldPanel');
const ticker   = document.getElementById('ticker');
const frenzyWrap = document.getElementById('frenzyWrap');
const frenzyFill = document.getElementById('frenzyFill');

// ── RENDER ─────────────────────────────────────────────────
function renderHUD() {
  const cps = totalCps(), cpc = clickVal();
  hCash.textContent    = fmt(G.cash);
  hCps.textContent     = fmt(cps);
  cTotal.textContent   = fmt(G.totalEarned);
  cCps.textContent     = fmt(cps);
  cCpc.textContent     = fmt(cpc);
  if (G.frenzy > 0) {
    frenzyWrap.classList.add('on');
    frenzyFill.style.width = (G.frenzy / 77 * 100) + '%';
  } else {
    frenzyWrap.classList.remove('on');
  }
}

function fillThingSlots() {
  const visible = ALL_THINGS.filter((b, i) => i === 0 || (G.owned[b.id]||0) > 0 || G.totalEarned >= b.baseCost * 0.1);
  G.thingSlots = [];
  const pool = [...visible];
  while (G.thingSlots.length < 4 && pool.length > 0) {
    const idx = Math.floor(Math.random() * pool.length);
    G.thingSlots.push(pool.splice(idx, 1)[0].id);
  }
}

function fillUpgradeSlots() {
  const cs = condState();
  const avail = UPGRADES.filter(u => !G.bought.includes(u.id) && u.cond(cs));
  G.upgradeSlots = G.upgradeSlots.filter(id => avail.some(u => u.id === id));
  const pool = avail.filter(u => !G.upgradeSlots.includes(u.id));
  while (G.upgradeSlots.length < 3 && pool.length > 0) {
    const idx = Math.floor(Math.random() * pool.length);
    G.upgradeSlots.push(pool.splice(idx, 1)[0].id);
  }
}

function renderUpgrades() {
  upgPanel.innerHTML = '<div class="panel-label">Upgrades</div>';
  fillUpgradeSlots();
  if (!G.upgradeSlots.length) {
    const el = document.createElement('div');
    el.className = 'upg-none';
    el.textContent = 'No upgrades available yet.';
    upgPanel.appendChild(el);
  }
  for (const id of G.upgradeSlots) {
    const u = UPGRADES.find(u => u.id === id);
    if (!u) continue;
    const canBuy = G.cash >= u.cost;
    const card = document.createElement('div');
    card.className = 'upg-card ' + (canBuy ? 'affordable' : 'too-costly') + (u.milestone ? ' milestone-upg' : '');
    card.innerHTML = `
      <div class="upg-icon">${u.icon}</div>
      <div>
        <div class="upg-name">${u.name}</div>
        <div class="upg-desc">${u.desc}</div>
        <div class="upg-cost">$${fmt(u.cost)}</div>
      </div>`;
    if (canBuy) card.addEventListener('click', () => buyUpgrade(u));
    upgPanel.appendChild(card);
  }
  renderWorkers();
}

function renderWorkers() {
  const div = document.createElement('div');
  div.style.cssText = 'border-top:1px solid var(--border);margin-top:.4rem;padding-top:.6rem;display:flex;flex-direction:column;gap:.5rem';
  div.innerHTML = '<div class="panel-label">Workers</div>';
  for (const w of WORKERS) {
    const cost  = workerCost(w);
    const count = G.workers[w.id] || 0;
    const canBuy = G.cash >= cost;
    const card = document.createElement('div');
    card.className = 'upg-card ' + (canBuy ? 'affordable' : 'too-costly');
    card.innerHTML = `
      <div class="upg-icon">${w.icon}</div>
      <div>
        <div class="upg-name">${w.name}${count > 0 ? ` <span style="color:var(--mint);font-size:.68rem">×${count}</span>` : ''}</div>
        <div class="upg-desc">${w.desc}</div>
        <div class="upg-cost">$${fmt(cost)}</div>
      </div>`;
    if (canBuy) card.addEventListener('click', () => buyWorker(w));
    div.appendChild(card);
  }
  upgPanel.appendChild(div);
}

function buyWorker(w) {
  const cost = workerCost(w);
  if (G.cash < cost) return;
  G.cash -= cost;
  G.workers[w.id] = (G.workers[w.id] || 0) + 1;
  fillThingSlots();
  save(); render();
}

function renderBuildings() {
  bldPanel.innerHTML = '<div class="panel-label">Things</div>';
  if (!G.thingSlots.length) fillThingSlots();
  for (const id of G.thingSlots) {
    const b = ALL_THINGS.find(b => b.id === id);
    if (!b) continue;
    const owned = G.owned[b.id] || 0;
    const cost  = bldCost(b);
    const cps   = bldCps(b);
    const canBuy = G.cash >= cost;
    const row = document.createElement('div');
    row.className = 'bld-row ' + (canBuy ? 'affordable' : 'too-costly');
    row.innerHTML = `
      <div class="bld-icon">${b.icon}</div>
      <div class="bld-info">
        <div class="bld-name">${b.name}</div>
        <div class="bld-desc">${b.desc}</div>
        <div class="bld-cps">${fmt(cps)}/sec · ${owned > 0 ? fmt(owned * cps)+'/sec total' : 'none owned'}</div>
      </div>
      <div class="bld-right">
        <div class="bld-cost">$${fmt(cost)}</div>
        <div class="bld-owned">${owned} owned</div>
      </div>`;
    if (canBuy) row.addEventListener('click', () => buyBuilding(b));
    bldPanel.appendChild(row);
  }
}

function render() {
  renderHUD();
  renderUpgrades();
  renderBuildings();
}

// ── ACTIONS ────────────────────────────────────────────────
function onCupClick(e) {
  if (G.won) return;
  const earned = clickVal();
  G.cash += earned;
  G.totalEarned += earned;
  spawnFloat(e.clientX, e.clientY, '+$' + fmt(earned));
  checkMilestones();
  checkGoogol();
  render();
}

function buyBuilding(b) {
  const cost = bldCost(b);
  if (G.cash < cost) return;
  G.cash -= cost;
  G.owned[b.id] = (G.owned[b.id] || 0) + 1;
  const slotIdx = G.thingSlots.indexOf(b.id);
  if (slotIdx !== -1) {
    const visible = ALL_THINGS.filter(t => (G.owned[t.id]||0) > 0 || G.totalEarned >= t.baseCost * 0.1);
    const pool = visible.filter(t => !G.thingSlots.includes(t.id));
    if (pool.length > 0) {
      const pick = pool[Math.floor(Math.random() * pool.length)];
      G.thingSlots[slotIdx] = pick.id;
    } else {
      G.thingSlots.splice(slotIdx, 1);
    }
  }
  save(); render();
}

function buyUpgrade(u) {
  if (G.cash < u.cost) return;
  G.cash -= u.cost;
  applyUpgrade(u);
  G.bought.push(u.id);
  G.upgradeSlots = G.upgradeSlots.filter(id => id !== u.id);
  fillUpgradeSlots();
  showToast(u.icon + ' ' + u.name, u.desc);
  save(); render();
}

function applyUpgrade(u) {
  if (u.eff.type === 'click')       G.clickMult *= u.eff.mult;
  else if (u.eff.type === 'bld')    G.bldMult[u.eff.id] = (G.bldMult[u.eff.id] || 1) * u.eff.mult;
  else if (u.eff.type === 'global') G.globalMult *= u.eff.mult;
}

// ── FLOAT TEXT ─────────────────────────────────────────────
function spawnFloat(x, y, text) {
  const el = document.createElement('div');
  el.className = 'float-txt';
  el.textContent = text;
  el.style.left = (x - 16) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 820);
}

// ── GOLDEN COFFEE ──────────────────────────────────────────
let goldenEl = null, goldenAutoRemove = null, goldenTimeout = null;

function scheduleGolden() {
  const delay = 90_000 + Math.random() * 90_000;
  goldenTimeout = setTimeout(spawnGolden, delay);
}

function spawnGolden() {
  if (goldenEl) { goldenEl.remove(); goldenEl = null; }
  goldenEl = document.createElement('button');
  goldenEl.className = 'golden-cup';
  goldenEl.type = 'button';
  goldenEl.textContent = '✨';
  goldenEl.style.left = (12 + Math.random() * 70) + '%';
  goldenEl.style.top  = (18 + Math.random() * 58) + '%';
  clickArea.appendChild(goldenEl);
  goldenAutoRemove = setTimeout(() => {
    goldenEl?.remove(); goldenEl = null;
    scheduleGolden();
  }, 13_000);
  goldenEl.addEventListener('click', () => {
    clearTimeout(goldenAutoRemove);
    onGoldenClick();
    goldenEl?.remove(); goldenEl = null;
    scheduleGolden();
  }, { once: true });
}

function onGoldenClick() {
  if (Math.random() < 0.5) {
    G.frenzy = 77;
    ticker.textContent = '☕ COFFEE FRENZY! 7× production for 77 seconds!';
    showToast('☕ Coffee Frenzy!', '7× production for 77 seconds!');
  } else {
    const bonus = Math.max(10, Math.min(totalCps() * 900, G.totalEarned * 0.15 + 100));
    G.cash += bonus; G.totalEarned += bonus;
    ticker.textContent = `🍀 Lucky! Scored $${fmt(bonus)} bonus cash.`;
    showToast('🍀 Lucky!', `+$${fmt(bonus)} bonus!`);
    checkMilestones();
  }
  render();
}

// ── MILESTONES ─────────────────────────────────────────────
function checkMilestones() {
  for (const m of MILESTONES) {
    if (!G.mseen.includes(m.n) && G.totalEarned >= m.n) {
      G.mseen.push(m.n);
      const hasUnlock = UPGRADES.some(u => u.milestone && u.cond({ totalEarned: m.n }) && !G.bought.includes(u.id));
      showToast('Milestone! 🎉', m.msg + (hasUnlock ? ' ★ New upgrade unlocked in the shop!' : ''));
      fillUpgradeSlots();
    }
  }
}

// ── TOAST ──────────────────────────────────────────────────
function showToast(title, body) {
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<div class="toast-title">${title}</div><div class="toast-body">${body}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3700);
}

// ── TICKER ─────────────────────────────────────────────────
let tickerIdx = 0;
function rotateTicker() {
  ticker.textContent = TICKER[tickerIdx++ % TICKER.length];
  setTimeout(rotateTicker, 7_000);
}

// ── GOOGOL WIN ─────────────────────────────────────────────
const GOOGOL = 1e100;
function checkGoogol() {
  if (G.totalEarned >= GOOGOL && !G.won) {
    G.won = true;
    clearInterval(fastLoop);
    clearInterval(slowLoop);
    save();
    document.getElementById('googol-win').style.display = 'flex';
  }
}

// ── GAME LOOP ──────────────────────────────────────────────
const fastLoop = setInterval(() => {
  const inc = totalCps() * 0.1;
  if (inc > 0) {
    G.cash += inc; G.totalEarned += inc;
    checkMilestones();
    checkGoogol();
  }
  if (G.frenzy > 0) G.frenzy = Math.max(0, G.frenzy - 0.1);
  if (G.miniFrenzy > 0) G.miniFrenzy = Math.max(0, G.miniFrenzy - 0.1);
  renderHUD();
}, 100);

const slowLoop = setInterval(() => { render(); save(); }, 1_000);

// ── SAVE / LOAD ────────────────────────────────────────────
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch {}
}

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (!raw) return;
    G = { ...freshState(), ...raw };
    // Rebuild multipliers from bought list
    G.clickMult = 1; G.bldMult = {}; G.globalMult = 1;
    for (const id of (G.bought || [])) {
      const u = UPGRADES.find(u => u.id === id);
      if (u) applyUpgrade(u);
    }
  } catch { G = freshState(); }
}


// ── INIT ───────────────────────────────────────────────────
cupBtn.addEventListener('click', onCupClick);
document.getElementById('restartBtn').addEventListener('click', () => {
  if (!confirm('Reset everything and start over?')) return;
  localStorage.removeItem(SAVE_KEY);
  G = freshState();
  render();
});
load();
if (G.won) document.getElementById('googol-win').style.display = 'flex';
render();
scheduleGolden();
setTimeout(rotateTicker, 4_000);
document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
function toggleTheme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('gf-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}
</script>
