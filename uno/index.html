  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f172a;
      --panel: #18233a;
      --panel-2: #22304d;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(255,255,255,0.13);
      --red: #ef4444;
      --yellow: #facc15;
      --green: #22c55e;
      --blue: #3b82f6;
      --wild: #111827;
    }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 16%, rgba(239,68,68,.22), transparent 24rem),
        radial-gradient(circle at 84% 12%, rgba(59,130,246,.22), transparent 24rem),
        radial-gradient(circle at 50% 90%, rgba(34,197,94,.16), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      align-items: center;
      color: var(--text);
      display: inline-flex;
      font-size: 1.1rem;
      font-weight: 900;
      gap: .42rem;
      text-decoration: none;
    }
    .brand-mark { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; }
    .home-link {
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .45rem .7rem;
      text-decoration: none;
      font-size: .82rem;
      font-weight: 800;
    }
    main {
      width: min(1060px, 100%);
      margin: 0 auto;
      padding: 1.2rem;
      display: grid;
      gap: .9rem;
    }
    .table {
      display: grid;
      gap: .9rem;
      min-height: calc(100vh - 86px);
      grid-template-rows: auto 1fr auto;
    }
    .panel {
      background: rgba(24,35,58,.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 18px 42px rgba(0,0,0,.26);
    }
    .opponent, .status, .player {
      padding: 1rem;
    }
    .label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .count {
      font-size: 1.15rem;
      font-weight: 900;
    }
    .center {
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 1rem;
    }
    .piles {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .deck {
      width: 90px;
      height: 128px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,.72);
      background:
        linear-gradient(135deg, transparent 0 46%, rgba(255,255,255,.85) 46% 54%, transparent 54%),
        linear-gradient(45deg, var(--red) 0 25%, var(--blue) 25% 50%, var(--green) 50% 75%, var(--yellow) 75%);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1rem;
      font-weight: 1000;
      box-shadow: 0 12px 28px rgba(0,0,0,.32);
    }
    .card {
      width: 90px;
      height: 128px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,.78);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 1.9rem;
      font-weight: 1000;
      line-height: 1;
      overflow: hidden;
      padding: .35rem;
      position: relative;
      box-shadow: 0 12px 28px rgba(0,0,0,.32);
      transform: translateY(0);
      transition: transform .14s ease, filter .14s ease, opacity .14s ease;
    }
    .card::before, .card::after {
      content: attr(data-label);
      position: absolute;
      font-size: .72rem;
      font-weight: 1000;
    }
    .card::before { top: .55rem; left: .58rem; }
    .card::after { right: .58rem; bottom: .55rem; transform: rotate(180deg); }
    .card.action {
      font-size: 1rem;
      overflow-wrap: anywhere;
    }
    .card:hover { transform: translateY(-8px); }
    .card.unplayable {
      cursor: not-allowed;
      filter: saturate(.5);
      opacity: .58;
    }
    .card.unplayable:hover { transform: none; }
    .card.red { background: var(--red); }
    .card.yellow { background: var(--yellow); color: #422006; }
    .card.green { background: var(--green); }
    .card.blue { background: var(--blue); }
    .card.wild {
      background:
        radial-gradient(circle at 28% 28%, var(--red) 0 18%, transparent 19%),
        radial-gradient(circle at 72% 28%, var(--yellow) 0 18%, transparent 19%),
        radial-gradient(circle at 28% 72%, var(--green) 0 18%, transparent 19%),
        radial-gradient(circle at 72% 72%, var(--blue) 0 18%, transparent 19%),
        var(--wild);

    .hand {
      display: flex;
      gap: .55rem;
      overflow-x: auto;
      padding: .85rem .1rem .3rem;
      min-height: 150px;
    }
    .npc-hand {
      justify-content: center;
      min-height: 72px;

    .card-back {
      width: 46px;
      height: 64px;

      border: 1px solid rgba(255,255,255,.62);
      background:
        linear-gradient(135deg, transparent 0 46%, rgba(255,255,255,.75) 46% 54%, transparent 54%),
        linear-gradient(45deg, var(--red) 0 25%, var(--blue) 25% 50%, var(--green) 50% 75%, var(--yellow) 75%);
      box-shadow: 0 8px 18px rgba(0,0,0,.24);
    }
    .message {
      min-height: 1.4rem;
      color: var(--text);
      font-size: .95rem;
      font-weight: 800;
      text-align: center;
    }
    .meta {
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: .55rem;
    }
    button {
      background: #fff;
      border: 0;
      border-radius: 10px;
      color: #111827;
      cursor: pointer;
      font: inherit;
      font-size: .9rem;
      font-weight: 900;
      padding: .72rem .95rem;
    }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .uno-btn {
      background: linear-gradient(135deg, var(--red), var(--yellow));
      color: #fff;
      min-width: 82px;
      text-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .uno-btn.active {
      animation: unoPulse .6s ease-in-out infinite alternate;
      box-shadow: 0 0 0 3px rgba(250,204,21,.18), 0 12px 28px rgba(239,68,68,.28);
    }
    @keyframes unoPulse {
      from { transform: scale(1); filter: brightness(1); }
      to { transform: scale(1.07); filter: brightness(1.14); }
    }
    @keyframes cardPlay {
      0%   { transform: scale(1.22) rotate(-6deg); opacity: .7; }
      60%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .card-played { animation: cardPlay .28s cubic-bezier(.34,1.56,.64,1); }
    button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }
    .color-picker {
      display: none;
      grid-template-columns: repeat(4, minmax(76px, 1fr));
      gap: .45rem;
      width: min(420px, 100%);
    }
    .color-picker.on { display: grid; }
    .color-btn {
      color: #fff;
      min-width: 0;
      width: 100%;
    }
    .color-picker .color-btn[data-pick="red"] { background: var(--red); color: #fff; }
    .color-picker .color-btn[data-pick="green"] { background: var(--green); color: #fff; }
    .color-picker .color-btn[data-pick="blue"] { background: var(--blue); color: #fff; }
    .color-picker .color-btn[data-pick="yellow"] { background: var(--yellow); color: #422006; }
    .active-color {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 900;
    }
    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      background: currentColor;
    }
    @media (max-width: 640px) {
      main { padding: .75rem; }
      .card, .deck { width: 74px; height: 106px; border-radius: 12px; }
      .card { font-size: 1.5rem; }
      .card.action { font-size: .78rem; }
      .hand { min-height: 126px; }
      .color-picker { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 420px) {
      header { padding: .5rem .75rem; }
      .card, .deck { width: 62px; height: 90px; border-radius: 10px; }
      .card { font-size: 1.25rem; }
      .hand { min-height: 110px; }
    }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
    body { animation: pageIn .22s ease; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
    [data-theme="light"] { --bg: #f5f5f5; --panel: #ffffff; --panel-2: #f0f0f5; --text: #111827; --muted: #6b7280; --border: rgba(0,0,0,.1); }
    [data-theme="light"] body { background: radial-gradient(circle at 18% 16%,rgba(239,68,68,.08),transparent 24rem),radial-gradient(circle at 84% 12%,rgba(59,130,246,.08),transparent 24rem),radial-gradient(circle at 50% 90%,rgba(34,197,94,.06),transparent 24rem),#f5f5f5; }
    [data-theme="light"] .panel { background: rgba(255,255,255,.95); }
    [data-theme="light"] #win-overlay { background: rgba(220,215,240,.82); }

    /* Win overlay */
    #win-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10,8,18,.78);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      animation: overlayIn .32s ease;
    }
    #win-overlay.on { display: flex; }
    @keyframes overlayIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: scale(1); } }
    #win-title { font-size: 3rem; font-weight: 900; letter-spacing: -.02em; }
    #win-sub { color: rgba(255,255,255,.6); font-size: .95rem; font-weight: 700; }
    #win-play-btn {
      background: #fff;
      border: none;
      border-radius: 12px;
      color: #111;
      cursor: pointer;
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      padding: .72rem 1.6rem;
      margin-top: .4rem;
      transition: transform .1s;
    }
    #win-play-btn:active { transform: scale(.96); }
    @keyframes confettiFall { to { transform: translateY(110vh) rotate(800deg); opacity: 0; } }
  </style>

<body>
  <header>
    <a class="brand" href="https://gamed.fun/" aria-label="gamed.fun">
      <svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#fbbf24"/><circle cx="34" cy="40" r="6" fill="#1a1625"/><circle cx="66" cy="40" r="6" fill="#1a1625"/><path d="M30 58 Q50 76 70 58" stroke="#1a1625" stroke-width="5" stroke-linecap="round" fill="none"/></svg>
      <span>gamed.fun</span>
    </a>
    <button id="themeBtn" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;padding:.3rem .55rem;color:var(--muted);line-height:1">☀️</button>
  </header>

  <div id="win-overlay">
    <div id="win-title"></div>
    <div id="win-sub"></div>
    <button id="win-play-btn">Play Again</button>
  </div>

  <main>
    <section class="table">
      <div class="opponent panel">
        <div class="row">
          <div>
            <div class="label">NPC</div>
            <div class="count"><span id="npcCount">7</span> cards</div>
          </div>
          <div class="active-color"><span class="dot" id="colorDot"></span><span id="colorName">red</span></div>
        </div>
        <div class="npc-hand" id="npcHand"></div>
      </div>

      <div class="center panel">
        <div class="piles">
          <button class="deck" id="drawBtn" type="button">DRAW</button>
          <div id="discard"></div>
        </div>
        <div class="message" id="message"></div>
        <div class="meta" id="deckCount"></div>
        <div class="color-picker" id="colorPicker">
          <button class="color-btn red" data-pick="red" type="button">Red</button>
          <button class="color-btn yellow" data-pick="yellow" type="button">Yellow</button>
          <button class="color-btn green" data-pick="green" type="button">Green</button>
          <button class="color-btn blue" data-pick="blue" type="button">Blue</button>
        </div>
        <div class="controls">
          <button class="uno-btn" id="unoBtn" type="button" disabled>UNO</button>
          <button class="secondary" id="stackingBtn" type="button" aria-pressed="false">Stacking: Off</button>
          <button class="secondary" id="newGameBtn" type="button">New game</button>
        </div>
      </div>

      <div class="player panel">
        <div class="row">
          <div>
            <div class="label">You</div>
            <div class="count"><span id="playerCount">7</span> cards</div>
          </div>
        </div>
        <div class="hand" id="playerHand"></div>
      </div>
    </section>
  </main>

  <script>
    const colors = ['red', 'yellow', 'green', 'blue'];
    const playerHandEl = document.getElementById('playerHand');
    const npcHandEl = document.getElementById('npcHand');
    const discardEl = document.getElementById('discard');
    const messageEl = document.getElementById('message');
    const deckCountEl = document.getElementById('deckCount');
    const playerCountEl = document.getElementById('playerCount');
    const npcCountEl = document.getElementById('npcCount');
    const drawBtn = document.getElementById('drawBtn');
    const unoBtn = document.getElementById('unoBtn');
    const stackingBtn = document.getElementById('stackingBtn');
    const newGameBtn = document.getElementById('newGameBtn');
    const colorPicker = document.getElementById('colorPicker');
    const colorDot = document.getElementById('colorDot');
    const colorName = document.getElementById('colorName');

    let deck = [];
    let discard = [];
    let player = [];
    let npc = [];
    let currentColor = 'red';
    let turn = 'player';
    let gameOver = false;
    let pendingWild = null;
    let pendingDraw = null;
    let unoPending = false;
    let unoTimer = null;
    let audioCtx = null;
    let stackingEnabled = localStorage.getItem('uno_stacking') === 'on';

    function buildDeck() {
      const cards = [];
      colors.forEach(color => {
        cards.push(card(color, 'number', '0'));
        for (let n = 1; n <= 9; n++) {
          cards.push(card(color, 'number', String(n)), card(color, 'number', String(n)));
        }
        ['Skip', 'Reverse', '+2'].forEach(value => {
          cards.push(card(color, 'action', value), card(color, 'action', value));
        });
      });
      for (let i = 0; i < 4; i++) cards.push(card('wild', 'wild', 'Wild'), card('wild', 'wild4', '+4'));
      return shuffle(cards);
    }

    function card(color, type, value) {
      const id = globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : `${color}-${type}-${value}-${Math.random()}`;
      return { id, color, type, value };
    }

    function shuffle(items) {
      const arr = [...items];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startGame() {
      deck = buildDeck();
      discard = [];
      player = [];
      npc = [];
      turn = 'player';
      gameOver = false;
      pendingWild = null;
      pendingDraw = null;
      clearUnoCall();
      for (let i = 0; i < 7; i++) {
        player.push(deck.pop());
        npc.push(deck.pop());
      }
      let first = deck.pop();
      while (first.color === 'wild' || first.type !== 'number') {
        deck.unshift(first);
        deck = shuffle(deck);
        first = deck.pop();
      }
      discard.push(first);
      currentColor = first.color;
      messageEl.textContent = 'Your turn.';
      colorPicker.classList.remove('on');
      applyCardEffect(first, 'start');
      render();
    }

    function topCard() {
      return discard[discard.length - 1];
    }

    function canPlay(cardToCheck) {
      if (pendingDraw && stackingEnabled) {
        return cardToCheck.value === pendingDraw.value || cardToCheck.value === '+4';
      }
      const top = topCard();
      return cardToCheck.color === 'wild'
        || cardToCheck.color === currentColor
        || cardToCheck.value === top.value;
    }

    function drawCard(hand) {
      if (!deck.length) recycleDeck();
      if (deck.length) hand.push(deck.pop());
    }

    function recycleDeck() {
      if (discard.length <= 1) return;
      const top = discard.pop();
      deck = shuffle(discard.map(item => ({ ...item })));
      discard = [top];
    }

    function playFrom(hand, index, owner) {
      const played = hand[index];
      if (!played || !canPlay(played) || gameOver) return false;
      hand.splice(index, 1);
      discard.push(played);
      currentColor = played.color === 'wild' ? currentColor : played.color;
      if (played.color === 'wild' && owner === 'player') {
        pendingWild = played;
        turn = 'choosing';
        messageEl.textContent = 'Pick a color.';
        colorPicker.classList.add('on');
        render();
        return true;
      }
      if (played.color === 'wild') currentColor = chooseNpcColor();
      finishPlayedCard(played, owner);
      return true;
    }

    function finishPlayedCard(played, owner) {
      colorPicker.classList.remove('on');
      if (checkWinner(owner)) return;
      applyCardEffect(played, owner);
      if (owner === 'player' && player.length === 1) startUnoCall();
      render();
      if (turn === 'npc') setTimeout(npcTurn, 650);
    }

    function applyCardEffect(played, owner) {
      const other = owner === 'player' ? npc : player;
      if (played.value === '+2' || played.value === '+4') {
        const amount = played.value === '+2' ? 2 : 4;
        const target = owner === 'player' ? 'npc' : 'player';
        if (stackingEnabled && owner !== 'start') {
          const previousAmount = pendingDraw?.amount || 0;
          pendingDraw = { value: played.value, amount: previousAmount + amount, target };
          turn = target;
          messageEl.textContent = `${target === 'player' ? 'You' : 'NPC'} must stack ${played.value} or draw ${pendingDraw.amount}.`;
        } else {
          for (let i = 0; i < amount; i++) drawCard(other);
          if (owner === 'npc') clearUnoCall();
          turn = owner;
          messageEl.textContent = `${owner === 'player' ? 'NPC' : 'You'} drew ${amount}. ${owner === 'player' ? 'Your' : 'NPC'} turn again.`;
        }
      } else if (played.value === 'Skip' || played.value === 'Reverse') {
        turn = owner;
        messageEl.textContent = `${owner === 'player' ? 'NPC' : 'You'} got skipped.`;
      } else if (owner === 'start') {
        turn = 'player';
        messageEl.textContent = 'Your turn.';
      } else {
        turn = owner === 'player' ? 'npc' : 'player';
        messageEl.textContent = turn === 'player' ? 'Your turn.' : 'NPC turn.';
        document.title = turn === 'player' ? 'Your turn — UNO Duel' : 'NPC turn — UNO Duel';
      }
    }

    function checkWinner(owner) {
      if (owner === 'player' && player.length === 0) {
        win('You win.');
        return true;
      }
      if (owner === 'npc' && npc.length === 0) {
        win('NPC wins.');
        return true;
      }
      return false;
    }

    const winOverlay = document.getElementById('win-overlay');
    const winTitle   = document.getElementById('win-title');
    const winSub     = document.getElementById('win-sub');
    document.getElementById('win-play-btn').addEventListener('click', () => {
      winOverlay.classList.remove('on');
      startGame();
    });

    function launchConfetti() {
      const colors = ['#ef4444','#facc15','#22c55e','#3b82f6','#ffffff','#c084fc'];
      for (let i = 0; i < 80; i++) {
        const el = document.createElement('div');
        const size = 6 + Math.random() * 9;
        el.style.cssText = [
          'position:fixed', `top:-${size}px`, `left:${Math.random()*100}%`,
          `width:${size}px`, `height:${size}px`,
          `background:${colors[Math.floor(Math.random()*colors.length)]}`,
          `border-radius:${Math.random()>.5?'50%':'2px'}`,
          'pointer-events:none', 'z-index:9999',
          `animation:confettiFall ${1.5+Math.random()*2}s ease-in forwards`,
          `animation-delay:${Math.random()*.8}s`
        ].join(';');
        document.body.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    function win(text) {
      gameOver = true;
      turn = 'over';
      clearUnoCall();
      messageEl.textContent = text;
      document.title = text.startsWith('You') ? 'You win! — UNO Duel' : 'NPC wins — UNO Duel';
      colorPicker.classList.remove('on');
      render();
      const playerWon = text.startsWith('You');
      setTimeout(() => {
        winTitle.textContent = playerWon ? 'You win! 🎉' : 'NPC wins 😅';
        winTitle.style.color = playerWon ? '#22c55e' : '#f87171';
        winSub.textContent = playerWon ? 'Nice hand.' : 'Better luck next time.';
        winOverlay.classList.add('on');
        if (playerWon) launchConfetti();
      }, 400);
    }

    function chooseNpcColor() {
      const counts = Object.fromEntries(colors.map(color => [color, 0]));
      npc.forEach(item => {
        if (counts[item.color] !== undefined) counts[item.color]++;
      });
      return colors.reduce((best, color) => counts[color] > counts[best] ? color : best, colors[0]);
    }

    function npcTurn() {
      if (gameOver || turn !== 'npc') return;
      const playableIndex = npc.findIndex(canPlay);
      if (playableIndex >= 0) {
        const played = npc[playableIndex];
        playFrom(npc, playableIndex, 'npc');
        if (!pendingDraw) messageEl.textContent = `NPC played ${labelFor(played)}.`;
      } else {
        if (pendingDraw) {
          resolvePendingDraw('npc');
          return;
        }
        drawCard(npc);
        const drawn = npc[npc.length - 1];
        if (drawn && canPlay(drawn)) {
          playFrom(npc, npc.length - 1, 'npc');
          messageEl.textContent = `NPC drew and played ${labelFor(drawn)}.`;
        } else {
          turn = 'player';
          messageEl.textContent = 'NPC drew. Your turn.';
          render();
        }
      }
    }

    function labelFor(item) {
      return item.color === 'wild' ? item.value : `${item.color} ${item.value}`;
    }

    function renderCard(item, playable, onClick) {
      const el = document.createElement('button');
      const isLongAction = item.value.length > 2;
      el.className = `card ${item.color}${isLongAction ? ' action' : ''}${playable ? '' : ' unplayable'}`;
      el.type = 'button';
      el.dataset.label = item.value;
      el.textContent = item.value;
      el.disabled = !playable;
      el.addEventListener('click', onClick);
      return el;
    }

    function render() {
      playerHandEl.innerHTML = '';
      player.forEach((item, index) => {
        playerHandEl.appendChild(renderCard(item, turn === 'player' && canPlay(item), () => {
          if (turn === 'player') playFrom(player, index, 'player');
        }));
      });
      npcHandEl.innerHTML = '';
      npc.forEach(() => {
        const back = document.createElement('div');
        back.className = 'card-back';
        npcHandEl.appendChild(back);
      });
      discardEl.innerHTML = '';
      const discardCard = renderCard(topCard(), false, () => {});
      discardCard.classList.add('card-played');
      discardEl.appendChild(discardCard);
      playerCountEl.textContent = player.length;
      npcCountEl.textContent = npc.length;
      deckCountEl.textContent = `${deck.length} cards left in deck`;
      drawBtn.disabled = turn !== 'player' || gameOver;
      drawBtn.textContent = pendingDraw && turn === 'player' ? `DRAW ${pendingDraw.amount}` : 'DRAW';
      unoBtn.disabled = !unoPending || gameOver;
      unoBtn.classList.toggle('active', unoPending && !gameOver);
      stackingBtn.textContent = `Stacking: ${stackingEnabled ? 'On' : 'Off'}`;
      stackingBtn.setAttribute('aria-pressed', String(stackingEnabled));
      stackingBtn.disabled = Boolean(pendingDraw) || turn === 'choosing';
      colorDot.style.color = `var(--${currentColor})`;
      colorName.textContent = currentColor;
    }

    drawBtn.addEventListener('click', () => {
      if (turn !== 'player' || gameOver) return;
      if (pendingDraw) {
        resolvePendingDraw('player');
        return;
      }
      drawCard(player);
      clearUnoCall();
      const drawn = player[player.length - 1];
      if (drawn && canPlay(drawn)) {
        messageEl.textContent = 'You drew a playable card.';
      } else {
        turn = 'npc';
        messageEl.textContent = 'You drew. NPC turn.';
        setTimeout(npcTurn, 650);
      }
      render();
    });

    function resolvePendingDraw(target) {
      const hand = target === 'player' ? player : npc;
      const other = target === 'player' ? 'npc' : 'player';
      const amount = pendingDraw.amount;
      for (let i = 0; i < amount; i++) drawCard(hand);
      if (target === 'player') clearUnoCall();
      pendingDraw = null;
      turn = other;
      messageEl.textContent = `${target === 'player' ? 'You drew' : 'NPC drew'} ${amount}. ${other === 'player' ? 'Your' : 'NPC'} turn.`;
      render();
      if (turn === 'npc') setTimeout(npcTurn, 650);
    }

    colorPicker.addEventListener('click', event => {
      const btn = event.target.closest('[data-pick]');
      if (!btn || !pendingWild) return;
      currentColor = btn.dataset.pick;
      const played = pendingWild;
      pendingWild = null;
      finishPlayedCard(played, 'player');
    });

    function startUnoCall() {
      clearUnoCall();
      unoPending = true;
      messageEl.textContent += ' Call UNO!';
      playUnoAlert();
      unoTimer = setTimeout(() => {
        if (!unoPending || gameOver || player.length !== 1) return;
        for (let i = 0; i < 4; i++) drawCard(player);
        clearUnoCall();
        messageEl.textContent = 'You forgot to call UNO. Draw 4.';
        render();
      }, 3000);
    }

    function clearUnoCall() {
      unoPending = false;
      clearTimeout(unoTimer);
      unoTimer = null;
    }

    function ensureAudio() {
      try {
        audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      } catch {
        return null;
      }
    }

    function playTone(freq, start, duration, type = 'triangle', gain = 0.14) {
      try {
        const ctx = ensureAudio();
        if (!ctx) return;
        const osc = audioCtx.createOscillator();
        const vol = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
        vol.gain.setValueAtTime(gain, audioCtx.currentTime + start);
        vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + start + duration);
        osc.connect(vol);
        vol.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + start);
        osc.stop(audioCtx.currentTime + start + duration);
      } catch {}
    }

    function playUnoAlert() {
      playTone(660, 0, 0.12);
      playTone(880, 0.13, 0.14);
      playTone(1046, 0.28, 0.18);
    }

    unoBtn.addEventListener('click', () => {
      if (!unoPending || gameOver) return;
      clearUnoCall();
      messageEl.textContent = 'UNO called in time.';
      render();
    });

    stackingBtn.addEventListener('click', () => {
      stackingEnabled = !stackingEnabled;
      localStorage.setItem('uno_stacking', stackingEnabled ? 'on' : 'off');
      messageEl.textContent = `Stacking ${stackingEnabled ? 'on' : 'off'}.`;
      render();
    });

    newGameBtn.addEventListener('click', startGame);
    window.addEventListener('pointerdown', ensureAudio, { once: true });
    window.addEventListener('keydown', ensureAudio, { once: true });
    startGame();
    document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
    function toggleTheme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('gf-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}
  </script>
</body>
</html>
