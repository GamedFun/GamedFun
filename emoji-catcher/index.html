<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Pop - gamed.fun</title>
<style>
  :root {
    --bg: #1a1625;
    --panel: #231f30;
    --text: #fff7ed;
    --muted: #b8a99a;
    --gold: #fbbf24;
    --border: rgba(255,255,255,.13);
    --c-common:    #9ca3af;
    --c-uncommon:  #34d399;
    --c-rare:      #60a5fa;
    --c-epic:      #c084fc;
    --c-legendary: #fbbf24;
    --c-mythic:    #f87171;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(180deg, #181219 0%, var(--bg) 100%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    -webkit-tap-highlight-color: transparent;
  }

  /* HEADER */
  header {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .5rem 1rem;
    border-bottom: 1px solid var(--border);
    background: rgba(18,16,20,.9);
    backdrop-filter: blur(8px);
    z-index: 20;
  }
  .brand { align-items: center; color: var(--gold); display: inline-flex; font-size: .95rem; gap: .42rem; text-decoration: none; font-weight: 900; }
  .brand-mark { width: 1.2rem; height: 1.2rem; flex: 0 0 auto; }
  .home-link { text-decoration: none; color: var(--muted); font-size: .82rem; }

  /* HUD */
  #hud {
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .4rem 1rem;
    font-size: .88rem;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  #hud .stat { display: flex; align-items: center; gap: .35rem; color: var(--muted); }
  #hud .stat strong { color: var(--text); font-size: 1rem; }
  #new-game-btn {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #2a2438;
    color: var(--text);
    font-size: .78rem;
    font-weight: 800;
    padding: .3rem .55rem;
    cursor: pointer;
    white-space: nowrap;
  }
  #new-game-btn:hover { background: #332d45; }

  /* GAME AREA */
  #game-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    cursor: crosshair;
  }

  /* FLOATING EMOJIS */
  .emoji-bubble {
    position: absolute;
    font-size: 2.2rem;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid transparent;
    animation: bobble 3s ease-in-out infinite;
    transition: transform .08s;
    z-index: 5;
  }
  .emoji-bubble:hover { transform: scale(1.15); }
  .emoji-bubble:active { transform: scale(0.9); }

  .emoji-bubble.common    { border-color: var(--c-common);    box-shadow: 0 0 6px var(--c-common);                                                       background: rgba(156,163,175,.08); }
  .emoji-bubble.uncommon  { border-color: var(--c-uncommon);  box-shadow: 0 0 12px var(--c-uncommon), 0 0 24px rgba(52,211,153,.2);                        background: rgba(52,211,153,.1); }
  .emoji-bubble.rare      { border-color: var(--c-rare);      box-shadow: 0 0 16px var(--c-rare), 0 0 32px rgba(96,165,250,.3);                            background: rgba(96,165,250,.12); border-width: 2px; }
  .emoji-bubble.epic      { border-color: var(--c-epic);      box-shadow: 0 0 20px var(--c-epic), 0 0 40px rgba(192,132,252,.35);                          background: rgba(192,132,252,.14); border-width: 2px; }
  .emoji-bubble.legendary { border-color: var(--c-legendary); box-shadow: 0 0 26px var(--c-legendary), 0 0 52px rgba(251,191,36,.4), 0 0 80px rgba(251,191,36,.15); background: rgba(251,191,36,.14); border-width: 3px; animation: bobble 2s ease-in-out infinite, shimmer 1.5s ease-in-out infinite; }
  .emoji-bubble.mythic    { border-color: var(--c-mythic);    box-shadow: 0 0 34px var(--c-mythic), 0 0 68px rgba(248,113,113,.5), 0 0 110px rgba(248,113,113,.2); background: rgba(248,113,113,.18); border-width: 3px; animation: bobble 1.5s ease-in-out infinite, pulse-mythic 1s ease-in-out infinite; font-size: 2.6rem; width: 64px; height: 64px; }

  @keyframes bobble {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  @keyframes shimmer {
    0%,100% { box-shadow: 0 0 20px var(--c-legendary); }
    50%      { box-shadow: 0 0 30px var(--c-legendary), 0 0 50px rgba(251,191,36,.3); }
  }
  @keyframes pulse-mythic {
    0%,100% { box-shadow: 0 0 28px var(--c-mythic), 0 0 50px rgba(248,113,113,.3); }
    50%      { box-shadow: 0 0 40px var(--c-mythic), 0 0 80px rgba(248,113,113,.5); }
  }

  .emoji-bubble.fade-out {
    animation: fadeOut .3s forwards !important;
  }
  @keyframes fadeOut {
    to { transform: scale(1.8); opacity: 0; }
  }
  .emoji-bubble.vanish {
    animation: vanish .6s forwards !important;
  }
  @keyframes vanish {
    to { transform: scale(0); opacity: 0; }
  }

  /* COIN POPUP */
  .coin-pop {
    position: fixed;
    font-size: .9rem;
    font-weight: 900;
    pointer-events: none;
    z-index: 100;
    animation: floatUp .8s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-60px); opacity: 0; }
  }

  /* BOTTOM BAR */
  #bottom-bar {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 0;
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #summon-row {
    display: flex;
    gap: .4rem;
    padding: .5rem .7rem;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #summon-row::-webkit-scrollbar { display: none; }
  .summon-btn {
    flex-shrink: 0;
    padding: .4rem .8rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #2a2438;
    color: var(--text);
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    transition: background .12s;
  }
  .summon-btn:hover { background: #332d45; }
  .summon-btn.disabled { opacity: .45; cursor: default; }
  .summon-btn .cost { font-size: .7rem; color: var(--gold); }
  #collection-toggle {
    border: none;
    background: none;
    color: var(--muted);
    font-size: .82rem;
    padding: .3rem;
    cursor: pointer;
    text-align: center;
    width: 100%;
    border-top: 1px solid var(--border);
  }
  #collection-toggle:hover { color: var(--text); }

  /* COLLECTION OVERLAY */
  #collection-overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(10,8,16,.97);
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .3s ease;
  }
  #collection-overlay.open { transform: translateY(0); }
  #coll-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .8rem 1rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #coll-header h2 { font-size: 1.1rem; font-weight: 900; }
  #close-coll {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    cursor: pointer;
    padding: 0 .3rem;
  }
  #rarity-filter {
    display: flex;
    gap: .4rem;
    padding: .5rem .8rem;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }
  #rarity-filter::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0;
    padding: .25rem .7rem;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: all .12s;
  }
  .filter-btn.active { color: #fff; }
  .filter-btn[data-r="all"].active    { background: var(--text); border-color: var(--text); color: #1a1625; }
  .filter-btn[data-r="common"].active    { background: var(--c-common);    border-color: var(--c-common); }
  .filter-btn[data-r="uncommon"].active  { background: var(--c-uncommon);  border-color: var(--c-uncommon); }
  .filter-btn[data-r="rare"].active      { background: var(--c-rare);      border-color: var(--c-rare); }
  .filter-btn[data-r="epic"].active      { background: var(--c-epic);      border-color: var(--c-epic); }
  .filter-btn[data-r="legendary"].active { background: var(--c-legendary); border-color: var(--c-legendary); }
  .filter-btn[data-r="mythic"].active    { background: var(--c-mythic);    border-color: var(--c-mythic); }

  #coll-grid {
    flex: 1;
    overflow-y: auto;
    padding: .8rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    gap: .5rem;
    align-content: start;
  }
  .coll-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    background: #231f30;
    border: 1px solid var(--border);
    font-size: 1.8rem;
    position: relative;
    transition: transform .1s;
  }
  .coll-cell:hover { transform: scale(1.05); }
  .coll-cell.undiscovered { filter: grayscale(1); opacity: .3; }
  .coll-cell.common    { border-color: rgba(156,163,175,.4); }
  .coll-cell.uncommon  { border-color: rgba(52,211,153,.4); }
  .coll-cell.rare      { border-color: rgba(96,165,250,.4); }
  .coll-cell.epic      { border-color: rgba(192,132,252,.4); }
  .coll-cell.legendary { border-color: rgba(251,191,36,.5); box-shadow: 0 0 8px rgba(251,191,36,.2); }
  .coll-cell.mythic    { border-color: rgba(248,113,113,.6); box-shadow: 0 0 10px rgba(248,113,113,.3); }
  .coll-count {
    font-size: .62rem;
    font-weight: 700;
    color: var(--muted);
    line-height: 1;
  }
  .coll-cell .rarity-dot {
    position: absolute;
    top: 4px; right: 4px;
    width: 6px; height: 6px;
    border-radius: 50%;
  }
  .coll-cell.common .rarity-dot    { background: var(--c-common); }
  .coll-cell.uncommon .rarity-dot  { background: var(--c-uncommon); }
  .coll-cell.rare .rarity-dot      { background: var(--c-rare); }
  .coll-cell.epic .rarity-dot      { background: var(--c-epic); }
  .coll-cell.legendary .rarity-dot { background: var(--c-legendary); }
  .coll-cell.mythic .rarity-dot    { background: var(--c-mythic); }

  /* TOOLTIP */
  .coll-cell[title] { cursor: default; }

  /* NEW badge */
  .new-badge {
    position: absolute;
    top: -4px; left: -4px;
    background: var(--c-mythic);
    color: white;
    font-size: .55rem;
    font-weight: 900;
    padding: 1px 4px;
    border-radius: 4px;
    text-transform: uppercase;
  }

  /* BATTLE OVERLAY */
  #battle-overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(10,8,16,.97);
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .3s ease;
  }
  #battle-overlay.open { transform: translateY(0); }
  #battle-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .8rem 1rem;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #battle-header h2 { font-size: 1.1rem; font-weight: 900; }
  #close-battle { background: none; border: none; color: var(--muted); font-size: 1.4rem; cursor: pointer; padding: 0 .3rem; }

  #battle-pick-screen { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #battle-pick-hint { text-align: center; color: var(--muted); font-size: .85rem; padding: .5rem .8rem; flex-shrink: 0; }
  #battle-fighter-grid {
    flex: 1; overflow-y: auto; padding: .8rem;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: .5rem; align-content: start;
  }
  .battle-pick-cell {
    aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1px;
    background: #231f30; border: 1px solid var(--border);
    font-size: 1.7rem; cursor: pointer; transition: transform .1s;
  }
  .battle-pick-cell:hover { transform: scale(1.08); }
  .battle-pick-cell .bp-name { font-size: .52rem; text-align: center; line-height: 1.2; }
  .battle-pick-cell .bp-stats { font-size: .5rem; color: var(--muted); }

  #battle-fight-screen {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    padding: .7rem 1rem; gap: .5rem; overflow-y: auto;
  }
  .battle-card {
    width: 100%; max-width: 320px; background: #231f30; border: 2px solid var(--border);
    border-radius: 14px; padding: .7rem 1rem; display: flex;
    flex-direction: column; align-items: center; gap: .35rem;
  }
  .battle-card .bc-emoji { font-size: 2.8rem; line-height: 1; }
  .battle-card .bc-name { font-size: .85rem; font-weight: 700; }
  .hp-bar-wrap { width: 100%; height: 10px; background: #2a2438; border-radius: 99px; overflow: hidden; }
  .hp-bar { height: 100%; border-radius: 99px; transition: width .35s; background: #34d399; }
  .hp-bar.low { background: #fbbf24; }
  .hp-bar.critical { background: #f87171; }
  .bc-hp-text { font-size: .72rem; color: var(--muted); }
  .vs-label { font-size: 1.1rem; font-weight: 900; color: var(--muted); flex-shrink: 0; }
  #battle-log {
    width: 100%; max-width: 320px; background: #1a1625; border: 1px solid var(--border);
    border-radius: 10px; padding: .45rem .75rem; font-size: .76rem; color: var(--muted);
    min-height: 54px; max-height: 70px; overflow-y: auto; flex-shrink: 0;
  }
  #battle-actions { display: flex; gap: .45rem; width: 100%; max-width: 320px; flex-shrink: 0; }
  .battle-act-btn {
    flex: 1; padding: .5rem .2rem; border-radius: 10px; border: 1px solid var(--border);
    background: #2a2438; color: var(--text); font-size: .8rem; font-weight: 700; cursor: pointer;
    transition: background .12s, transform .08s;
  }
  .battle-act-btn:hover:not(:disabled) { background: #332d45; transform: scale(1.04); }
  .battle-act-btn:disabled { opacity: .4; cursor: default; }

  #battle-result-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem;
  }
  #result-icon { font-size: 3.5rem; }
  #result-title { font-size: 1.5rem; font-weight: 900; }
  #result-desc { font-size: .88rem; color: var(--muted); text-align: center; white-space: pre-line; }
  .result-btn {
    padding: .6rem 1.4rem; border-radius: 10px; border: 1px solid var(--border);
    background: #2a2438; color: var(--text); font-size: .88rem; font-weight: 700; cursor: pointer;
    transition: background .12s;
  }
  .result-btn:hover { background: #332d45; }
  .result-btn.primary { background: rgba(248,113,113,.15); border-color: rgba(248,113,113,.4); color: #f87171; }
  .result-btn.primary:hover { background: rgba(248,113,113,.25); }
</style>
</head>
<body>

<header>
  <a class="brand" href="/" aria-label="gamed.fun">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 11.5h4M10.5 9.5v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="9.5" r="1.4" fill="currentColor"/><circle cx="15" cy="15.5" r="1.4" fill="currentColor"/></svg>
    <span>gamed.fun</span>
  </a>
  <a class="home-link" href="/">← Home</a>
</header>

<div id="hud">
  <div class="stat">🪙 <strong id="coinCount">0</strong> coins</div>
  <div class="stat">📦 <strong id="progress">0 / ?</strong> collected</div>
  <div class="stat" id="streakDisplay" style="font-size:.85rem;color:#fbbf24;font-weight:900;min-width:60px;text-align:right"></div>
  <button id="new-game-btn" onclick="newGame()">New Game</button>
</div>

<div id="game-area"></div>

<div id="bottom-bar">
  <div id="summon-row">
    <button class="summon-btn" onclick="doSummon('basic')">
      <span>Basic Pull</span>
      <span class="cost">10 🪙</span>
    </button>
    <button class="summon-btn" onclick="doSummon('uncommon')">
      <span>Uncommon+</span>
      <span class="cost">50 🪙</span>
    </button>
    <button class="summon-btn" onclick="doSummon('rare')">
      <span>Rare+</span>
      <span class="cost">150 🪙</span>
    </button>
    <button class="summon-btn" onclick="doSummon('epic')">
      <span>Epic+</span>
      <span class="cost">500 🪙</span>
    </button>
    <button class="summon-btn" onclick="doSummon('legendary')">
      <span>Legendary+</span>
      <span class="cost">2000 🪙</span>
    </button>
  </div>
  <div style="display:flex;gap:.4rem;padding:.4rem .7rem;border-top:1px solid var(--border);">
    <button id="collection-toggle" onclick="openCollection()" style="flex:1;border:none;background:none;color:var(--muted);font-size:.82rem;cursor:pointer;padding:.2rem;text-align:left;">📖 Collection ▲</button>
    <button id="battle-toggle" onclick="openBattle()" style="flex:1;border:1px solid rgba(248,113,113,.4);border-radius:8px;background:rgba(248,113,113,.1);color:#f87171;font-size:.82rem;font-weight:700;cursor:pointer;padding:.3rem .6rem;">⚔️ Battle</button>
  </div>
</div>

<div id="battle-overlay">
  <div id="battle-header">
    <h2>⚔️ Battle</h2>
    <button id="close-battle" onclick="closeBattle()">✕</button>
  </div>
  <div id="battle-pick-screen">
    <div id="battle-pick-hint">Choose your fighter!</div>
    <div id="battle-fighter-grid"></div>
  </div>
  <div id="battle-fight-screen" style="display:none">
    <div class="battle-card" id="npc-card">
      <div class="bc-emoji" id="npc-emoji"></div>
      <div class="bc-name" id="npc-name"></div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="npc-hp-bar" style="width:100%"></div></div>
      <div class="bc-hp-text" id="npc-hp-text"></div>
    </div>
    <div class="vs-label">— VS —</div>
    <div class="battle-card" id="player-card">
      <div class="bc-emoji" id="player-emoji"></div>
      <div class="bc-name" id="player-name"></div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="player-hp-bar" style="width:100%"></div></div>
      <div class="bc-hp-text" id="player-hp-text"></div>
    </div>
    <div id="battle-log"></div>
    <div id="battle-actions">
      <button class="battle-act-btn" onclick="doAction('attack')">⚔️ Attack</button>
      <button class="battle-act-btn" onclick="doAction('power')">💥 Power</button>
      <button class="battle-act-btn" onclick="doAction('guard')">🛡️ Guard</button>
    </div>
  </div>
  <div id="battle-result-screen" style="display:none">
    <div id="result-icon"></div>
    <div id="result-title"></div>
    <div id="result-desc"></div>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center">
      <button class="result-btn primary" onclick="fightAgain()">⚔️ Fight Again</button>
      <button class="result-btn" onclick="closeBattle()">Close</button>
    </div>
  </div>
</div>

<div id="collection-overlay">
  <div id="coll-header">
    <h2>📖 Collection</h2>
    <button id="close-coll" onclick="closeCollection()">✕</button>
  </div>
  <div id="rarity-filter">
    <button class="filter-btn active" data-r="all" onclick="setFilter('all')">All</button>
    <button class="filter-btn" data-r="common"    onclick="setFilter('common')"    style="color:var(--c-common)">Common</button>
    <button class="filter-btn" data-r="uncommon"  onclick="setFilter('uncommon')"  style="color:var(--c-uncommon)">Uncommon</button>
    <button class="filter-btn" data-r="rare"      onclick="setFilter('rare')"      style="color:var(--c-rare)">Rare</button>
    <button class="filter-btn" data-r="epic"      onclick="setFilter('epic')"      style="color:var(--c-epic)">Epic</button>
    <button class="filter-btn" data-r="legendary" onclick="setFilter('legendary')" style="color:var(--c-legendary)">Legendary</button>
    <button class="filter-btn" data-r="mythic"    onclick="setFilter('mythic')"    style="color:var(--c-mythic)">Mythic</button>
  </div>
  <div id="coll-grid"></div>
</div>

<script>
const RARITIES = {
  common:    { name:'Common',    color:'var(--c-common)',    weight:70,   coins:1,   lifetime:10000, hp:40,  atk:8   },

// ── RARITY ROLL ────────────────────────────────────────────
function rollRarity(rarityList, weights) {
  const total = weights.reduce((a,b) => a+b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) return rarityList[i];
  }
  return rarityList[0];
}

function rollEmoji(rarityKey) {
  const pool = EMOJIS.filter(e => e.r === rarityKey);
  return pool[Math.floor(Math.random() * pool.length)];
}

// ── SPAWN ──────────────────────────────────────────────────
function spawnEmoji() {
  if (activeEmojis.length >= MAX_ACTIVE) return;
  const rarityList = Object.keys(RARITIES);
  const weights = rarityList.map(r => RARITIES[r].weight);
  const rKey = rollRarity(rarityList, weights);
  const emoji = rollEmoji(rKey);
  spawnToScreen(emoji, rKey);
}

function spawnToScreen(emoji, rKey) {
  const area = gameArea.getBoundingClientRect();
  const size = rKey === 'mythic' ? 64 : 56;
  const x = Math.random() * (area.width  - size - 20) + 10;
  const y = Math.random() * (area.height - size - 20) + 10;
  const delay = Math.random() * 2;

  const el = document.createElement('div');
  el.className = `emoji-bubble ${rKey}`;
  el.textContent = emoji.e;
  el.title = `${emoji.n} · ${RARITIES[rKey].name}`;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  el.style.animationDelay = delay + 's';

  const timeout = setTimeout(() => {
    el.classList.add('vanish');
    setTimeout(() => { el.remove(); activeEmojis = activeEmojis.filter(a => a.el !== el); }, 600);
  }, RARITIES[rKey].lifetime);

  el.addEventListener('click', ev => { ev.stopPropagation(); collect(emoji, rKey, el, timeout); });
  gameArea.appendChild(el);
  activeEmojis.push({ emoji, rKey, el, timeout });
}

// ── COLLECT ────────────────────────────────────────────────
function collect(emoji, rKey, el, timeout) {
  clearTimeout(timeout);
  activeEmojis = activeEmojis.filter(a => a.el !== el);
  if (el.classList) {
    el.classList.add('fade-out');
    setTimeout(() => el.remove(), 300);
  }

  const isNew = !collection[emoji.n];
  collection[emoji.n] = (collection[emoji.n] || 0) + 1;
  if (isNew) newlyFound.add(emoji.n);

  // Streak
  streak++;
  clearTimeout(streakTimer);
  streakTimer = setTimeout(() => { streak = 0; updateHUD(); }, 3000);
  const mult = Math.min(streak, 10);
  const earned = Math.ceil(RARITIES[rKey].coins * (1 + (mult - 1) * 0.2));
  coins += earned;

  // Coin popup
  const rect = el.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'coin-pop';
  pop.style.cssText = `left:${rect.left + rect.width/2}px;top:${rect.top}px;color:${RARITIES[rKey].color};transform-origin:center;`;
  let label = '+' + earned + '🪙';
  if (isNew) label += ' ✨NEW!';
  else if (streak >= 5) label += ' 🔥×' + mult;
  pop.textContent = label;
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 950);

  updateHUD();
  saveGame();
  if (collOpen) renderCollection();
}

// ── SUMMON ─────────────────────────────────────────────────
function doSummon(type) {
  const cost = SUMMON_COSTS[type];
  if (coins < cost) { flashBtn(type); return; }
  coins -= cost;
  const rarityList = SUMMON_POOLS[type];
  const weights = SUMMON_WEIGHTS[type];
  const rKey = rollRarity(rarityList, weights);
  const emoji = rollEmoji(rKey);
  collect(emoji, rKey, { getBoundingClientRect: () => ({ left: window.innerWidth/2-28, top: window.innerHeight/2-28, width:56, height:56 }) }, null);
  showSummonResult(emoji, rKey);
}

function showSummonResult(emoji, rKey) {
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:200;font-size:4rem;text-align:center;pointer-events:none;animation:floatUp 1.2s ease-out forwards;`;
  el.innerHTML = `<div>${emoji.e}</div><div style="font-size:1rem;font-weight:900;color:${RARITIES[rKey].color};margin-top:.3rem">${RARITIES[rKey].name}</div>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1300);
}

function flashBtn(type) {
  const btns = document.querySelectorAll('.summon-btn');
  const costs = Object.values(SUMMON_COSTS);
  const idx = Object.keys(SUMMON_COSTS).indexOf(type);
  if (btns[idx]) { btns[idx].style.background = '#4c1d2e'; setTimeout(() => btns[idx].style.background = '', 300); }
}

  const sd = document.getElementById('streakDisplay');
  if (sd) sd.textContent = streak >= 2 ? '🔥 ×' + Math.min(streak, 10) + ' combo!' : '';
  document.querySelectorAll('.summon-btn').forEach((btn, i) => {
    const cost = Object.values(SUMMON_COSTS)[i];
    btn.classList.toggle('disabled', coins < cost);
  });

function renderCollection() {
  const grid = document.getElementById('coll-grid');

  grid.innerHTML = '';
  for (const e of list) {

    const found = count > 0;
    const isNew = newlyFound.has(e.n);
    const cell = document.createElement('div');
    cell.className = 'coll-cell ' + e.r + (found ? '' : ' undiscovered');
    cell.title = found ? `${e.n} · ${RARITIES[e.r].name} · ×${count}` : '???';
    cell.innerHTML = `
      <div class="rarity-dot"></div>
      ${isNew && found ? '<div class="new-badge">new</div>' : ''}
      <span>${found ? e.e : '❓'}</span>
      ${found ? `<span class="coll-count">×${count}</span>` : ''}
    `;
    if (found && isNew) cell.addEventListener('click', () => { newlyFound.delete(e.n); renderCollection(); }, { once: true });
    grid.appendChild(cell);
  }
}

function scheduleSpawn() {

function startGame() {
  initialBurstTimers = [];
  for (let i = 0; i < 5; i++) {
    initialBurstTimers.push(setTimeout(spawnEmoji, i * 400));
  }
  scheduleSpawn();
}

function newGame() {
  clearTimeout(spawnTimer);
  clearTimeout(streakTimer);
  initialBurstTimers.forEach(clearTimeout);
  activeEmojis.forEach(a => {
    clearTimeout(a.timeout);
    a.el.remove();

    newlyFound = new Set(raw.newlyFound || []);

// ── PER-EMOJI UNIQUE STATS ─────────────────────────────────
// Deterministic hash so the same emoji always gets the same stats
function strHash(s) {
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (Math.imul(31, h) + s.charCodeAt(i)) | 0;
  return (h >>> 0) / 4294967295;
}

const STAT_RANGES = {
  common:    { hpMin:25,  hpMax:65,  atkMin:5,   atkMax:14  },
  uncommon:  { hpMin:55,  hpMax:105, atkMin:12,  atkMax:26  },
  rare:      { hpMin:100, hpMax:175, atkMin:24,  atkMax:46  },
  epic:      { hpMin:160, hpMax:270, atkMin:48,  atkMax:84  },
  legendary: { hpMin:250, hpMax:410, atkMin:85,  atkMax:148 },
  mythic:    { hpMin:450, hpMax:730, atkMin:170, atkMax:285 },
};

function emojiStats(emoji) {
  const rng = STAT_RANGES[emoji.r] || STAT_RANGES.common;
  const name = emoji.n || emoji.name || '';
  const h1 = strHash(name);
  const h2 = strHash(emoji.e + name);
  const power = 0.55 + h1 * 0.45;         // 55-100% of the range
  const shift  = (h2 - 0.5) * 0.45;       // ±22.5% HP/ATK trade-off
  const clamp = (v) => Math.max(0, Math.min(1, v));
  return {
    hp:  Math.round(rng.hpMin  + (rng.hpMax  - rng.hpMin)  * clamp(power + shift)),
    atk: Math.round(rng.atkMin + (rng.atkMax - rng.atkMin) * clamp(power - shift)),
  };
}

    playerEmoji: emojiDef,
    playerHP: emojiDef.hp, playerMaxHP: emojiDef.hp, playerAtk: emojiDef.atk,
    npc, npcHP: npc.hp, npcMaxHP: npc.hp, npcAtk: npc.atk,
    guarding: false, acting: false,
  };
  document.getElementById('battle-pick-screen').style.display = 'none';
  document.getElementById('battle-fight-screen').style.display = 'flex';
  document.getElementById('battle-result-screen').style.display = 'none';
  document.getElementById('battle-log').innerHTML = '';
  setBattleDisabled(false);
  renderBattle();
  logBattle(`⚔️ ${emojiDef.n} vs ${npc.name}! Fight!`);
}

function renderBattle() {
  const { playerEmoji, playerHP, playerMaxHP, npc, npcHP, npcMaxHP } = battleState;
  document.getElementById('player-emoji').textContent = playerEmoji.e;
  document.getElementById('player-name').textContent = playerEmoji.n;
  document.getElementById('player-hp-text').textContent = `${playerHP} / ${playerMaxHP}`;
  const pPct = Math.max(0, playerHP / playerMaxHP * 100);
  const pBar = document.getElementById('player-hp-bar');
  pBar.style.width = pPct + '%';
  pBar.className = 'hp-bar' + (pPct < 25 ? ' critical' : pPct < 50 ? ' low' : '');
  document.getElementById('player-card').style.borderColor = RARITIES[playerEmoji.r].color;

  document.getElementById('npc-emoji').textContent = npc.e;
  document.getElementById('npc-name').textContent = npc.name;
  document.getElementById('npc-hp-text').textContent = `${npcHP} / ${npcMaxHP}`;
  const nPct = Math.max(0, npcHP / npcMaxHP * 100);
  const nBar = document.getElementById('npc-hp-bar');
  nBar.style.width = nPct + '%';
  nBar.className = 'hp-bar' + (nPct < 25 ? ' critical' : nPct < 50 ? ' low' : '');
  document.getElementById('npc-card').style.borderColor = RARITIES[npc.r].color;
}

function logBattle(msg) {
  const log = document.getElementById('battle-log');
  const line = document.createElement('div');
  line.textContent = msg;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function setBattleDisabled(v) {
  document.querySelectorAll('.battle-act-btn').forEach(b => b.disabled = v);
}

function doAction(type) {
  if (!battleState || battleState.acting) return;
  battleState.acting = true;
  setBattleDisabled(true);
  const { playerEmoji, playerAtk, npc, npcAtk } = battleState;
  let playerDmg = 0;

  if (type === 'attack') {
    playerDmg = Math.round(playerAtk * (0.85 + Math.random() * 0.3));
    logBattle(`${playerEmoji.e} attacks for ${playerDmg}!`);
  } else if (type === 'power') {
    if (Math.random() < 0.28) {
      logBattle(`${playerEmoji.e} Power Strike... missed! 😬`);
    } else {
      playerDmg = Math.round(playerAtk * (1.6 + Math.random() * 0.6));
      logBattle(`${playerEmoji.e} Power Strike for ${playerDmg}! 💥`);
    }
  } else {
    playerDmg = Math.round(playerAtk * 0.35);
    battleState.guarding = true;
    logBattle(`${playerEmoji.e} guards, deals ${playerDmg}. 🛡️`);
  }

  battleState.npcHP = Math.max(0, battleState.npcHP - playerDmg);
  renderBattle();

  if (battleState.npcHP <= 0) {
    setTimeout(() => endBattle(true), 500);
    return;
  }

  setTimeout(() => {
    const g = battleState.guarding;
    battleState.guarding = false;
    const fullBlock = g && Math.random() < 0.8;
    const nd = fullBlock ? 0 : Math.round(npcAtk * (0.85 + Math.random() * 0.3));
    if (fullBlock) {
      logBattle(`${npc.e} attacks — fully blocked! 🛡️`);
    } else {
      logBattle(`${npc.e} hits back for ${nd}${g ? ' (guard broke! 💥)' : ''}!`);
    }
    battleState.playerHP = Math.max(0, battleState.playerHP - nd);
    renderBattle();
    if (battleState.playerHP <= 0) {
      setTimeout(() => endBattle(false), 500);
    } else {
      battleState.acting = false;
      setBattleDisabled(false);
    }
  }, 650);
}

function endBattle(won) {
  document.getElementById('battle-pick-screen').style.display = 'none';
  document.getElementById('battle-fight-screen').style.display = 'none';
  document.getElementById('battle-result-screen').style.display = 'flex';
  const { npc } = battleState;
  const nr = RARITIES[npc.r];
  if (won) {
    const reward = nr.coins * 3;
    coins += reward;
    const found = EMOJIS.find(em => em.e === npc.e);
    let extra = '';
    if (found) {
      const wasNew = !collection[found.n];
      collection[found.n] = (collection[found.n] || 0) + 1;
      if (wasNew) newlyFound.add(found.n);
      extra = `\nCaptured ${npc.e} ${found.n}!`;
    }
    document.getElementById('result-icon').textContent = '🏆';
    document.getElementById('result-title').textContent = 'Victory!';
    document.getElementById('result-desc').textContent = `+${reward} 🪙 coins earned!${extra}`;
    updateHUD();
    saveGame();
  } else {
    const { playerEmoji } = battleState;
    document.getElementById('result-icon').textContent = '💀';
    document.getElementById('result-title').textContent = 'Defeated!';
    document.getElementById('result-desc').textContent = 'Better luck next time!\nTrain harder and try again.';
    saveGame();
  }
}

function fightAgain() {
  battleState = null;
  showPickScreen();
}
</script>
</body>
</html>
