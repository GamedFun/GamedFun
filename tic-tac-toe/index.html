<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem('gf-theme')||'dark';</script>
<title>Tic Tac Toe – gamed.fun</title>
<link rel="icon" type="image/svg+xml" href="../logo.svg">
<style>
  :root {
    --bg: #1a1625;
    --panel: #231f30;
    --text: #fff7ed;
    --muted: #b8a99a;
    --gold: #fbbf24;
    --border: rgba(255,255,255,.13);
    --x-color: #818cf8;
    --o-color: #f87171;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 25% 25%, rgba(129,140,248,.1), transparent 28rem),
      radial-gradient(circle at 75% 75%, rgba(248,113,113,.08), transparent 28rem),
      linear-gradient(180deg, #181219 0%, var(--bg) 100%);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: .6rem 1.2rem;
    border-bottom: 1px solid var(--border);
    background: rgba(18,16,20,.9);
    backdrop-filter: blur(8px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { align-items: center; color: var(--gold); display: inline-flex; gap: .42rem; text-decoration: none; font-weight: 900; }
  .brand-mark { width: 1.25rem; height: 1.25rem; flex: 0 0 auto; border-radius: 4px; }
  .home-link { text-decoration: none; color: var(--muted); font-size: .85rem; }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.4rem;
  }
  h1 { font-size: 1.8rem; font-weight: 900; }

  /* Difficulty picker */
  .diff-group {
    display: flex;
    gap: .5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
  }
  .diff-btn {
    padding: .4rem 1rem;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .diff-btn.active {
    background: var(--panel);
    color: var(--text);
    box-shadow: 0 0 0 1px var(--border);
  }
  .diff-btn[data-diff="easy"].active   { color: #34d399; box-shadow: 0 0 0 1px #34d39944; }
  .diff-btn[data-diff="medium"].active { color: var(--gold); box-shadow: 0 0 0 1px #fbbf2444; }
  .diff-btn[data-diff="hard"].active   { color: #f87171; box-shadow: 0 0 0 1px #f8717144; }

  /* Score bar */
  .scores {
    display: flex;
    gap: 1.5rem;
    font-size: .88rem;
    color: var(--muted);
  }
  .score-item { text-align: center; }
  .score-item strong { display: block; font-size: 1.4rem; font-weight: 900; color: var(--text); }
  .score-item.you strong  { color: var(--x-color); }
  .score-item.bot strong  { color: var(--o-color); }

  /* Status */
  #status {
    font-size: 1rem;
    font-weight: 700;
    min-height: 1.4rem;
    color: var(--muted);
    text-align: center;
  }
  #status.your-turn { color: var(--x-color); }
  #status.bot-turn  { color: var(--o-color); }
  #status.win       { color: #34d399; font-size: 1.15rem; }
  #status.lose      { color: var(--o-color); font-size: 1.15rem; }
  #status.draw      { color: var(--gold); font-size: 1.15rem; }

  /* Board */
  #board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .cell {
    width: 100px;
    height: 100px;
    border-radius: 10px;
    background: #2a2438;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 900;
    cursor: pointer;
    transition: background .12s, transform .08s;
    user-select: none;
    color: transparent;
  }
  .cell:hover:not(.taken):not(.locked) {
    background: #332d45;
    transform: scale(1.04);
  }
  .cell.x { color: var(--x-color); cursor: default; }
  .cell.o { color: var(--o-color); cursor: default; }
  .cell.win-cell {
    background: #1e1a30;
    box-shadow: 0 0 0 2px currentColor, 0 0 14px 2px rgba(52,211,153,.2);
  }
  .cell.x.win-cell { box-shadow: 0 0 0 2px var(--x-color), 0 0 14px 4px rgba(129,140,248,.3); }
  .cell.o.win-cell { box-shadow: 0 0 0 2px var(--o-color), 0 0 14px 4px rgba(248,113,113,.3); }
  .cell.taken { cursor: default; }
  .cell.locked { cursor: default; }

  .cell:not(.taken):not(.locked):hover::after {
  content: attr(data-ghost);
  color: var(--x-color);
  opacity: 0.22;
  font-size: 2.8rem;
  font-weight: 900;
}

  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  body { animation: pageIn .22s ease; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  @media (max-width: 380px) {
    .cell { width: 86px; height: 86px; font-size: 2.3rem; }
  }
  @media (max-width: 420px) {
    .scores { gap: .8rem; font-size: .8rem; }
    .score-item strong { font-size: 1.15rem; }
    .diff-btn { padding: .35rem .7rem; font-size: .8rem; }
    header { padding: .5rem .75rem; }
  }
  /* Cell pop-in */
  @keyframes cellPop {
    0%   { transform: scale(0) rotate(-18deg); opacity: 0; }
    65%  { transform: scale(1.18) rotate(4deg); opacity: 1; }
    100% { transform: scale(1)   rotate(0deg); }
  }
  .cell.pop { animation: cellPop 0.22s cubic-bezier(.34,1.56,.64,1) forwards; }

  @keyframes cellEnter { from { opacity: 0; transform: scale(.75); } to { opacity: 1; transform: scale(1); } }

  /* Win-cell pulse */
  @keyframes winPulse {
    0%,100% { box-shadow: 0 0 0 2px currentColor, 0 0 14px 4px rgba(52,211,153,.25); }
    50%     { box-shadow: 0 0 0 3px currentColor, 0 0 26px 8px rgba(52,211,153,.45); }
  }
  .cell.x.win-cell { animation: winPulse 1s ease-in-out infinite; box-shadow: 0 0 0 2px var(--x-color), 0 0 14px 4px rgba(129,140,248,.35); }
  .cell.o.win-cell { animation: winPulse 1s ease-in-out infinite; box-shadow: 0 0 0 2px var(--o-color), 0 0 14px 4px rgba(248,113,113,.35); }

  /* Game-over overlay */
  #game-overlay {
    display: none;
    position: absolute;
    inset: 0;
    border-radius: 14px;
    background: rgba(10,8,14,.72);
    backdrop-filter: blur(4px);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: .6rem;
    z-index: 10;
    animation: overlayIn .28s ease;
  }
  #game-overlay.on { display: flex; }
  @keyframes overlayIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
  #overlay-title { font-size: 2rem; font-weight: 900; }
  #overlay-btn {
    padding: .5rem 1.4rem;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px;
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: .9rem;
    font-weight: 900;
    cursor: pointer;
    margin-top: .3rem;
    transition: background .15s;
  }
  #overlay-btn:hover { background: rgba(255,255,255,.2); }
  #board-wrap { position: relative; }

  @keyframes confettiFall {
    to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
  }

  [data-theme="light"] { --bg: #f0f0f5; --panel: #ffffff; --text: #111827; --muted: #6b7280; --border: rgba(0,0,0,.12); }
  [data-theme="light"] body { background: radial-gradient(circle at 25% 25%,rgba(129,140,248,.07),transparent 28rem),radial-gradient(circle at 75% 75%,rgba(248,113,113,.05),transparent 28rem),#f0f0f5; }
  [data-theme="light"] header { background: rgba(245,245,250,.95); }
  [data-theme="light"] .cell { background: #e4e4ef; }
  [data-theme="light"] .cell:hover:not(.taken):not(.locked) { background: #d5d5e8; }
  [data-theme="light"] #game-overlay { background: rgba(220,215,240,.78); }

  button.restart {
    padding: .55rem 1.4rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font-size: .9rem;
    cursor: pointer;
    transition: background .12s;
  }
  button.restart:hover { background: #2e2840; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="gamed.fun">
    <img class="brand-mark" src="/logo.svg" alt="" width="20" height="20">
    <span>gamed.fun</span>
  </a>
  <button id="themeBtn" onclick="toggleTheme()" style="background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:1rem;padding:.3rem .55rem;color:var(--muted);line-height:1">☀️</button>
  <a class="home-link" href="/">← Home</a>
</header>
<main>
  <h1>Tic Tac Toe</h1>

  <div style="display:flex;flex-direction:column;align-items:center;gap:.5rem;">
    <div class="diff-group">
      <button class="diff-btn active" data-diff="easy">Easy</button>
      <button class="diff-btn" data-diff="medium">Medium</button>
      <button class="diff-btn" data-diff="hard">Hard</button>
    </div>
    <div class="diff-group">
      <button class="diff-btn active" data-order="first">Go First</button>
      <button class="diff-btn" data-order="second">Go Second</button>
    </div>
  </div>

  <div class="scores">
    <div class="score-item you">
      <strong id="scoreYou">0</strong>
      <span id="youLabel">You (X)</span>
    </div>
    <div class="score-item">
      <strong id="scoreDraw">0</strong>
      Draws
    </div>
    <div class="score-item bot">
      <strong id="scoreBot">0</strong>
      <span id="botLabel">Bot (O)</span>
    </div>
  </div>

  <div id="status" class="your-turn">Your turn</div>

  <div id="board-wrap">
    <div id="board">
      <div class="cell" data-i="0"></div>
      <div class="cell" data-i="1"></div>
      <div class="cell" data-i="2"></div>
      <div class="cell" data-i="3"></div>
      <div class="cell" data-i="4"></div>
      <div class="cell" data-i="5"></div>
      <div class="cell" data-i="6"></div>
      <div class="cell" data-i="7"></div>
      <div class="cell" data-i="8"></div>
    </div>
    <div id="game-overlay">
      <div id="overlay-title"></div>
      <button id="overlay-btn">Play Again</button>
    </div>
  </div>

  <button class="restart" id="restartBtn">↺ New Game</button>
</main>
<script>
const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let board = Array(9).fill(null);
let locked = false;
let difficulty = 'easy';
let goFirst = true;
let playerMark = 'X';
let botMark = 'O';
let scores = { you: 0, draw: 0, bot: 0 };
let lastMove = -1;

function checkWinner(b) {
  for (const [a, b2, c] of WINS)
    if (b[a] && b[a] === b[b2] && b[a] === b[c]) return { winner: b[a], line: [a, b2, c] };
  return null;
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  if (text.includes('Your turn')) document.title = 'Your turn — Tic Tac Toe';
  else if (text.includes('thinking')) document.title = 'Bot thinking… — Tic Tac Toe';
  else if (text.includes('You win')) document.title = 'You win! — Tic Tac Toe';
  else if (text.includes('Bot wins')) document.title = 'Bot wins — Tic Tac Toe';
  else if (text.includes('draw')) document.title = "It's a draw — Tic Tac Toe";
  el.className = cls || '';
}

function render(winLine = []) {
  document.querySelectorAll('.cell').forEach(cell => {
    const i = +cell.dataset.i;
    const val = board[i];
    cell.className = 'cell';
    if (val) {
      cell.classList.add(val.toLowerCase(), 'taken');
      cell.textContent = val;
      if (i === lastMove) cell.classList.add('pop');
    } else { cell.textContent = ''; }
    if (locked) cell.classList.add('locked');
    if (winLine.includes(i)) cell.classList.add('win-cell');
  });
  if (!locked) {
    document.querySelectorAll('.cell:not(.taken)').forEach(cell => {
      cell.dataset.ghost = playerMark;
    });
  }
}

const overlay = document.getElementById('game-overlay');
const overlayTitle = document.getElementById('overlay-title');
document.getElementById('overlay-btn').addEventListener('click', () => {
  overlay.classList.remove('on');
  newGame();
});

function showOverlay(text, color) {
  overlayTitle.textContent = text;
  overlayTitle.style.color = color;
  overlay.classList.add('on');
}

function launchConfetti() {
  const colors = ['#818cf8','#f87171','#fbbf24','#34d399','#ffffff'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    const size = 6 + Math.random() * 8;
    el.style.cssText = [
      'position:fixed', `top:-${size}px`, `left:${Math.random()*100}%`,
      `width:${size}px`, `height:${size}px`,
      `background:${colors[Math.floor(Math.random()*colors.length)]}`,
      `border-radius:${Math.random()>.5?'50%':'2px'}`,
      'pointer-events:none', 'z-index:9999',
      `animation:confettiFall ${1.4+Math.random()*2}s ease-in forwards`,
      `animation-delay:${Math.random()*.7}s`
    ].join(';');
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

function updateScores() {
  document.getElementById('scoreYou').textContent = scores.you;
  document.getElementById('scoreDraw').textContent = scores.draw;
  document.getElementById('scoreBot').textContent = scores.bot;
}

// Bot logic
function getEmpty(b) { return b.map((v, i) => v === null ? i : -1).filter(i => i !== -1); }

function minimax(b, isMax, depth) {
  const result = checkWinner(b);
  if (result) return result.winner === botMark ? 10 - depth : depth - 10;
  const empty = getEmpty(b);
  if (!empty.length) return 0;
  let best = isMax ? -Infinity : Infinity;
  for (const i of empty) {
    b[i] = isMax ? botMark : playerMark;
    const score = minimax(b, !isMax, depth + 1);
    b[i] = null;
    best = isMax ? Math.max(best, score) : Math.min(best, score);
  }
  return best;
}

function getBotMove() {
  const empty = getEmpty(board);
  if (!empty.length) return -1;

  if (difficulty === 'easy') {
    return empty[Math.floor(Math.random() * empty.length)];
  }

  if (difficulty === 'medium') {
    for (const i of empty) {
      board[i] = botMark;
      if (checkWinner(board)) { board[i] = null; return i; }
      board[i] = null;
    }
    for (const i of empty) {
      board[i] = playerMark;
      if (checkWinner(board)) { board[i] = null; return i; }
      board[i] = null;
    }
    return empty[Math.floor(Math.random() * empty.length)];
  }

  let bestScore = -Infinity, bestMove = empty[0];
  for (const i of empty) {
    board[i] = botMark;
    const score = minimax(board, false, 0);
    board[i] = null;
    if (score > bestScore) { bestScore = score; bestMove = i; }
  }
  return bestMove;
}

function botPlay() {
  const move = getBotMove();
  if (move === -1) return;
  board[move] = botMark;
  lastMove = move;
  const result = checkWinner(board);
  if (result) {
    render(result.line);
    scores.bot++;
    updateScores();
    setStatus('Bot wins!', 'lose');
    locked = true;
    setTimeout(() => showOverlay('Bot wins 😅', '#f87171'), 350);
  } else if (getEmpty(board).length === 0) {
    render();
    scores.draw++;
    updateScores();
    setStatus("It's a draw!", 'draw');
    locked = true;
    setTimeout(() => showOverlay("It's a draw!", '#fbbf24'), 350);
  } else {
    render();
    setStatus('Your turn', 'your-turn');
    locked = false;
  }
}

function handleClick(i) {
  if (locked || board[i]) return;
  board[i] = playerMark;
  lastMove = i;
  const result = checkWinner(board);
  if (result) {
    render(result.line);
    scores.you++;
    updateScores();
    setStatus('You win!', 'win');
    locked = true;
    launchConfetti();
    setTimeout(() => showOverlay('You win! 🎉', '#34d399'), 350);
    return;
  }
  if (getEmpty(board).length === 0) {
    render();
    scores.draw++;
    updateScores();
    setStatus("It's a draw!", 'draw');
    locked = true;
    setTimeout(() => showOverlay("It's a draw!", '#fbbf24'), 350);
    return;
  }
  locked = true;
  render();
  setStatus('Bot is thinking…', 'bot-turn');
  setTimeout(botPlay, 420);
}

function newGame() {
  playerMark = goFirst ? 'X' : 'O';
  botMark    = goFirst ? 'O' : 'X';
  document.getElementById('youLabel').textContent = `You (${playerMark})`;
  document.getElementById('botLabel').textContent = `Bot (${botMark})`;
  board = Array(9).fill(null);
  lastMove = -1;
  locked = false;
  overlay.classList.remove('on');
  render();
  document.querySelectorAll('.cell').forEach((cell, i) => {
    cell.style.animation = 'none';
    void cell.offsetWidth;
    cell.style.animation = `cellEnter .18s ease ${i * 28}ms backwards`;
  });
  if (goFirst) {
    setStatus('Your turn', 'your-turn');
  } else {
    locked = true;
    setStatus('Bot is thinking…', 'bot-turn');
    setTimeout(botPlay, 420);
  }
}

document.querySelectorAll('[data-diff]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-diff]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    difficulty = btn.dataset.diff;
    scores = { you: 0, draw: 0, bot: 0 };
    updateScores();
    newGame();
  });
});

document.querySelectorAll('[data-order]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-order]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    goFirst = btn.dataset.order === 'first';
    scores = { you: 0, draw: 0, bot: 0 };
    updateScores();
    newGame();
  });
});

document.getElementById('board').addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (cell) handleClick(+cell.dataset.i);
});

document.getElementById('restartBtn').addEventListener('click', newGame);

newGame();
document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
function toggleTheme(){const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('gf-theme',n);document.getElementById('themeBtn').textContent=n==='dark'?'☀️':'🌙';}
</script>
</body>
</html>
