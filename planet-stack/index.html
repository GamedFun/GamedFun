  <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Sushi Stack","description":"Drop and stack sushi pieces as high as you can without toppling. Free browser physics stacking game.","url":"https://gamed.fun/planet-stack/","applicationCategory":"GameApplication","operatingSystem":"Any","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --bg: #0b0b18; --text: #e8e8f8; --muted: rgba(255,255,255,.4); --border: rgba(255,255,255,.12); }
    [data-theme="light"] { --bg: #eeeef8; --text: #1a1a2e; --muted: rgba(0,0,0,.4); --border: rgba(0,0,0,.13); }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden; user-select: none; -webkit-user-select: none;
    }

    #c { position: fixed; inset: 0; display: block; cursor: crosshair; }

    header {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      display: flex; align-items: center; padding: 0 14px; z-index: 20; pointer-events: none;
    }
    .brand {
      pointer-events: all; display: flex; align-items: center; gap: 7px;
      text-decoration: none; font-size: .82rem; font-weight: 800;
      color: var(--muted); letter-spacing: .03em;
    }
    .brand img { width: 22px; height: 22px; border-radius: 5px; }
    .brand:hover { color: var(--text); }
    .hdr-r { margin-left: auto; pointer-events: all; display: flex; align-items: center; gap: 8px; }
    #themeBtn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; font-size: .9rem; padding: .3rem .55rem; color: var(--muted);
    }

    #hud {
      position: fixed; top: 56px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 28px;
      z-index: 20; pointer-events: none;
    }
    #score-el { font-size: 1.55rem; font-weight: 900; letter-spacing: .04em; text-shadow: 0 0 22px rgba(140,90,255,.65); }
    #next-box { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); font-weight: 600; }
    #next-dot { width: 16px; height: 16px; border-radius: 50%; background: #aaa; flex-shrink: 0; }

    #gameover {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 14px; animation: goIn .4s ease;
    }
    #gameover.on { display: flex; }
    @keyframes goIn { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:scale(1)} }
    #go-title { font-size: 2rem; font-weight: 900; }
    #go-score { color: var(--muted); font-size: .95rem; }
    #go-score strong { color: var(--text); font-size: 1.8rem; display: block; margin-top: 4px; }
    #restart-btn {
      margin-top: 10px; background: rgba(110,70,220,.22);
      border: 2px solid rgba(120,80,230,.55); color: #c0a0ff;
      padding: 13px 38px; border-radius: 30px; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: background .15s; letter-spacing: .03em;
    }
    #restart-btn:hover { background: rgba(110,70,220,.42); }

    @keyframes pageIn { from{opacity:0} to{opacity:1} }
    body { animation: pageIn .25s ease; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<header>
  <a class="brand" href="/" aria-label="Gamed.fun">
    <img src="/logo.svg" alt=""><span>Gamed.fun</span>
  </a>
  <div class="hdr-r">
    <button id="themeBtn" onclick="toggleTheme()">☀️</button>
  </div>
</header>

<div id="hud">
  <div id="next-box">
    <div id="next-dot"></div>
    <span>Next: <span id="next-name">Moon</span></span>
  </div>
  <div id="score-el">0</div>
  <div id="best-box" style="font-size:.72rem;color:var(--muted);font-weight:700;letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;line-height:1.3">
    <span style="font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7">Best</span>
    <span id="best-el">0</span>
  </div>
</div>

<div id="gameover">
  <div style="font-size:3.5rem">🍱</div>
  <div id="go-title">Too Full!</div>
  <div id="go-score">Score<strong id="go-val">0</strong></div>
  <div id="go-best" style="color:var(--muted);font-size:.85rem;font-weight:700"></div>
  <button id="restart-btn">↺ Play Again</button>
</div>

<script>
'use strict';

// ── THEME ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = n;
  localStorage.setItem('gf-theme', n);
  document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').textContent =
  document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';

// ── FOOD DATA ─────────────────────────────────────────────────────────────────
const FOODS = [
  { name:'Rice',     emoji:'🍚', hex:'#f0ede0', r:14,  pts:1  },
  { name:'Edamame',  emoji:'🫛', hex:'#3db832', r:19,  pts:2  },
  { name:'Cracker',  emoji:'🍘', hex:'#d4a96a', r:26,  pts:4  },
  { name:'Onigiri',  emoji:'🍙', hex:'#e8e4d8', r:34,  pts:7  },
  { name:'Gyoza',    emoji:'🥟', hex:'#e8b84b', r:44,  pts:11 },
  { name:'Tempura',  emoji:'🍤', hex:'#d4834b', r:55,  pts:16 },
  { name:'Shrimp',   emoji:'🦐', hex:'#ff7755', r:67,  pts:22 },
  { name:'Sushi',    emoji:'🍣', hex:'#f06040', r:81,  pts:29 },
  { name:'Squid',    emoji:'🦑', hex:'#aa88cc', r:97,  pts:37 },
  { name:'Ramen',    emoji:'🍜', hex:'#f5a623', r:115, pts:46 },
  { name:'Bento',    emoji:'🍱', hex:'#8b6430', r:134, pts:56 },
  { name:'Lobster',  emoji:'🦞', hex:'#cc3322', r:154, pts:67 },
];
const MAX_SPAWN = 5;

// ── CANVAS ────────────────────────────────────────────────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = window.innerWidth, H = window.innerHeight;
cvs.width = W; cvs.height = H;

// ── LAYOUT ────────────────────────────────────────────────────────────────────
const CX    = W / 2;
const CTRW  = Math.min(380, W - 40);
const WALL  = 16;
const LEFT  = CX - CTRW / 2;
const RIGHT = CX + CTRW / 2;
const FLOOR = H - 50;
const DANGER_Y = 130;
const DROP_Y   = 76;

// ── COLOR HELPERS ─────────────────────────────────────────────────────────────
function hexRGB(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function lighten(hex, t) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${Math.min(255,r+(255-r)*t)|0},${Math.min(255,g+(255-g)*t)|0},${Math.min(255,b+(255-b)*t)|0})`;
}
function darken(hex, t) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${r*(1-t)|0},${g*(1-t)|0},${b*(1-t)|0})`;
}

// ── MATTER.JS ─────────────────────────────────────────────────────────────────
const { Engine, Bodies, World, Events } = Matter;
const engine = Engine.create({ gravity: { x:0, y:2.8 } });
const world  = engine.world;

World.add(world, [
  Bodies.rectangle(LEFT - WALL/2,  H/2,           WALL,            H*3,  { isStatic:true }),
  Bodies.rectangle(RIGHT + WALL/2, H/2,           WALL,            H*3,  { isStatic:true }),
  Bodies.rectangle(CX,             FLOOR + WALL/2, CTRW + WALL*2,  WALL, { isStatic:true }),
]);

// ── FOOD POOL ─────────────────────────────────────────────────────────────────
const foods = [];
const bodyMap = new Map();

function createFood(mx, my, tier) {
  const fd   = FOODS[tier];
  const body = Bodies.circle(mx, my, fd.r, {
    restitution: 0.22, friction: 0.55, frictionAir: 0.01, density: 0.002, label:'food',
  });
  World.add(world, body);
  const p = { body, tier, merging:false, born:performance.now(), scale:1 };
  foods.push(p);
  bodyMap.set(body.id, p);
  return p;
}

function removeFood(p) {
  World.remove(world, p.body);
  bodyMap.delete(p.body.id);
  const i = foods.indexOf(p);
  if (i !== -1) foods.splice(i, 1);
}

function punchScale(p) {
  p.scale = 1.5;
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 280);
    p.scale = 1.5 - 0.5 * t;
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ── MERGE ─────────────────────────────────────────────────────────────────────
const pending = new Set();

Events.on(engine, 'collisionStart', ({ pairs }) => {
  for (const { bodyA, bodyB } of pairs) {
    const pa = bodyMap.get(bodyA.id);
    const pb = bodyMap.get(bodyB.id);
    if (!pa || !pb)                     continue;
    if (pa.tier !== pb.tier)            continue;
    if (pa.merging || pb.merging)       continue;
    if (pa.tier >= FOODS.length - 1) continue;

    pa.merging = pb.merging = true;
    const key = `${Math.min(bodyA.id,bodyB.id)},${Math.max(bodyA.id,bodyB.id)}`;
    if (pending.has(key)) continue;
    pending.add(key);

    const nt = pa.tier + 1;
    const mx = (bodyA.position.x + bodyB.position.x) / 2;
    const my = (bodyA.position.y + bodyB.position.y) / 2;

    setTimeout(() => {
      pending.delete(key);
      if (!foods.includes(pa) || !foods.includes(pb) || gameOver) return;
      removeFood(pa); removeFood(pb);
      const np = createFood(mx, my, nt);
      punchScale(np);
      score += FOODS[nt].pts;
      scoreEl.textContent = score.toLocaleString();
      playMerge(nt);
    }, 16);
  }
});

// ── GAME STATE ────────────────────────────────────────────────────────────────
let gameOver    = false;
let canDrop     = true;
let aimX        = CX;
let score       = 0;
let best        = Number(localStorage.getItem('sushi_stack_best') || 0);
let dangerTicks = 0;
let currentTier = rndTier();
let nextTier    = rndTier();

const scoreEl    = document.getElementById('score-el');
const bestEl     = document.getElementById('best-el');
const nextDotEl  = document.getElementById('next-dot');
const nextNameEl = document.getElementById('next-name');
const gameoverEl = document.getElementById('gameover');
bestEl.textContent = best.toLocaleString();

function rndTier() { return Math.floor(Math.random() * (MAX_SPAWN + 1)); }
function refreshNext() {
  nextDotEl.style.background = FOODS[nextTier].hex;
  nextNameEl.textContent     = FOODS[nextTier].name;
}
refreshNext();

// ── DROP ──────────────────────────────────────────────────────────────────────
function clampX() {
  const r = FOODS[currentTier].r;
  return Math.max(LEFT + r + 2, Math.min(RIGHT - r - 2, aimX));
}

function dropFood() {
  if (!canDrop || gameOver) return;
  canDrop = false;
  createFood(clampX(), DROP_Y, currentTier);
  playDrop(currentTier);
  currentTier = nextTier;
  nextTier    = rndTier();
  refreshNext();
  setTimeout(() => { canDrop = true; }, 480);
}

cvs.addEventListener('mousemove', e => { aimX = e.clientX; });
cvs.addEventListener('click', dropFood);
cvs.addEventListener('touchmove', e => { aimX = e.touches[0].clientX; }, { passive:true });
cvs.addEventListener('touchend', e => { aimX = e.changedTouches[0].clientX; dropFood(); }, { passive:true });

// ── GAME OVER ─────────────────────────────────────────────────────────────────
function checkOverflow() {
  if (gameOver) return;
  const now  = performance.now();
  const over = foods.some(p =>
    !p.merging &&
    now - p.born > 1800 &&
    p.body.position.y < DANGER_Y &&
    p.body.speed < 1.5
  );
  if (over) {
    dangerTicks++;
    if (dangerTicks > 90) doGameOver();
  } else {
    dangerTicks = Math.max(0, dangerTicks - 2);
  }
}

function doGameOver() {
  gameOver = true;
  const isNew = score > best;
  if (isNew) {
    best = score;
    localStorage.setItem('sushi_stack_best', String(best));
    bestEl.textContent = best.toLocaleString();
  }
  document.getElementById('go-val').textContent = score.toLocaleString();
  document.getElementById('go-title').textContent = isNew ? '🏆 New Best!' : 'Too Full!';
  document.getElementById('go-best').textContent = `Best: ${best.toLocaleString()}`;
  gameoverEl.classList.add('on');
  document.title = 'Game Over — Sushi Stack';
}

document.getElementById('restart-btn').addEventListener('click', () => {
  [...foods].forEach(removeFood);
  bodyMap.clear(); pending.clear();
  score = 0; scoreEl.textContent = '0';
  gameOver = false; dangerTicks = 0; canDrop = true;
  currentTier = rndTier(); nextTier = rndTier();
  refreshNext();
  document.getElementById('go-title').textContent = 'Too Full!';
  document.getElementById('go-best').textContent = '';
  gameoverEl.classList.remove('on');
  document.title = 'Sushi Stack';
});

// ── DRAW ──────────────────────────────────────────────────────────────────────
function drawFood(x, y, r, tier, alpha) {
  const fd = FOODS[tier];
  const a  = alpha ?? 1;
  ctx.save();
  ctx.globalAlpha = a;

  // Soft circle background
  const grad = ctx.createRadialGradient(
    x - r * 0.28, y - r * 0.32, r * 0.05,
    x,            y,             r
  );
  grad.addColorStop(0,    lighten(fd.hex, 0.55));
  grad.addColorStop(0.5,  fd.hex);
  grad.addColorStop(1,    darken(fd.hex, 0.38));

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Emoji on top
  ctx.save();
  ctx.globalAlpha = a * 0.95;
  ctx.font        = `${Math.round(r * 1.25)}px serif`;
  ctx.textAlign   = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fd.emoji, x, y + r * 0.06);
  ctx.restore();
}

function draw() {
  const dark = document.documentElement.dataset.theme === 'dark';
  ctx.clearRect(0, 0, W, H);

  // Walls
  const wallColor = dark ? '#1a1a36' : '#8888bb';
  const playH = FLOOR - DANGER_Y;
  ctx.fillStyle = wallColor;
  ctx.fillRect(LEFT - WALL, DANGER_Y, WALL, playH); // left wall
  ctx.fillRect(RIGHT,       DANGER_Y, WALL, playH); // right wall

  // Solid floor — thick slab with gradient and highlight
  const FLOOR_H = 28;
  const floorGrad = ctx.createLinearGradient(0, FLOOR, 0, FLOOR + FLOOR_H);
  if (dark) {
    floorGrad.addColorStop(0, '#2a2a50');
    floorGrad.addColorStop(1, '#12122a');
  } else {
    floorGrad.addColorStop(0, '#b0b0d8');
    floorGrad.addColorStop(1, '#8888bb');
  }
  ctx.fillStyle = floorGrad;
  ctx.fillRect(LEFT - WALL, FLOOR, CTRW + WALL * 2, FLOOR_H);
  // top highlight line
  ctx.fillStyle = dark ? 'rgba(140,120,255,0.55)' : 'rgba(255,255,255,0.55)';
  ctx.fillRect(LEFT - WALL, FLOOR, CTRW + WALL * 2, 3);

  // Danger line
  const dangerAlpha = dangerTicks > 0
    ? 0.4 + 0.5 * Math.abs(Math.sin(dangerTicks * 0.12))
    : 0.35;
  ctx.save();
  ctx.globalAlpha = dangerAlpha;
  ctx.strokeStyle = '#ff3333';
  ctx.lineWidth   = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(LEFT, DANGER_Y);
  ctx.lineTo(RIGHT, DANGER_Y);
  ctx.stroke();
  ctx.restore();

  // Planets
  for (const p of foods) {
    if (p.merging) continue;
    const { x, y } = p.body.position;
    const r = FOODS[p.tier].r * p.scale;
    drawFood(x, y, r, p.tier);
  }

  // Aim guide
  if (!gameOver) {
    const ax = clampX();
    const r  = FOODS[currentTier].r;

    // Vertical guide line
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(ax, DROP_Y + r);
    ctx.lineTo(ax, FLOOR);
    ctx.stroke();
    ctx.restore();

    // Ghost planet
    drawFood(ax, DROP_Y, r, currentTier, 0.28);
  }
}

// ── SOUND ─────────────────────────────────────────────────────────────────────
let audioCtx = null;
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playDrop(tier) {
  try {
    const c = getAC();
    // Soft "plop" — pitch-descending sine with lowpass
    const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 500 + tier * 60;
    o.type = 'sine';
    const base = 130 + tier * 14;
    o.frequency.setValueAtTime(base * 1.5, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(base, c.currentTime + 0.07);
    g.gain.setValueAtTime(0.13, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.14);
    o.connect(f); f.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + 0.16);
  } catch {}
}
function playMerge(tier) {
  try {
    const c = getAC();
    // Bell-like chime with natural harmonics
    const root = [261.63,293.66,329.63,349.23,392,440,493.88,523.25][tier % 8] * (tier > 7 ? 2 : 1);
    [1, 2, 3.02].forEach((h, i) => {
      const o = c.createOscillator(), g = c.createGain();
      const t = c.currentTime;
      o.type = 'sine'; o.frequency.value = root * h;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime([0.13, 0.06, 0.025][i], t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.001, t + [0.55, 0.38, 0.22][i]);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + 0.6);
    });
  } catch {}
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(now - lastTime, 48);
  lastTime  = now;
  Engine.update(engine, dt);
  checkOverflow();
  draw();
  document.title = gameOver
    ? 'Game Over — Sushi Stack'
    : `${score.toLocaleString()} — Sushi Stack`;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
