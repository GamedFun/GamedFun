<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.dataset.theme=localStorage.getItem('gf-theme')||'dark';</script>
  <title>Planet Stack</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --bg: #0b0b18; --text: #e8e8f8; --muted: rgba(255,255,255,.4); --border: rgba(255,255,255,.12); }
    [data-theme="light"] { --bg: #eeeef8; --text: #1a1a2e; --muted: rgba(0,0,0,.4); --border: rgba(0,0,0,.13); }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden; user-select: none; -webkit-user-select: none;
    }

    #c { position: fixed; inset: 0; display: block; cursor: crosshair; }

    header {
      position: fixed; top: 0; left: 0; right: 0; height: 52px;
      display: flex; align-items: center; padding: 0 14px; z-index: 20; pointer-events: none;
    }
    .brand {
      pointer-events: all; display: flex; align-items: center; gap: 7px;
      text-decoration: none; font-size: .82rem; font-weight: 800;
      color: var(--muted); letter-spacing: .03em;
    }
    .brand img { width: 22px; height: 22px; border-radius: 5px; }
    .brand:hover { color: var(--text); }
    .hdr-r { margin-left: auto; pointer-events: all; display: flex; align-items: center; gap: 8px; }
    #themeBtn {
      background: none; border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; font-size: .9rem; padding: .3rem .55rem; color: var(--muted);
    }

    #hud {
      position: fixed; top: 56px; left: 0; right: 0;
      display: flex; justify-content: center; align-items: center; gap: 28px;
      z-index: 20; pointer-events: none;
    }
    #score-el { font-size: 1.55rem; font-weight: 900; letter-spacing: .04em; text-shadow: 0 0 22px rgba(140,90,255,.65); }
    #next-box { display: flex; align-items: center; gap: 8px; font-size: .74rem; color: var(--muted); font-weight: 600; }
    #next-dot { width: 16px; height: 16px; border-radius: 50%; background: #aaa; flex-shrink: 0; }

    #gameover {
      display: none; position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; gap: 14px; animation: goIn .4s ease;
    }
    #gameover.on { display: flex; }
    @keyframes goIn { from{opacity:0;transform:scale(.94)} to{opacity:1;transform:scale(1)} }
    #go-title { font-size: 2rem; font-weight: 900; }
    #go-score { color: var(--muted); font-size: .95rem; }
    #go-score strong { color: var(--text); font-size: 1.8rem; display: block; margin-top: 4px; }
    #restart-btn {
      margin-top: 10px; background: rgba(110,70,220,.22);
      border: 2px solid rgba(120,80,230,.55); color: #c0a0ff;
      padding: 13px 38px; border-radius: 30px; font-size: 1rem;
      font-weight: 700; cursor: pointer; transition: background .15s; letter-spacing: .03em;
    }
    #restart-btn:hover { background: rgba(110,70,220,.42); }

    @keyframes pageIn { from{opacity:0} to{opacity:1} }
    body { animation: pageIn .25s ease; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<header>
  <a class="brand" href="/" aria-label="Gamed.fun">
    <img src="/logo.svg" alt=""><span>Gamed.fun</span>
  </a>
  <div class="hdr-r">
    <button id="themeBtn" onclick="toggleTheme()">☀️</button>
  </div>
</header>

<div id="hud">
  <div id="next-box">
    <div id="next-dot"></div>
    <span>Next: <span id="next-name">Moon</span></span>
  </div>
  <div id="score-el">0</div>
</div>

<div id="gameover">
  <div style="font-size:3.5rem">🌌</div>
  <div id="go-title">Overflowed!</div>
  <div id="go-score">Score<strong id="go-val">0</strong></div>
  <button id="restart-btn">↺ Play Again</button>
</div>

<script>
'use strict';

// ── THEME ─────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = n;
  localStorage.setItem('gf-theme', n);
  document.getElementById('themeBtn').textContent = n === 'dark' ? '☀️' : '🌙';
}
document.getElementById('themeBtn').textContent =
  document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';

// ── PLANET DATA ───────────────────────────────────────────────────────────────
const PLANETS = [
  { name:'Moon',    hex:'#c2c2d8', r:18,  pts:1  },
  { name:'Mercury', hex:'#b5835a', r:26,  pts:3  },
  { name:'Mars',    hex:'#c1440e', r:36,  pts:6  },
  { name:'Earth',   hex:'#2a7ae2', r:48,  pts:10 },
  { name:'Neptune', hex:'#5080e8', r:62,  pts:15 },
  { name:'Saturn',  hex:'#e8c87a', r:80,  pts:21 },
  { name:'Jupiter', hex:'#d4903a', r:100, pts:28 },
  { name:'Sun',     hex:'#ffcc00', r:124, pts:36 },
];
const MAX_SPAWN = 4;

// ── CANVAS ────────────────────────────────────────────────────────────────────
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const W = window.innerWidth, H = window.innerHeight;
cvs.width = W; cvs.height = H;

// ── LAYOUT ────────────────────────────────────────────────────────────────────
const CX    = W / 2;
const CTRW  = Math.min(380, W - 40);
const WALL  = 16;
const LEFT  = CX - CTRW / 2;
const RIGHT = CX + CTRW / 2;
const FLOOR = H - 50;
const DANGER_Y = 130;
const DROP_Y   = 76;

// ── COLOR HELPERS ─────────────────────────────────────────────────────────────
function hexRGB(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function lighten(hex, t) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${Math.min(255,r+(255-r)*t)|0},${Math.min(255,g+(255-g)*t)|0},${Math.min(255,b+(255-b)*t)|0})`;
}
function darken(hex, t) {
  const [r,g,b] = hexRGB(hex);
  return `rgb(${r*(1-t)|0},${g*(1-t)|0},${b*(1-t)|0})`;
}

// ── MATTER.JS ─────────────────────────────────────────────────────────────────
const { Engine, Bodies, World, Events } = Matter;
const engine = Engine.create({ gravity: { x:0, y:2.8 } });
const world  = engine.world;

World.add(world, [
  Bodies.rectangle(LEFT - WALL/2,  H/2,           WALL,            H*3,  { isStatic:true }),
  Bodies.rectangle(RIGHT + WALL/2, H/2,           WALL,            H*3,  { isStatic:true }),
  Bodies.rectangle(CX,             FLOOR + WALL/2, CTRW + WALL*2,  WALL, { isStatic:true }),
]);

// ── PLANET POOL ───────────────────────────────────────────────────────────────
const planets = [];
const bodyMap = new Map();

function createPlanet(mx, my, tier) {
  const pd   = PLANETS[tier];
  const body = Bodies.circle(mx, my, pd.r, {
    restitution: 0.22, friction: 0.55, frictionAir: 0.01, density: 0.002, label:'planet',
  });
  World.add(world, body);
  const p = { body, tier, merging:false, born:performance.now(), scale:1 };
  planets.push(p);
  bodyMap.set(body.id, p);
  return p;
}

function removePlanet(p) {
  World.remove(world, p.body);
  bodyMap.delete(p.body.id);
  const i = planets.indexOf(p);
  if (i !== -1) planets.splice(i, 1);
}

function punchScale(p) {
  p.scale = 1.5;
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 280);
    p.scale = 1.5 - 0.5 * t;
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ── MERGE ─────────────────────────────────────────────────────────────────────
const pending = new Set();

Events.on(engine, 'collisionStart', ({ pairs }) => {
  for (const { bodyA, bodyB } of pairs) {
    const pa = bodyMap.get(bodyA.id);
    const pb = bodyMap.get(bodyB.id);
    if (!pa || !pb)                     continue;
    if (pa.tier !== pb.tier)            continue;
    if (pa.merging || pb.merging)       continue;
    if (pa.tier >= PLANETS.length - 1) continue;

    pa.merging = pb.merging = true;
    const key = `${Math.min(bodyA.id,bodyB.id)},${Math.max(bodyA.id,bodyB.id)}`;
    if (pending.has(key)) continue;
    pending.add(key);

    const nt = pa.tier + 1;
    const mx = (bodyA.position.x + bodyB.position.x) / 2;
    const my = (bodyA.position.y + bodyB.position.y) / 2;

    setTimeout(() => {
      pending.delete(key);
      if (!planets.includes(pa) || !planets.includes(pb) || gameOver) return;
      removePlanet(pa); removePlanet(pb);
      const np = createPlanet(mx, my, nt);
      punchScale(np);
      score += PLANETS[nt].pts;
      scoreEl.textContent = score.toLocaleString();
      playMerge(nt);
    }, 16);
  }
});

// ── GAME STATE ────────────────────────────────────────────────────────────────
let gameOver    = false;
let canDrop     = true;
let aimX        = CX;
let score       = 0;
let dangerTicks = 0;
let currentTier = rndTier();
let nextTier    = rndTier();

const scoreEl    = document.getElementById('score-el');
const nextDotEl  = document.getElementById('next-dot');
const nextNameEl = document.getElementById('next-name');
const gameoverEl = document.getElementById('gameover');

function rndTier() { return Math.floor(Math.random() * (MAX_SPAWN + 1)); }
function refreshNext() {
  nextDotEl.style.background = PLANETS[nextTier].hex;
  nextNameEl.textContent     = PLANETS[nextTier].name;
}
refreshNext();

// ── DROP ──────────────────────────────────────────────────────────────────────
function clampX() {
  const r = PLANETS[currentTier].r;
  return Math.max(LEFT + r + 2, Math.min(RIGHT - r - 2, aimX));
}

function dropPlanet() {
  if (!canDrop || gameOver) return;
  canDrop = false;
  createPlanet(clampX(), DROP_Y, currentTier);
  playDrop(currentTier);
  currentTier = nextTier;
  nextTier    = rndTier();
  refreshNext();
  setTimeout(() => { canDrop = true; }, 480);
}

cvs.addEventListener('mousemove', e => { aimX = e.clientX; });
cvs.addEventListener('click', dropPlanet);
cvs.addEventListener('touchmove', e => { aimX = e.touches[0].clientX; }, { passive:true });
cvs.addEventListener('touchend', e => { aimX = e.changedTouches[0].clientX; dropPlanet(); }, { passive:true });

// ── GAME OVER ─────────────────────────────────────────────────────────────────
function checkOverflow() {
  if (gameOver) return;
  const now  = performance.now();
  const over = planets.some(p =>
    !p.merging &&
    now - p.born > 1800 &&
    p.body.position.y < DANGER_Y &&
    p.body.speed < 1.5
  );
  if (over) {
    dangerTicks++;
    if (dangerTicks > 90) doGameOver();
  } else {
    dangerTicks = Math.max(0, dangerTicks - 2);
  }
}

function doGameOver() {
  gameOver = true;
  document.getElementById('go-val').textContent = score.toLocaleString();
  gameoverEl.classList.add('on');
  document.title = 'Game Over — Planet Stack';
}

document.getElementById('restart-btn').addEventListener('click', () => {
  [...planets].forEach(removePlanet);
  bodyMap.clear(); pending.clear();
  score = 0; scoreEl.textContent = '0';
  gameOver = false; dangerTicks = 0; canDrop = true;
  currentTier = rndTier(); nextTier = rndTier();
  refreshNext();
  gameoverEl.classList.remove('on');
  document.title = 'Planet Stack';
});

// ── DRAW ──────────────────────────────────────────────────────────────────────
function drawPlanet(x, y, r, tier, alpha) {
  const pd = PLANETS[tier];
  ctx.save();
  ctx.globalAlpha = alpha ?? 1;

  // Glow for Sun
  if (tier === 7) {
    ctx.shadowBlur  = 28;
    ctx.shadowColor = '#ff9900';
  }

  // Sphere gradient (light top-left → dark bottom-right)
  const grad = ctx.createRadialGradient(
    x - r * 0.32, y - r * 0.36, r * 0.06,
    x,            y,             r
  );
  grad.addColorStop(0,    lighten(pd.hex, 0.72));
  grad.addColorStop(0.45, pd.hex);
  grad.addColorStop(1,    darken(pd.hex, 0.52));

  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();

  // Planet name label on medium+ planets
  if (r >= 48 && (alpha ?? 1) > 0.5) {
    ctx.save();
    ctx.globalAlpha = 0.88;
    ctx.fillStyle   = '#fff';
    ctx.font        = `700 ${Math.round(r * 0.27)}px system-ui, sans-serif`;
    ctx.textAlign   = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(pd.name, x, y);
    ctx.restore();
  }
}

function draw() {
  const dark = document.documentElement.dataset.theme === 'dark';
  ctx.clearRect(0, 0, W, H);

  // Walls
  const wallColor = dark ? '#1a1a36' : '#9090c0';
  ctx.fillStyle = wallColor;
  const playH = FLOOR - DANGER_Y;
  ctx.fillRect(LEFT - WALL, DANGER_Y, WALL, playH + WALL); // left
  ctx.fillRect(RIGHT,       DANGER_Y, WALL, playH + WALL); // right
  ctx.fillRect(LEFT - WALL, FLOOR,    CTRW + WALL * 2, WALL); // floor

  // Danger line
  const dangerAlpha = dangerTicks > 0
    ? 0.4 + 0.5 * Math.abs(Math.sin(dangerTicks * 0.12))
    : 0.35;
  ctx.save();
  ctx.globalAlpha = dangerAlpha;
  ctx.strokeStyle = '#ff3333';
  ctx.lineWidth   = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(LEFT, DANGER_Y);
  ctx.lineTo(RIGHT, DANGER_Y);
  ctx.stroke();
  ctx.restore();

  // Planets
  for (const p of planets) {
    if (p.merging) continue;
    const { x, y } = p.body.position;
    const r = PLANETS[p.tier].r * p.scale;
    drawPlanet(x, y, r, p.tier);
  }

  // Aim guide
  if (!gameOver) {
    const ax = clampX();
    const r  = PLANETS[currentTier].r;

    // Vertical guide line
    ctx.save();
    ctx.strokeStyle = dark ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.08)';
    ctx.lineWidth   = 1.5;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(ax, DROP_Y + r);
    ctx.lineTo(ax, FLOOR);
    ctx.stroke();
    ctx.restore();

    // Ghost planet
    drawPlanet(ax, DROP_Y, r, currentTier, 0.28);
  }
}

// ── SOUND ─────────────────────────────────────────────────────────────────────
let audioCtx = null;
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playDrop(tier) {
  try {
    const c = getAC(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 180 + tier * 28;
    g.gain.setValueAtTime(0.09, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.18);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.18);
  } catch {}
}
function playMerge(tier) {
  try {
    const c = getAC(), base = 260 + tier * 55;
    [1, 1.26, 1.5].forEach((ratio, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'triangle'; o.frequency.value = base * ratio;
      const t = c.currentTime + i * 0.07;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.09, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.45);
    });
  } catch {}
}

// ── LOOP ──────────────────────────────────────────────────────────────────────
let lastTime = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(now - lastTime, 48);
  lastTime  = now;
  Engine.update(engine, dt);
  checkOverflow();
  draw();
  document.title = gameOver
    ? 'Game Over — Planet Stack'
    : `${score.toLocaleString()} — Planet Stack`;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
