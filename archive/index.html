<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gamed.fun archive</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafafa;
      --text: #111;
      --muted: #777;
      --border: #e8e8e8;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(circle, #d4d4d4 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding-inline: 40px;
    }
    header { padding-top: 70px; padding-bottom: 36px; }
    .site-name {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 44%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 0;
      text-decoration: none;
    }
    .tagline { color: var(--muted); margin-top: 10px; font-weight: 600; }
    .back {
      display: inline-block;
      margin-top: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: .82rem;
      font-weight: 800;
      padding: 10px 14px;
      text-decoration: none;
      box-shadow: 0 8px 28px -18px rgba(0,0,0,.28);
    }
    main { padding-bottom: 90px; }
    .section-label {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: inherit;
      display: flex;
      flex-direction: column;
      min-height: 230px;
      overflow: hidden;
      padding: 28px 26px 24px;
      position: relative;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px -8px rgba(0,0,0,.12);
    }
    .neon-cat-mark {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #0f172a;
      border: 2px solid #39f5ff;
      box-shadow: 0 12px 24px -14px rgba(57, 245, 255, 0.85);
      margin-bottom: 18px;
      overflow: hidden;
      position: relative;
    }
    .neon-cat-mark::before {
      content: '';
      position: absolute;
      width: 34px;
      height: 18px;
      left: 13px;
      top: 18px;
      border-radius: 9px;
      background: #ff4fd8;
      box-shadow: 0 0 12px rgba(255,79,216,.8);
    }
    .neon-cat-mark::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 10px;
      left: -6px;
      top: 22px;
      background: linear-gradient(90deg, rgba(57,245,255,.1), #39f5ff);
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(57,245,255,.7);
    }
    .neon-cat-face {
      position: absolute;
      width: 16px;
      height: 14px;
      right: 8px;
      top: 12px;
      border-radius: 8px 8px 7px 7px;
      background: #39f5ff;
      box-shadow: 0 0 10px rgba(57,245,255,.8);
    }
    .neon-cat-face::before,
    .neon-cat-face::after {
      content: '';
      position: absolute;
      top: -5px;
      width: 8px;
      height: 8px;
      background: #39f5ff;
      transform: rotate(45deg);
    }
    .neon-cat-face::before { left: 1px; }
    .neon-cat-face::after { right: 1px; }
    .title { font-size: 1.06rem; font-weight: 900; margin-bottom: 8px; }
    .desc { color: var(--muted); font-size: .86rem; line-height: 1.55; flex: 1; }
    .cta {
      color: #3b82f6;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .1em;
      margin-top: 20px;
      text-transform: uppercase;
    }
    @media (max-width: 640px) {
      header, main { padding-inline: 24px; }
      header { padding-top: 52px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="site-name" href="https://gamed.fun/">gamed.fun</a>
    <p class="tagline">older games and experiments</p>
    <a class="back" href="https://gamed.fun/">Back to games</a>
  </header>

  <main>
    <p class="section-label">Archive</p>
    <div class="grid">
      <a class="card" href="/neon-cat/">
        <div class="neon-cat-mark" aria-hidden="true"><span class="neon-cat-face"></span></div>
        <div class="title">Neon Cat Dash</div>
        <div class="desc">Fly through neon space as a glowing cat, collect coins, and dodge obstacles for distance.</div>
        <div class="cta">Play archived game</div>
      </a>
    </div>
  </main>
</body>
</html>
