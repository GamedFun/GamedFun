<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.dataset.theme=localStorage.getItem('gf-theme')||'light';</script>
  <title>gamed.fun archive</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #fafafa;
      --text: #111;
      --muted: #777;
      --border: #e8e8e8;
    }
    body {
      min-height: 100vh;
      background: var(--bg);
      background-image: radial-gradient(circle, #d4d4d4 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header, main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding-inline: 40px;
    }
    header { padding-top: 70px; padding-bottom: 36px; }
    .site-name {
      align-items: center;
      display: inline-flex;
      gap: 14px;
      text-decoration: none;
    }
    .site-mark {
      width: clamp(46px, 8vw, 60px);
      height: clamp(46px, 8vw, 60px);
      align-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 42%, #ec4899 100%);
      box-shadow: 0 18px 42px -24px rgba(99, 102, 241, .8);
      color: #fff;
      display: inline-flex;
      flex: 0 0 auto;
      justify-content: center;
      overflow: hidden;
    }
    .site-mark svg {
      width: 76%;
      height: 76%;
      display: block;
    }
    .site-word {
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 44%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: clamp(2.2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: 0;
      line-height: 1;
    }
    .tagline { color: var(--muted); margin-top: 10px; font-weight: 600; }
    .back {
      display: inline-block;
      margin-top: 20px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-size: .82rem;
      font-weight: 800;
      padding: 10px 14px;
      text-decoration: none;
      box-shadow: 0 8px 28px -18px rgba(0,0,0,.28);
    }
    main { padding-bottom: 90px; }
    .section-label {
      color: var(--muted);
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      color: inherit;
      display: flex;
      flex-direction: column;
      min-height: 230px;
      overflow: hidden;
      padding: 28px 26px 24px;
      position: relative;
      text-decoration: none;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 36px -8px rgba(0,0,0,.12);
    }
    .archive-logo {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: var(--logo-gradient);
      color: #fff;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 24px -14px var(--logo-shadow);
      margin-bottom: 18px;
      overflow: hidden;
      position: relative;
    }
    .archive-logo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 48%);
      pointer-events: none;
    }
    .archive-logo svg {
      width: 34px;
      height: 34px;
      display: block;
      position: relative;
      z-index: 1;
    }
    .logo-typeflow { --logo-gradient: linear-gradient(135deg, #2563eb 0%, #06b6d4 100%); --logo-shadow: rgba(37,99,235,.7); }
    .logo-neon-cat { --logo-gradient: linear-gradient(135deg, #0f172a 0%, #7c3aed 48%, #06b6d4 100%); --logo-shadow: rgba(6,182,212,.75); }
    .title { font-size: 1.06rem; font-weight: 900; margin-bottom: 8px; }
    .desc { color: var(--muted); font-size: .86rem; line-height: 1.55; flex: 1; }
    .cta {
      color: #3b82f6;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .1em;
      margin-top: 20px;
      text-transform: uppercase;
    }
    @media (max-width: 640px) {
      header, main { padding-inline: 24px; }
      header { padding-top: 52px; }
    }
    [data-theme="dark"] { --bg: #111827; --text: #f8fafc; --muted: #9ca3af; --border: rgba(255,255,255,.1); }
    [data-theme="dark"] body { background: #111827; background-image: none; }
    [data-theme="dark"] .card { background: #1f2937; }
    [data-theme="dark"] .back { background: #1f2937; color: var(--text); border-color: var(--border); }
    #themeBtn-arc { position:fixed; top:16px; right:20px; z-index:100; background:var(--bg); border:1px solid var(--border); border-radius:8px; cursor:pointer; font-size:1rem; padding:.3rem .55rem; color:var(--muted); line-height:1; }
  </style>
</head>
<body>
<button id="themeBtn-arc" onclick="toggleTheme()">🌙</button>
  <header>
    <a class="site-name" href="https://gamed.fun/" aria-label="gamed.fun">
      <span class="site-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M18 24h28c6 0 11 5 11 11v5.2c0 4.7-3.8 8.8-8.5 8.8-2.5 0-4.8-1.1-6.4-3l-4.3-4.9H26.2L21.9 46c-1.6 1.9-3.9 3-6.4 3C10.8 49 7 44.9 7 40.2V35c0-6 5-11 11-11Z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="3.8" stroke-linejoin="round"/>
          <path d="M19.5 35h9M24 30.5v9" stroke="currentColor" stroke-width="4.4" stroke-linecap="round"/>
          <circle cx="42" cy="32" r="3.4" fill="currentColor"/>
          <circle cx="49" cy="38" r="3.4" fill="currentColor"/>
        </svg>
      </span>
      <span class="site-word">gamed.fun</span>
    </a>
    <p class="tagline">older games and experiments</p>
    <a class="back" href="https://gamed.fun/">Back to games</a>
  </header>

  <main>
    <p class="section-label">Archive</p>
    <div class="grid">
      <a class="card" href="/typeflow/">
        <div class="archive-logo logo-typeflow" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <rect x="4.8" y="7.4" width="22.4" height="17.2" rx="4.2" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="2.1"/>
            <path d="M9.4 13.1h2.1M14.9 13.1H17M20.5 13.1h2.1M9.4 18.4h2.1M14.9 18.4h7.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M23.7 5.2v5M21.2 7.7h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".9"/>
            <path d="M9.2 25.8h13.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".82"/>
          </svg>
        </div>
        <div class="title">TypeFlow</div>
        <div class="desc">A typing speed test with daily mode, personal bests, and rank progress.</div>
        <div class="cta">Play archived game</div>
      </a>

      <a class="card" href="/neon-cat/">
        <div class="archive-logo logo-neon-cat" aria-hidden="true">
          <svg viewBox="0 0 32 32" role="img">
            <path d="M4.2 20.8h7M2.8 16.5h8.1M5.3 12.2h6.6" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".9"/>
            <path d="M13 14.1h7.6a5.3 5.3 0 0 1 0 10.6H13v-10.6Z" fill="currentColor" fill-opacity=".13" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"/>
            <path d="M19.9 14.1l2.7-3.2 2.7 3.2M24.8 18.2h2.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="23.2" cy="18.2" r="1.05" fill="currentColor"/>
            <path d="M13 21.5c-2.2 0-3.8 1.1-4.9 2.8M17.4 24.7l-1.8 2.5M22.4 24.2l1.8 2.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            <path d="M26.5 21.2l3 1.7-3 1.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/>
          </svg>
        </div>
        <div class="title">Neon Cat Dash</div>
        <div class="desc">Fly through neon space as a glowing cat, collect coins, and dodge obstacles for distance.</div>
        <div class="cta">Play archived game</div>
      </a>
    </div>
  </main>
<script>
(function(){const t=localStorage.getItem('gf-theme')||'light';document.getElementById('themeBtn-arc').textContent=t==='light'?'🌙':'☀️';})();
function toggleTheme(){const n=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=n;localStorage.setItem('gf-theme',n);document.getElementById('themeBtn-arc').textContent=n==='light'?'🌙':'☀️';}
</script>
</body>
</html>
